ygen","o":["Propene","Ethanol","Propanal","Ethanoic acid"],"a":0,"e":"Propene contains both sigma and pi bonds because of its carbon-carbon double bond but contains no oxygen-containing functional group. The other compounds contain oxygen as alcohol, aldehyde or carboxylic acid functional groups.","t":2},{"id":"T10","q":"The oxidation of a secondary alkanol always produces a","o":["Alkanoic acid","Alkanal","Alkanone","Alkene"],"a":2,"e":"Oxidation of a secondary alcohol removes two hydrogen atoms to form a ketone. Further oxidation under ordinary laboratory conditions is difficult because it would require breaking a carbon-carbon bond.","t":10},{"id":"T11","q":"Which compound shows hydrogen bonding between its molecules but does not form ions in water","o":["Ethanoic acid","Ethanol","Sodium ethanoate","Ethyl ethanoate"],"a":1,"e":"Ethanol molecules form intermolecular hydrogen bonds because of the hydroxyl (-OH) group, giving ethanol a relatively high boiling point. However, ethanol remains largely molecular in water and does not ionize significantly, making it a non-electrolyte. Ethanoic acid ionizes partially, while sodium ethanoate is ionic.","t":8},{"id":"T12","q":"Which compound will react with sodium metal but not with sodium hydrogen carbonate","o":["Ethanol","Ethanoic acid","Phenol","Ethanal"],"a":0,"e":"Sodium metal reacts with ethanol to produce sodium ethoxide and hydrogen gas. However, ethanol is not acidic enough to react with sodium hydrogen carbonate. Carboxylic acids react with both sodium metal and sodium hydrogen carbonate because they are much stronger acids.","t":8},{"id":"T13","q":"Which compound contains a carbon atom bonded to both nitrogen and oxygen","o":["Alkanamide","Oxime","Alkanoic acid","Alkanal"],"a":1,"e":"Oximes contain the functional group C=N–OH, meaning the same carbon atom is directly bonded to both nitrogen and oxygen. Alkanamides contain nitrogen but no oxygen attached to the same carbon in this manner.","t":8},{"id":"T14","q":"The number of π bonds present in one molecule of but-2-yne is","o":["1","2","3","4"],"a":1,"e":"But-2-yne contains one carbon-carbon triple bond. A triple bond consists of one sigma bond and two pi bonds. Therefore, each molecule of but-2-yne contains exactly two pi bonds.","t":2},{"id":"T15","q":"Which compound has no hydrogen attached directly to the carbonyl carbon","o":["Ethanal","Propanal","Propanone","Methanal"],"a":2,"e":"In aldehydes, the carbonyl carbon is always attached to at least one hydrogen atom. In ketones, the carbonyl carbon is attached to two carbon atoms and therefore has no hydrogen attached directly to it. Propanone is the only ketone among the options.","t":9},{"id":"T16","q":"Which functional group shows both nucleophilic and electrophilic behaviour","o":["C=C","–OH",">C=O","–CONH₂"],"a":2,"e":"The carbonyl group is polarized because oxygen is more electronegative than carbon. The carbon atom becomes electrophilic and is attacked by nucleophiles, while the oxygen atom can accept electrophiles after protonation. This dual behavior makes the carbonyl group central to many organic reactions.","t":11},{"id":"T17","q":"Which compound will give a sweet smell, does not undergo oxidation, and contains oxygen","o":["Ethanol","Ethanoic acid","Dimethyl ether","Ethanal"],"a":2,"e":"Ethers usually possess pleasant, sweet-smelling odours and are relatively resistant to oxidation because they lack the reactive O-H bond found in alcohols and the carbonyl group present in aldehydes. They also contain oxygen, satisfying all the conditions in the question.","t":8},{"id":"T18","q":"Which reaction converts an alkene directly to an alkanol","o":["Dehydration","Hydrogenation","Hydration","Oxidation"],"a":2,"e":"Hydration involves adding water across the double bond of an alkene, producing an alcohol. For example, ethene reacts with steam in the presence of an acid catalyst to form ethanol.","t":11},{"id":"T19","q":"Which compound is most likely to show geometrical isomerism","o":["Ethene","Propene","But-2-ene","Ethyne"],"a":2,"e":"Geometrical (cis-trans or E-Z) isomerism occurs when each carbon atom of the double bond is attached to two different groups. But- 2-ene satisfies this requirement and therefore exists as cis- and trans- isomers.","t":11},{"id":"T20","q":"Which carbon atom is always sp² hybridized in all organic compounds listed below?","o":["Alkane carbon","Alkene carbon","Carbonyl carbon","Alcohol carbon"],"a":2,"e":"The carbonyl carbon is always sp² hybridized because it forms three sigma bonds and one pi bond. This gives it a trigonal planar geometry. In contrast, alkane carbons are sp³ hybridized, alkene carbons are sp² only if they are part of the double bond, and alcohol carbons are usually sp³ hybridized.","t":2},{"id":"T21","q":"The functional group –CONH₂ is characteristic of","o":["Alkanoic acids","Alkanamides","Oximes","Amines"],"a":1,"e":"The –CONH₂ functional group is the amide (alkanamide) functional group. It contains both a carbonyl group (C=O) and an amino group (– NH₂). Carboxylic acids contain – COOH, oximes contain C=N–OH, while amines contain only –NH₂ without a carbonyl group.","t":7},{"id":"T22","q":"Which compound reacts with both PCl₅ and NaOH(aq)","o":["Ethanol","Ethanal","Ethanoic acid","Ethene"],"a":2,"e":"Ethanoic acid reacts with PCl₅ to form ethanoyl chloride, releasing HCl fumes, and also reacts with NaOH(aq) in a neutralization reaction to form sodium ethanoate and water. Ethanol reacts with PCl₅ but not with NaOH, while ethene does not react with either under normal conditions.","t":2},{"id":"T23","q":"Which transformation involves oxidation, increase in oxidation number, and no carbon–carbon bond breaking","o":["Ethanol → ethene","Ethanol → ethanal","Ethanal → ethene","Ethanoic acid → methane"],"a":1,"e":"Oxidation of ethanol to ethanal increases the oxidation number of carbon by adding oxygen (or removing hydrogen) without breaking any carbon–carbon bond. Dehydration of ethanol to ethene is an elimination reaction, not oxidation.","t":8},{"id":"T24","q":"Which compound has a planar functional group region","o":["Alkanes","Alkanols","Alkanals","Alkoxyalkanes"],"a":2,"e":"The carbonyl carbon in aldehydes is sp² hybridized, giving the carbonyl group a trigonal planar arrangement. Alkanes and alcohol carbons are generally sp³ hybridized, while ethers do not possess a planar carbonyl group.","t":11},{"id":"T25","q":"Which molecule contains two different functional groups","o":["Ethanal","Ethanoic acid","Hydroxyethanoic acid","Propanone"],"a":2,"e":"Hydroxyethanoic acid contains two different functional groups: a hydroxyl group (–OH) and a carboxylic acid group (–COOH). The other compounds each contain only one principal functional group.","t":8},{"id":"T26","q":"Which compound does not undergo nucleophilic addition reactions","o":["Ethanal","Propanone","Ethene","Methanal"],"a":2,"e":"Nucleophilic addition is characteristic of carbonyl compounds because the carbonyl carbon is electrophilic. Ethene mainly undergoes electrophilic addition, not nucleophilic addition.","t":11},{"id":"T27","q":"Which property increases most noticeably when moving from alkanes → alkanols → alkanoic acids","o":["Volatility","Acidity","Unsaturation","Molecular mass"],"a":1,"e":"Moving from alkanes → alcohols → carboxylic acids, acidity increases dramatically because the ability to donate a proton becomes much greater. Alkanes are essentially non-acidic, alcohols are weak acids, and carboxylic acids are significantly stronger due to resonance stabilization of the carboxylate ion.","t":11},{"id":"T28","q":"Which compound forms an oxime but does not contain an –OH group originally","o":["Ethanol","Ethanal","Ethanoic acid","Ethene"],"a":1,"e":"Ethanal contains a carbonyl group that reacts with hydroxylamine to form an oxime. It does not originally contain an –OH group; the –OH in the oxime comes from hydroxylamine during the reaction.","t":9},{"id":"T29","q":"Which of these is not a nuclear reaction","o":["Fusion","Decomposition","Transmutation","Fission","Decay"],"a":1,"e":"Fusion, fission, transmutation, and radioactive decay all involve changes in the atomic nucleus and are therefore nuclear reactions. Ordinary decomposition is a chemical reaction, involving only the rearrangement of electrons and chemical bonds.","t":5},{"id":"T30","q":"Which of these elements is not considered an alkaline earth metal because its oxide and hydroxide show amphoteric behaviour","o":["Mg","Ba","Sr","Be","Ca"],"a":3,"e":"Although beryllium belongs to Group IIA, its oxide (BeO) and hydroxide [Be(OH)₂] are amphoteric, reacting with both acids and bases. This unusual behavior makes beryllium chemically distinct from the other alkaline earth metals.","t":0},{"id":"T31","q":"Which of the following statements is correct about James Chadwick's contribution to atomic theories in 1932","o":["All matters are made up of very tiny particles called atom","Atom is mostly an empty space that is occupied by electrons","Most nuclei also contain a neutral particle called protons","Most nuclei also contain a neutral particle called neutrons","All of the above"],"a":3,"e":"James Chadwick discovered the neutron in 1932, proving that atomic nuclei contain neutral particles called neutrons in addition to protons. The other statements describe contributions from Dalton or Rutherford.","t":5},{"id":"T32","q":"Which of the following electron configurations is correct for nickel","o":["[Kr] 4s¹ 3d⁸","[Kr] 4s¹ 4d⁰","[Kr] 4s² 3d⁷","[Kr] 4s² 3d⁸","[Ar] 4s² 3d⁸"],"a":4,"e":"Nickel has atomic number 28, giving the ground-state electron configuration [Ar] 3d⁸ 4s². The options using [Kr] are incorrect because krypton is a much heavier noble gas.","t":1},{"id":"T33","q":"When four sp³ hybridized carbon orbitals overlap with four 1s orbitals of hydrogen, the shape of the molecule formed is","o":["Linear","Bent","Tetrahedral","Square pyramidal","Square planar"],"a":2,"e":"A carbon atom with sp³ hybridization forms four equivalent hybrid orbitals directed toward the corners of a tetrahedron, producing bond angles of approximately 109.5°, as in methane.","t":2},{"id":"T34","q":"What colour will a metal complex show when it absorbs light with wavelength of 600 nm","o":["Blue","Red","Orange","Yellow","Green"],"a":0,"e":"A complex appears the complementary color of the light it absorbs. Since 600 nm corresponds to orange light, the observed color is blue, its complementary color.","t":4},{"id":"T36","q":"The spin-only magnetic moment (in BM) of Cr²⁺ ion is","o":["5.92","4.90","3.87","2.83","1.73"],"a":1,"e":"Cr²⁺ has the electronic configuration 3d⁴, containing four unpaired electrons. Using the spin-only formula, μ = √[n(n+2)] = √24 ≈ 4.90 BM.","t":4},{"id":"T37","q":"The sp² hybridized orbitals are oriented at an angle of","o":["109°","120°","360°","90°","180°"],"a":1,"e":"In sp² hybridization, three hybrid orbitals arrange themselves in a trigonal planar geometry with bond angles of approximately 120°.","t":2},{"id":"T38","q":"The more the ___ character in an orbital used by carbon and any other atom to form the bond, the larger the bond angle of the molecule.","o":["P","S","D","F","G"],"a":1,"e":"As the s-character of a hybrid orbital increases (sp > sp² > sp³), electrons are held closer to the nucleus, resulting in larger bond angles and stronger bonds.","t":2},{"id":"T39","q":"The more s-character in hybridization, the ___ the bond.","o":["Shorter and stronger","Longer and weaker","Shorter and weaker","Longer and stronger"],"a":0,"e":"Greater s-character brings bonding electrons closer to the nucleus, producing bonds that are shorter, stronger, and less easily broken.","t":2},{"id":"T40","q":"The mixing of s and p orbitals gives","o":["One hybrid orbital","Two hybrid orbitals","Three hybrid orbitals","Four hybrid orbitals","Five hybrid orbitals"],"a":1,"e":"Mixing one s orbital with one p orbital produces two equivalent sp hybrid orbitals, leaving two unhybridized p orbitals available for π-bond formation.","t":2},{"id":"T41","q":"The method used to remove gangue particles from sulfide ores is","o":["Leaching method","Magnetic separation method","Froth flotation method","Gravity separation method","Calcination method"],"a":2,"e":"Froth flotation is the standard method used to concentrate sulphide ores. Finely powdered ore is mixed with water, oil, and air. Sulphide particles attach to air bubbles and rise to the surface as froth, while the gangue sinks because it is not wetted by the oil.","t":3},{"id":"T42","q":"The main ore of aluminium is","o":["Cryolite","Bauxite","Smithsonite","Hematite","Coke"],"a":1,"e":"Bauxite is the principal ore of aluminium. It mainly contains hydrated aluminium oxides and is first purified by the Bayer process before aluminium is extracted by electrolysis in the Hall–Héroult process.","t":3},{"id":"T45","q":"Rank these isoelectronic ions: Na⁺, N³⁻, Mg²⁺, F⁻, O²⁻, Ne in order of decreasing size","o":["Na⁺ < N³⁻ < Mg²⁺ < F⁻ < O²⁻ < Ne","N³⁻ > O²⁻ > F⁻ > Na⁺ > Mg²⁺ > Ne","N³⁻ < O²⁻ < F⁻ < Na⁺ < Mg²⁺ < Ne","Na⁺ > N³⁻ > Mg²⁺ > F⁻ > O²⁻ > Ne","Ne > Na⁺ > N³⁻ > Mg²⁺ > F⁻ > O²⁻"],"a":1,"e":"N³⁻ > O²⁻ > F⁻ > Ne > Na⁺ > Mg²⁺ These species are all isoelectronic (10 electrons each). In an isoelectronic series, ionic radius decreases as nuclear charge increases because the same number of electrons is attracted more strongly by a greater number of protons.","t":0},{"id":"T46","q":"Calculate the mass defect (in kg) of ¹⁴C (Given: Mass of ¹⁴C = 14.003241 amu, Mass of 1 p = 1.007285 amu, Mass of 1 n = 1.006665 amu, 1 amu = 1.6605655 × 10⁻²⁷ kg)","o":["3 × 10⁻²⁸","1.13209 × 10⁻²⁷","0.657 × 10⁻²⁸","6.35 × 10⁻²⁸","1.88 × 10⁻²⁸"],"a":1,"e":"kg Mass defect is obtained by subtracting the actual nuclear mass from the total mass of the separate protons and neutrons. The value in atomic mass units is then converted to kilograms using 1 amu = 1.6605655 × 10⁻²⁷ kg.","t":1},{"id":"T47","q":"An example of a strong-field ligand is","o":["NH₃","OH⁻","CN⁻","Cl⁻","F⁻"],"a":2,"e":"The cyanide ion (CN⁻) is one of the strongest ligands in the spectrochemical series. It produces a large crystal field splitting energy (Δ), often causing electron pairing and the formation of low-spin complexes.","t":4},{"id":"T48","q":"All these can be counted as transition metal ions except","o":["Ti²⁺","Cr²⁺","Co²⁺","Sc³⁺","Fe²⁺"],"a":3,"e":"A transition metal ion must possess a partially filled d-subshell. Sc³⁺ has the electronic configuration 3d⁰, meaning its d-orbitals are completely empty, so it does not satisfy the IUPAC definition of a transition metal ion.","t":4},{"id":"T49","q":"Which of the following statements is false","o":["Carboxylic acids are stronger acids than the corresponding alcohols","Mineral acids are stronger than carboxylic acids","Methanoic acid is a stronger acid than propanoic acid","The higher the number of substituents with –I effect, the higher the acidity of the carboxylic acid"],"a":3,"e":"This statement is the least accurate because acidity depends not only on the number of electron-withdrawing (–I) groups but also on their strength and their position relative to the carboxyl group. The other statements are correct.","t":8},{"id":"T50","q":"Oxidation of methyl-ethanol with acidified K₂Cr₂O₇ results in","o":["Propanal","Propanone","Propanoic acid and propanone","None of the above"],"a":3,"e":"“Methyl-ethanol” refers to 2- propanol (isopropanol). Oxidation with acidified potassium dichromate converts it into propanone (acetone), which is not listed among the options.","t":10},{"id":"T51","q":"Which of the following is TRUE","o":["Polymer fullerenes have multiple graphene sheets","Metallofullerenes have 240 carbon atoms","Endohedral fullerenes have 240 carbon atoms","Carbon nanotubes are cylindrical in shape"],"a":3,"e":"Carbon nanotubes are cylindrical structures formed by rolling graphene sheets into tubes. They possess exceptional mechanical strength, thermal stability, and electrical conductivity.","t":11},{"id":"T52","q":"The bond in fullerenes is","o":["Covalent","Electrovalent","Dative","Fused"],"a":0,"e":"The carbon atoms in fullerenes are joined by strong covalent bonds. Each carbon is approximately sp² hybridized, producing a stable cage- like structure.","t":11},{"id":"T53","q":"Given the reaction CH₃OCH₂CH₃ + conc. HI (excess), the products are","o":["CH₃I and IC₂H₅","CH₃I and IC₃H₇","C₂H₅I and C₂H₅I","C₄H₉I and IC₄H₉"],"a":0,"e":"Excess concentrated HI cleaves ethers completely. Methoxyethane first produces methyl iodide and ethanol, and the ethanol subsequently reacts with HI to give ethyl iodide, yielding CH₃I and C₂H₅I.","t":11},{"id":"T54","q":"Give the IUPAC name of CH₃C(CH₃)CH₂C(CH₃)(CH₃)","o":["2,2-Dimethylpropene","3,3-Dimethylbutene","2,2-Dimethyl-3-butene","3,3-Dimethylpropene"],"a":2,"e":"Following IUPAC rules, the longest chain containing the double bond is selected and numbered appropriately. The structure is therefore named 2,2-dimethylbut-3- ene, represented in the options as 2,2-Dimethyl-3-butene.","t":11},{"id":"T55","q":"A red precipitate forming a white precipitate soluble in excess NH₄OH on addition of dilute HNO₃ and AgNO₃ to Lassaigne’s filtrate indicates the presence of","o":["Bromide","Sulphur","Iodide","Chloride"],"a":2,"e":"In Lassaigne’s test, iodide ions react with silver nitrate to produce a yellow precipitate of silver iodide (AgI), which is insoluble in ammonia. Chloride gives a white precipitate, while bromide produces a cream precipitate.","t":6},{"id":"T56","q":"Which of the following statements is incorrect","o":["Hybridization involves mixing of atomic orbitals to form new different orbitals","C–C bonds in alkynes are shorter than those in alkenes","The bond angle in sp² hybridization is 120°","sp hybrid orbital is more electronegative than sp² hybrid orbital"],"a":0,"e":"Hybridization produces equivalent (identical) hybrid orbitals, not different ones. The remaining statements are correct: alkynes have shorter bonds than alkenes, sp² bond angles are 120°, and sp orbitals have greater s-character than sp² orbitals.","t":2},{"id":"T57","q":"An organic compound contains 52.18% carbon and 13.04% hydrogen. No N, S, or halogens. The empirical formula is","o":["C₂H₆O","C₃H₈O","C₂H₄O","C₄H₁₀O"],"a":0,"e":"Taking 100 g of the compound: ● Carbon = 52.18/12 ≈ 4.35 mol ● Hydrogen = 13.04/1 ≈ 13.04 mol ● Oxygen = 34.78/16 ≈ 2.17 mol Dividing each by 2.17 gives approximately 2 : 6 : 1, so the empirical formula is C₂H₆O.","t":6},{"id":"T58","q":"Ozonolysis of an alkene produced one molecule each of propanal and methanal. The alkene is","o":["1-Pentene","1-Butene","2-Pentene","2-Butene"],"a":0,"e":"Ozonolysis splits the C=C bond. Formation of methanal (HCHO) indicates that one carbon of the double bond was terminal (CH₂=), while the other fragment becomes propanal, identifying the alkene as 1- pentene.","t":9},{"id":"T59","q":"Cyclopropanol is a ----- alcohol","o":["Primary","Secondary","Tertiary","Quaternary"],"a":0,"e":"Cyclopropanol is a primary alcohol because the carbon atom bearing the hydroxyl group (–OH) is attached to only one other carbon atom. Alcohols are classified according to the number of carbon atoms bonded to the carbon carrying the –OH group.","t":10},{"id":"T60","q":"The following are true of amines, EXCEPT","o":["Amines are basic, acidic, and neutral","Amines have a lone pair on the nitrogen atom","Amines react with HCl to produce fumes","Amines form salts with acids"],"a":0,"e":"Amines are generally basic because the nitrogen atom has a lone pair of electrons that readily accepts a proton (H⁺). They are not acidic under normal conditions. Amines also react with acids such as HCl to form ammonium salts.","t":7},{"id":"T61","q":"Which of the following statements is TRUE I. Ketones form intermolecular hydrogen bonding II. Ketones have lower boiling points than alcohols III. Ketones have lower boiling points than carboxylic acids IV. Ketones have higher boiling points than carboxylic acids","o":["I & II","II & III","II & IV","III & IV"],"a":1,"e":"Ketones do not form intermolecular hydrogen bonds among themselves because they lack an O–H bond. Therefore, they have lower boiling points than alcohols and carboxylic acids, both of which exhibit strong intermolecular hydrogen bonding.","t":8},{"id":"T63","q":"All the following are true for an electrophile, EXCEPT","o":["They are electron-deficient","They are positively charged","They attack centres of positive charge","They seek electron-rich centres"],"a":2,"e":"Electrophiles are electron-deficient species that seek electron-rich (negative) centres. They do not attack positively charged centres; instead, they accept electron pairs from nucleophiles.","t":11},{"id":"T64","q":"The correct order for nucleophilic attack on the carbonyl carbon is","o":["Propanone > Propanal > Acetophenone > Benzaldehyde","Benzaldehyde > Acetophenone > Propanal > Propanone","Propanal > Propanone > Benzaldehyde > Acetophenone","None of the above"],"a":2,"e":"Nucleophilic addition is fastest in aldehydes because they have less steric hindrance and a more electrophilic carbonyl carbon than ketones. Aromatic carbonyl compounds are less reactive due to resonance stabilization with the benzene ring.","t":9},{"id":"T66","q":"The IUPAC name of CH₃OH(OH)CH(CH₃)CH(CH₃)CH₂C OOH is","o":["2-Hydroxy-3-chlorohexanoic acid","4-Chloro-5-hydroxyhexanoic acid","4-Chloro-2-hydroxypentanoic acid","2-Hydroxy-4-chlorohexanoic acid"],"a":3,"e":"In carboxylic acids, numbering begins from the carboxyl carbon (C- 1). This places the hydroxyl group at carbon 2 and the chlorine atom at carbon 4, giving 2-hydroxy-4- chlorohexanoic acid.","t":11},{"id":"T67","q":"Which of the following statements is incorrect","o":["Increase in temperature increases reaction rate","A catalyst increases reaction rate by increasing activation energy","Concentration determines the slowest step in a multi-step mechanism","Homolytic fission takes place between atoms of different electronegativity"],"a":1,"e":"Catalysts actually lower the activation energy, providing an alternative reaction pathway. This allows a greater proportion of reacting molecules to possess sufficient energy for successful collisions.","t":11},{"id":"T68","q":"Ethanoic acid reacts with NaOH, propanol, and ammonia to form","o":["Propylamine and ethanoic acid","Propanone and ethanoic acid","Propanol and ethanoic acid","Propanamide and ethanoic acid"],"a":3,"e":"Ammonia reacts with acid anhydrides to produce an amide and a carboxylic acid. From the compounds given, the products correspond to propanamide and ethanoic acid.","t":8},{"id":"T69","q":"The effective nuclear charge generally increases across a period because","o":["Shielding increases significantly","Nuclear charge increases faster than shielding","Atomic size increases","Number of shells increases"],"a":1,"e":"Across a period, the number of protons increases while electrons are added to the same principal energy level. Since shielding changes very little, the effective nuclear charge increases, pulling electrons closer to the nucleus.","t":0},{"id":"T70","q":"Which species has the largest ionic radius","o":["Na⁺","Mg²⁺","Al³⁺","N³⁻"],"a":3,"e":"Among these ions, N³⁻ has the largest ionic radius. Although all are isoelectronic (10 electrons), N³⁻ has the fewest protons, so its electrons are held least strongly, giving it the largest size.","t":0},{"id":"T71","q":"The decrease in atomic radius across a period is mainly due to","o":["Increased shielding","Increased principal quantum number","Increased effective nuclear charge","Formation of ions"],"a":2,"e":"Across a period, electrons are added to the same shell while nuclear charge increases. The stronger attraction between the nucleus and the outer electrons causes the atomic radius to decrease.","t":0},{"id":"T72","q":"Which group shows the lowest first ionization energy","o":["Group IVA","Group IIA","Group IA","Group VIIA"],"a":2,"e":"Group IA (alkali metals) have one valence electron, which is easily removed because it is far from the nucleus and well shielded. Consequently, they possess the lowest first ionization energies.","t":0},{"id":"T73","q":"The first ionization energy of boron is lower than that of beryllium because","o":["Boron has a higher atomic number","The electron removed is a p- electron","Boron has greater shielding","Boron is larger in size"],"a":1,"e":"Beryllium has the stable configuration 2s², whereas boron is 2s²2p¹. The 2p electron in boron is higher in energy and less tightly held than the 2s electron in beryllium, making it easier to remove.","t":0},{"id":"T74","q":"Which element has the highest electron affinity","o":["Fluorine","Chlorine","Oxygen","Nitrogen"],"a":1,"e":"Although fluorine is more electronegative, chlorine has the highest electron affinity because its larger atomic size reduces electron– electron repulsion when an additional electron is added.","t":0},{"id":"T75","q":"Which element is extracted by electrolysis of molten salts","o":["Iron","Zinc","Aluminium","Copper"],"a":2,"e":"Aluminium is extracted by electrolysis of molten aluminium oxide dissolved in cryolite because it is too reactive to be reduced chemically by carbon or other reducing agents.","t":3},{"id":"T76","q":"Which compound contains two carbon atoms that are sp² hybridized and one that is sp hybridized","o":["Propene","Propyne","Propanal","Propanone"],"a":1,"e":"In propyne (CH₃–C≡CH), the two carbon atoms involved in the triple bond are sp hybridized, while the methyl carbon is sp³ hybridized. The wording of the question is inaccurate because none of the options contain two sp² carbons and one sp carbon. Based on the available options, this appears to be the examiner’s intended answer, but the question is chemically flawed.","t":2},{"id":"T77","q":"The purpose of cryolite in aluminium extraction is to","o":["Act as a catalyst","Lower melting point of Al₂O₃","Increase conductivity of aluminium","Prevent oxidation"],"a":1,"e":"Cryolite (Na₃AlF₆) lowers the melting point of aluminium oxide from about 2050°C to approximately 950°C and also improves the electrical conductivity of the molten electrolyte.","t":3},{"id":"T78","q":"In the blast furnace, limestone is added to","o":["Reduce iron oxide","Act as fuel","Remove acidic impurities","Increase temperature"],"a":2,"e":"Limestone (CaCO₃) decomposes to calcium oxide (CaO), which reacts with acidic silica impurities to form calcium silicate (CaSiO₃) slag that can be removed from the blast furnace.","t":3},{"id":"T79","q":"The compound removed as slag during iron extraction is","o":["CaO","SiO₂","CaSiO₃","Fe₃O₄"],"a":2,"e":"Silica impurities react with calcium oxide to form calcium silicate (CaSiO₃), which floats on the molten iron as slag and is removed.","t":3},{"id":"T80","q":"Which reaction produces carbon monoxide in the blast furnace","o":["C + O₂ → CO₂","CO₂ + C → 2CO","Fe₂O₃ + CO → Fe + CO₂","CaCO₃ → CaO + CO₂"],"a":1,"e":"Carbon monoxide, the main reducing agent in the blast furnace, is produced when carbon dioxide formed lower in the furnace reacts with hot coke: CO₂ + C → 2CO.","t":3},{"id":"T81","q":"Which metal shows amphoteric behavior","o":["Magnesium","Calcium","Beryllium","Strontium"],"a":2,"e":"Beryllium exhibits amphoteric behaviour, meaning its oxide (BeO) and hydroxide [Be(OH)₂] react with both acids and bases. This distinguishes it from the other alkaline earth metals, whose oxides and hydroxides are mainly basic.","t":0},{"id":"T82","q":"Transition metals are characterized by","o":["Completely filled d orbitals","Variable oxidation states","High reactivity with water","Low melting points"],"a":1,"e":"Transition metals commonly exhibit multiple oxidation states because both their ns and (n−1)d electrons can participate in bonding. This property contributes to their rich chemistry and formation of numerous compounds.","t":4},{"id":"T83","q":"The color of transition metal complexes is mainly due to","o":["Charge on ligands","d–d transitions","Metal–metal bonding","Ionic radii differences"],"a":1,"e":"The colours of transition metal complexes arise mainly from d–d electronic transitions. When visible light is absorbed, electrons are promoted between split d-orbitals, and the complementary colour is observed.","t":4},{"id":"T84","q":"Which ion is colorless","o":["Cu²⁺","Fe²⁺","Zn²⁺","Ni²⁺"],"a":2,"e":"Zn²⁺ has a 3d¹⁰ electronic configuration with a completely filled d-subshell. Since no d–d transitions are possible, Zn²⁺ ions are colourless.","t":4},{"id":"T85","q":"The oxidation state of cobalt in [Co(NH₃)₆]Cl₃ is","o":["+1","+2","+3","+6"],"a":2,"e":"In [Co(NH₃)₆]Cl₃, ammonia is a neutral ligand while the three chloride ions are outside the coordination sphere as Cl⁻. Therefore, cobalt must have an oxidation state of +3.","t":4},{"id":"T86","q":"Which ligand is the strongest field ligand","o":["Cl⁻","H₂O","NH₃","CO"],"a":3,"e":"Carbon monoxide (CO) is among the strongest field ligands in the spectrochemical series. It produces a very large crystal field splitting and commonly forms low-spin complexes.","t":4},{"id":"T87","q":"A high-spin complex results from","o":["Strong field ligands","Large Δ₀","Weak field ligands","Paired electrons"],"a":2,"e":"Weak field ligands produce a small crystal field splitting energy (Δ₀), making it energetically favourable for electrons to occupy higher-energy orbitals rather than pair up. This results in high-spin complexes.","t":4},{"id":"T88","q":"The spin-only magnetic moment depends on","o":["Atomic mass","Number of unpaired electrons","Oxidation state only","Coordination number"],"a":1,"e":"The spin-only magnetic moment depends directly on the number of unpaired electrons present in the metal ion and is calculated using: Mu = sqrt{n(n+2)}{ BM} where n is the number of unpaired electrons.","t":4},{"id":"T89","q":"Which complex is diamagnetic","o":["Fe²⁺ (d⁶ high spin)","Mn²⁺ (d⁵)","Zn²⁺ (d¹⁰)","Co²⁺ (d⁷)"],"a":2,"e":"Zn²⁺ Zn²⁺ has a completely filled d¹⁰ configuration, meaning all electrons are paired. Consequently, complexes containing Zn²⁺ are diamagnetic.","t":4},{"id":"T90","q":"The coordination number in [Ni(CN)₄]²⁻ is","o":["2","4","6","8"],"a":1,"e":"The coordination number is the number of donor atoms directly bonded to the central metal ion. In [Ni(CN)₄]²⁻, four cyanide ligands coordinate to nickel, giving a coordination number of 4.","t":4},{"id":"T91","q":"The name of [Pt(CN)₄]²⁻ is","o":["Tetracyanoplatinum(II)","Tetracyanoplatinate(II)","Platinum tetracyanide","Cyanoplatinum(IV)"],"a":1,"e":"Because the complex ion carries a negative charge, the metal name ends in –ate. Four cyanide ligands are named tetracyano-, and platinum is in the +2 oxidation state, giving tetracyanoplatinate(II).","t":4},{"id":"T92","q":"The central metal in [Fe(CO)₅] has oxidation state","o":["+2","+3","0","−2"],"a":2,"e":"Carbon monoxide (CO) is a neutral ligand. Since the complex [Fe(CO)₅] is neutral overall, the oxidation state of iron must be 0.","t":4},{"id":"T93","q":"A complex that absorbs orange light will appear","o":["Red","Green","Blue","Yellow"],"a":2,"e":"A complex appears the complementary colour of the light it absorbs. Since orange light is absorbed, the observed colour is blue.","t":4},{"id":"T94","q":"Paramagnetism arises due to","o":["Paired electrons","Electron deficiency","Unpaired electrons","Ligand charge"],"a":2,"e":"Paramagnetism results from the presence of one or more unpaired electrons, which align with an external magnetic field and cause the substance to be attracted to the field.","t":4},{"id":"T95","q":"Which metal is least reactive","o":["Sodium","Magnesium","Iron","Gold"],"a":3,"e":"Gold is one of the least reactive metals, occurring naturally in the elemental state because it resists oxidation and corrosion.","t":10},{"id":"T96","q":"Froth flotation is used for concentration of","o":["Oxide ores","Carbonate ores","Sulphide ores","Halide ores"],"a":2,"e":"Froth flotation is specifically used to concentrate sulphide ores because sulphide particles are preferentially wetted by oil and carried to the surface by air bubbles.","t":3},{"id":"T97","q":"Calcination is carried out in","o":["Excess air","Absence of air","Presence of reducing agent","Presence of water"],"a":1,"e":"Calcination involves heating an ore in the absence or limited supply of air, mainly to remove moisture and carbon dioxide from hydrated and carbonate ores.","t":3},{"id":"T98","q":"In electrolytic refining, the anode is made of","o":["Pure metal","Impure metal","Graphite","Platinum"],"a":1,"e":"During electrolytic refining, the impure metal serves as the anode, while a thin sheet of pure metal is the cathode. Pure metal is deposited on the cathode as electrolysis proceeds.","t":3},{"id":"T99","q":"The major reason transition metals form alloys easily is","o":["High electronegativity","Similar atomic sizes","High reactivity","Filled d orbitals"],"a":1,"e":"Transition metals readily form alloys because their atoms have similar atomic radii, allowing them to replace one another in metallic crystal lattices without significantly disturbing the structure.","t":4},{"id":"T100","q":"Which functional group transformation involves no change in carbon hybridization","o":["Primary alkanol → alkanal","Alkanal → alkanoic acid","Alkanone → oxime","Alkene → alkane"],"a":2,"e":"In converting an alkanone to an oxime, the carbonyl carbon remains sp² hybridized. The reaction replaces the oxygen with a C=N–OH group without changing the hybridization of that carbon. The other transformations involve changes between sp³ and sp² hybridization.","t":2},{"id":"C2","q":"Oxidation of methylethanol (propan-1-ol) with acidified K2Cr2O7 results in?","o":["propanal","propanone","propanoic acid","none of the above"],"a":2,"e":"Acidified K2Cr2O7 is a strong oxidant: a primary alcohol goes to the aldehyde and then straight on to the carboxylic acid, so propan-1-ol gives propanoic acid (propanal only if distilled off as it forms).","t":10},{"id":"C5","q":"This reaction CH3OCH2CH2CH3 + conc. HI in excess acid will yield:","o":["C2H5I and IC3H7","CH3I and IC3H7","C2H5I and C3H7I","CH3I and C3H7I"],"a":3,"e":"Excess conc. HI cleaves both C–O bonds of the ether, and the alcohol first formed is converted to an iodide too. CH3–O–C3H7 therefore gives CH3I + C3H7I.","t":11},{"id":"C6","q":"Give the IUPAC name of CH3C(CH3)2CH=CH2","o":["2,2-dimethylpropene","3,3-dimethylbut-1-ene","2,2-dimethyl-3-butene","3-dimethylpropene"],"a":1,"e":"The longest chain containing C=C has 4 carbons (but-1-ene); number from the end nearest the double bond, which puts both methyls on C3: 3,3-dimethylbut-1-ene.","t":11},{"id":"C7","q":"The formation of a white precipitate that is soluble in excess NH4OH on addition of dilute HNO3 Y and AgNO3 to Lassaigne’s filtrate indicates the presence of:","o":["bromide","sulphur","iodide","chloride"],"a":3,"e":"AgCl is white and dissolves in dilute NH4OH as [Ag(NH3)2]+. AgBr is pale yellow and only partly soluble; AgI is yellow and insoluble. White + soluble means chloride.","t":6},{"id":"C8","q":"Which of the following statement is incorrect?","o":["hybridization of orbitals involves mixing of atomic orbitals","C–C bonds in alkynes is shorter than that of alkenes","the bond angle in sp2 hybridization is 120°","sp hybrid orbital is less electronegative than sp2 hybrid orbital"],"a":3,"e":"An sp carbon has 50% s-character versus 33% for sp2, so it holds bonding electrons more tightly. sp is MORE electronegative than sp2, which makes D the incorrect statement.","t":1},{"id":"C9","q":"An organic compound A on quantitative analysis contains 52.18% C and 13.04% H. Determine the empirical formula:","o":["C2H6O","C4H10O","C3H8O","C5H12O"],"a":0,"e":"C: 52.18/12 = 4.35; H: 13.04/1 = 13.04; O: 34.78/16 = 2.17. Dividing by 2.17 gives C2 : H6 : O1, so C2H6O.","t":6},{"id":"C10","q":"Ozonolysis of an alkene produced a molecule each of propanal and methanal. The alkene is:","o":["1-butene","1-pentene","2-pentene","2-butene"],"a":0,"e":"Ozonolysis breaks C=C and puts C=O on each carbon. Joining the carbonyl carbons of CH3CH2CHO and HCHO gives CH3CH2CH=CH2, which is but-1-ene.","t":9},{"id":"C18","q":"The IUPAC name for CH3CH(OH)CH(Cl)CH2CH2COOH is?","o":["2-hydroxy-3-chlorohexanoic acid","4-chloro-5-hydroxyhexanoic acid","4-chloro-2-hydroxypentanoic acid","2-hydroxy-4-chlorohexanoic acid"],"a":1,"e":"Number the chain from COOH as C1: Cl is on C4 and OH on C5 of a six-carbon chain. Alphabetical order gives 4-chloro-5-hydroxyhexanoic acid.","t":11},{"id":"C21","q":"Which of the following compounds could have Z/E isomers?","o":["2-methyl-1-butene","2-methyl-2-butene","1-chloro-2-methyl-2-butene","3-chloro-2-methyl-2-butene"],"a":2,"e":"E/Z isomerism needs two different groups on EACH alkene carbon. In ClCH2–C(CH3)=CH–CH3, C2 has CH3/CH2Cl and C3 has H/CH3. The others have two identical groups on one carbon.","t":11},{"id":"C23","q":"The real basis of Markovnikoff’s rule is:","o":["stability of the intermediate carbocation","stability of the product","stability of the adding compound","stability of the alkene"],"a":0,"e":"Markovnikov addition is explained by the more stable carbocation intermediate (3° > 2° > 1°); the nucleophile then adds to that carbocation.","t":11},{"id":"C25","q":"CH3CHO + NH2NH2 → CH3CH=NNH2 + H2O is an example of:","o":["Substitution","Addition","Rearrangement","Condensation"],"a":3,"e":"An aldehyde and hydrazine first add, then a small molecule (water) is lost. Addition followed by loss of water is a condensation reaction.","t":11},{"id":"C26","q":"Which of the following is not true about Lassaigne’s test?","o":["Elements are tested as their inorganic salts","Na2S, NaCN and NaX are formed","It can be used to detect the presence of oxygen","Sulphur can be detected by lead acetate"],"a":2,"e":"Lassaigne's fusion with sodium detects N, S and halogens as NaCN, Na2S and NaX. Oxygen is not detected by it, so C is the untrue statement.","t":6},{"id":"C27","q":"The IUPAC name of (CH3)2CHCH2CH2CH(OH)CH2COOH is:","o":["5-hydroxy-2-methylheptanoic acid","1,3-dihydroxy-6-methylheptane","3-hydroxy-6-methylheptanoic acid","2-methyl-5-hydroxyheptanoic acid"],"a":2,"e":"COOH is C1 and the chain is heptanoic acid. OH is on C3 and a methyl is on C6, giving 3-hydroxy-6-methylheptanoic acid.","t":11},{"id":"C28","q":"Identify the false statement:","o":["a barrel of crude oil is 180 liters","gas fraction comprises normal and branched C1-C5 alkanes","heavy gas oils boil between 305°C and 405°C","kerosene is used as jet fuel"],"a":0,"e":"A barrel of crude oil is about 159 litres (42 US gallons), not 180 litres, so A is false.","t":11},{"id":"C29","q":"Which is untrue? Reactions of alkanes with chlorine:","o":["goes by chain reaction mechanism","takes place only at high temperature or sunlight","produces radicals","usually gives a high yield of only one product"],"a":3,"e":"Free-radical chlorination of alkanes needs UV light or heat, runs by a chain mechanism and gives a MIXTURE of products. It does not give a high yield of one product.","t":11},{"id":"C30","q":"Which is incorrect about inductive and mesomeric effects:","o":["Effects caused by difference in electronegativity/resonance","Effects can be transmitted along the chain","There is no visible shift of electron in mesomeric but there is in inductive","There is no visible shift of electron in inductive but there is in mesomeric effect"],"a":2,"e":"The inductive effect is a permanent σ-bond polarisation due to electronegativity and fades along the chain. The mesomeric effect is a visible π-electron shift (curly arrows). Statement C reverses this, so it is wrong.","t":11},{"id":"C31","q":"The chief source of alkene is:","o":["petroleum","by-product from cracking petroleum","polymers","coal tar"],"a":1,"e":"Alkenes come mainly as a by-product of cracking petroleum fractions; they are not found in large amounts in crude oil itself.","t":11},{"id":"C32","q":"Which of the following is incorrect:","o":["Greater s-character = greater electronegativity","Carbon uses sp3 hybrid orbitals for 4 single bonds","The presence of π bond in ethene makes it less reactive than ethane","sp hybrid orbitals point at 180°"],"a":2,"e":"The π bond is weaker and more exposed, so ethene is MORE reactive than ethane. Statement C is therefore incorrect.","t":2},{"id":"C33","q":"When a double bond is formed, the π-bond is created by the overlap of:","o":["s-orbitals","s and p-orbitals","f-orbitals","p-orbitals"],"a":3,"e":"A σ bond forms first by head-on overlap. The π bond forms by sideways overlap of unhybridised p orbitals.","t":2},{"id":"C34","q":"Homolytic fission of a bond gives:","o":["Radicals","Cations","Anions","Radicals and Cations"],"a":0,"e":"Homolytic fission splits the bonding pair evenly, one electron to each atom, so two free radicals form. Heterolytic fission gives ions.","t":11},{"id":"C36","q":"An alkene on ozonolysis yields propanal and propanone. The compound is:","o":["CH3CH2C(CH3)=C(CH3)2","(CH3)2CHCH=CHCH3","CH3CH2CH=C(CH3)2","(CH3)2C=C(CH3)2"],"a":2,"e":"Break the double bond: one side must give CH3CH2CHO (propanal) and the other (CH3)2C=O (propanone). Rejoining gives CH3CH2CH=C(CH3)2.","t":9},{"id":"C38","q":"Which of the following is not true:","o":["Increase in temperature increases reaction rate","The rate determining step is the fastest step","The rate determining step is the slowest step","Heterolytic fission occurs between different electronegativities"],"a":1,"e":"The rate-determining step is the SLOWEST step, because it limits the overall rate. Calling it the fastest step is untrue.","t":11},{"id":"C40","q":"Element that is not a typical alkaline earth metal because of amphoterism:","o":["Mg","Ba","Sr","Be"],"a":3,"e":"Beryllium oxide and hydroxide are amphoteric, and Be is small and covalent. Mg, Ca, Sr and Ba are typical basic alkaline earth metals.","t":0},{"id":"C48","q":"The more the ___ character in an orbital, the larger the bond angle.","o":["p","s","d","f","Hybrid"],"a":1,"e":"The greater the s-character, the larger the bond angle: sp (50% s) is 180°, sp2 (33%) is 120° and sp3 (25%) is 109.5°.","t":2},{"id":"C51","q":"Method used to remove gangue from sulphide ores:","o":["Magnetic separation","Gravity separation","Froth floatation method","Leaching","Distillation"],"a":2,"e":"Sulphide ores are concentrated by froth flotation. The ore is wetted by oil and carried up by air bubbles, while the gangue sinks.","t":3},{"id":"C53","q":"Group IA elements are stored under paraffin/inert liquid because:","o":["They are very expensive","Highly reactive nature","To prevent evaporation","To increase their density","To make them harder"],"a":1,"e":"Group IA metals react violently with air and moisture, so they are kept under paraffin oil or another inert liquid to keep out O2 and H2O.","t":0},{"id":"C54","q":"Burning ores in a limited or absence of oxygen:","o":["Roasting","Calcination","Smelting","Refining","Electrolysis"],"a":1,"e":"Calcination is heating an ore, usually a carbonate or hydroxide, in limited or no air so that it decomposes. Roasting needs excess air.","t":3},{"id":"C55","q":"Decreasing size of Na⁺, N³⁻, Mg²⁺, F⁻ and O²⁻:","o":["Mg²⁺ > Na⁺ > F⁻ > O²⁻ > N³⁻","N³⁻ > O²⁻ > F⁻ > Na⁺ > Mg²⁺","Na⁺ > Mg²⁺ > F⁻ > O²⁻ > N³⁻","F⁻ > O²⁻ > N³⁻ > Na⁺ > Mg²⁺","O²⁻ > N³⁻ > F⁻ > Na⁺ > Mg²⁺"],"a":1,"e":"Isoelectronic ions (10 electrons) get smaller as nuclear charge rises: N3− > O2− > F− > Na+ > Mg2+.","t":11},{"id":"C56","q":"Mass defect (in kg) of ¹⁴₆C:","o":["1.88 × 10⁻²⁸","1.55 × 10⁻²⁷","1.22 × 10⁻²⁶","1.88 × 10⁻²⁵","2.11 × 10⁻²⁸"],"a":0,"e":"Mass defect = (6 protons + 8 neutrons + 6 electrons) − actual mass of C-14, which is about 0.113 u. Converting at 1.66×10⁻²⁷ kg per u gives about 1.88×10⁻²⁸ kg.","t":5},{"id":"C57","q":"An example of a strong-field ligand is:","o":["I⁻","Cl⁻","CO","H₂O","F⁻"],"a":2,"e":"CO is a strong-field ligand (a π-acceptor) high in the spectrochemical series. I−, Cl−, F− and H2O are weak-field ligands.","t":4},{"id":"C59","q":"C6H12 that does not decolourize Br2/CCl4:","o":["1-hexene","2-hexene","3-hexene","cyclohexane","2-methyl-2-pentene"],"a":3,"e":"Cyclohexane is saturated, so it does not add bromine and Br2/CCl4 stays orange. The hexenes decolourise it.","t":4},{"id":"C60","q":"The following will undergo Cannizzaro reaction except:","o":["Formaldehyde","Ethanal","Benzaldehyde","Trimethylacetaldehyde","2,2-dimethylpropanal"],"a":1,"e":"Cannizzaro needs an aldehyde with NO α-hydrogen (HCHO, benzaldehyde, 2,2-dimethylpropanal). Ethanal has α-H, so it undergoes aldol reactions instead.","t":9},{"id":"C61","q":"Excess ethanol + conc. H2SO4 at 140°C produces:","o":["Ethene","Diethyl ether","Ethyl hydrogen sulphate","Ethane","Acetaldehyde"],"a":1,"e":"Excess ethanol with conc. H2SO4 at about 140 °C gives diethyl ether by substitution. At about 170 °C with excess acid it gives ethene.","t":10},{"id":"C62","q":"Which species is NOT a nucleophile?","o":["OH⁻","NH₃","NO₂⁺","CN⁻","H₂O"],"a":2,"e":"NO2+ is an electrophile (electron-deficient). OH−, NH3, CN− and H2O have lone pairs and are nucleophiles.","t":11},{"id":"C63","q":"Property NOT used to detect multiple bonds:","o":["Baeyer's reagent","Molecular mass","Bromine water","Ozonolysis","Catalytic hydrogenation"],"a":1,"e":"Multiple bonds are detected by chemical tests (Baeyer's, bromine water, ozonolysis, hydrogenation). Molecular mass says nothing about unsaturation.","t":11},{"id":"C64","q":"Which statement is incorrect?","o":["sp³ is tetrahedral","sp is linear","sp² is trigonal planar","sp2 hybrid orbital has linear shape","sp³d² is octahedral"],"a":3,"e":"sp2 gives a trigonal planar shape at 120°. A linear shape belongs to sp.","t":2},{"id":"C65","q":"Hybrid orbital utilized by carbon in CH4:","o":["sp","sp²","sp³","dsp²","p³"],"a":2,"e":"Carbon in CH4 forms four equivalent σ bonds from sp3 hybrid orbitals, giving a tetrahedral shape.","t":2},{"id":"C66","q":"Soap precipitates in hard water mainly because the:","o":["Soap is insoluble in water","carboxylate group reacts with calcium/magnesium ions","pH of hard water is too low","Sodium ions are removed","Soap is a liquid"],"a":1,"e":"Soap is RCOO−Na+. The carboxylate reacts with Ca2+ and Mg2+ to give insoluble scum (calcium or magnesium stearate).","t":6},{"id":"C67","q":"Reacts with Methyl Magnesium Bromide to give a primary alcohol:","o":["Acetaldehyde","Propanone","Formaldehyde","Ethylmethylketone","Benzaldehyde"],"a":2,"e":"Grignard reagents give a primary alcohol only with methanal (HCHO), other aldehydes give secondary alcohols, and ketones give tertiary alcohols.","t":10},{"id":"C68","q":"Which is a primary alcohol?","o":["CH3CH2OH","(CH3)2CHOH","(CH3)3COH","CH3CH(OH)CH2CH3","None of the above"],"a":0,"e":"A primary alcohol has the OH carbon bonded to only one other carbon: CH3CH2OH. The others are secondary or tertiary.","t":10},{"id":"C69","q":"The carbon in α-amino acids is chiral because:","o":["it has four different substituents attached to it","it is bonded to nitrogen","it has a high molecular mass","it is in the alpha position","it forms peptide bonds"],"a":0,"e":"The α-carbon carries four different groups (H, NH2, COOH, R), so it is a chiral centre (except in glycine, where R = H).","t":7},{"id":"C70","q":"Carboxylic acids can be prepared by the following except:","o":["Oxidation of primary alcohols","Hydrolysis of nitriles","Oxidation of secondary alcohols","Oxidation of aldehydes","Carbonation of Grignard reagents"],"a":2,"e":"Oxidising a secondary alcohol gives a KETONE, not a carboxylic acid. The other four routes all give acids.","t":8},{"id":"C71","q":"Distinguish between 2-butanol (2°) and 2-methyl-2-propanol (3°):","o":["Baeyer’s reagent","K2Cr2O7","Tollens’ reagent","Fehling's solution","Bromine water"],"a":1,"e":"Acidified K2Cr2O7 oxidises the secondary alcohol (orange to green) but not the tertiary alcohol, which has no H on the carbinol carbon.","t":10},{"id":"C72","q":"IUPAC name for CH3CH(CH3)CH2CH2CH(CH3)CH(OH)COOH:","o":["2-hydroxy-3,6-dimethylheptanoic acid","3-hydroxy-5-methylheptanoic acid","2-hydroxy-5-methylhexanoic acid","6-hydroxy-3,6-dimethylheptanoic acid","2-hydroxy-3,6-dimethylhexanoic acid"],"a":0,"e":"Main chain: 7 carbons from COOH, with OH on C2 and methyls on C3 and C6, so 2-hydroxy-3,6-dimethylheptanoic acid.","t":11},{"id":"C73","q":"Chlorination of ethane catalyst:","o":["Iron","Nickel","Heat","Light","Platinum"],"a":3,"e":"Chlorination of alkanes is a free-radical reaction started by UV light (or heat). No metal catalyst is needed.","t":11},{"id":"C74","q":"Black precipitate in Lassaigne's sulfur test:","o":["PbS","Ag₂S","FeS","CuS","Na₂S"],"a":0,"e":"Pb(CH3COO)2 reacts with S2− to give black PbS, which confirms sulphur.","t":6},{"id":"C75","q":"White precipitate soluble in excess NH4OH indicates:","o":["chlorine","bromine","iodine","sulfur","nitrogen"],"a":0,"e":"White AgCl that dissolves in excess NH4OH indicates chloride (the halogen chlorine).","t":6},{"id":"C76","q":"In production of liquid soap, the preferable alkali is:","o":["KOH","NaOH","LiOH","Ca(OH)₂","Mg(OH)₂"],"a":0,"e":"Potassium soaps are soft and give liquid soap; sodium soaps are hard solids. KOH is therefore preferred for liquid soap.","t":0},{"id":"C78","q":"Propyne + HgSO4/H2SO4 yields:","o":["Propanal","Propanone","Propanol","Propanoic acid","Propane"],"a":1,"e":"Hydration of propyne with HgSO4/H2SO4 follows Markovnikov's rule. The enol (CH3C(OH)=CH2) tautomerises to propanone.","t":11},{"id":"C79","q":"Synthetic detergents are more effective in hard water because:","o":["They are cheaper","their calcium and magnesium salts are water-soluble","They are more acidic","They contain bleach","They are biodegradable"],"a":1,"e":"Detergents (e.g. alkyl sulphonates) form soluble Ca2+ and Mg2+ salts, so they lather in hard water and leave no scum.","t":8},{"id":"C80","q":"Which of these compounds would take part in Friedel–Craft acylation reaction?","o":["CH3CH2Cl","CH3OH","C6H5COCl","NH3","H2O"],"a":2,"e":"Friedel–Crafts acylation uses an acid chloride (RCOCl) with AlCl3 to acylate an aromatic ring, and benzoyl chloride is the acid chloride here.","t":9},{"id":"C81","q":"Hydrolysis of C6H5CN will yield:","o":["C6H5CONH2","C6H5COOH","C6H5COOCH3","C6H5CH2OH"],"a":1,"e":"Nitriles hydrolyse through the amide to the carboxylic acid, so C6H5CN gives benzoic acid (C6H5COOH).","t":8},{"id":"C82","q":"The reaction of fructose with NaBH4 gives:","o":["gluconic acid","glucitol","mannitol","glucitol and mannitol"],"a":3,"e":"NaBH4 reduces the C=O of fructose and creates a new stereocentre at C2, giving two epimeric alditols: glucitol and mannitol.","t":11},{"id":"C84","q":"Which of the following is incorrect about nucleophiles? They:","o":["are negatively charged","are positively charged","are electron loving","attack positive charged centres"],"a":1,"e":"Nucleophiles are electron-pair donors, usually negative or neutral. Being positively charged is not a property of a nucleophile.","t":11},{"id":"C85","q":"The systematic IUPAC name of (CH3)2N-CH2CH2CH3 is ___ and is a ___ amine.","o":["methylethylpropylamine, primary","ethylmethylpropylamine, secondary","dimethylpropylamine, tertiary","propylmethylethylamine, quaternary"],"a":2,"e":"The N carries two methyls and one propyl: N,N-dimethylpropylamine. Three carbon groups on N make it a tertiary amine.","t":7},{"id":"C86","q":"In an anion mechanism of polymer products:","o":["the initiator is a nucleophile","initiator is an acid","initiator is a radical","initiator is an alkane"],"a":0,"e":"In anionic polymerisation the initiator is a nucleophile (e.g. butyllithium) and attacks the monomer's double bond.","t":11},{"id":"C87","q":"Carboxylic acids can be regenerated from its sodium salts by reacting it with?","o":["NaOH(aq)","HCl(aq)","CH3OH","C2H5OC2H5"],"a":1,"e":"Strong acid displaces the weak carboxylic acid from its salt: RCOONa + HCl → RCOOH + NaCl.","t":8},{"id":"C88","q":"Which of the following compounds would have Z/E isomers?","o":["2-methyl-2-butene","2,3-dimethyl-2-butene","2,3-dimethyl-1-butene","3,4-dimethyl-3-hexene"],"a":3,"e":"Each double-bond carbon needs two different substituents. In 3,4-dimethylhex-3-ene each carbon bears CH3 and C2H5, so Z/E is possible. 2,3-dimethylbut-2-ene has identical groups.","t":11},{"id":"C91","q":"The appropriate dihalide that will react with H2O / Ba(OH)2 to give butanone is:","o":["1,2-dichlorobutane","2,2-dichlorobutane","1,3-dichlorobutane","1,1-dichlorobutane"],"a":1,"e":"A gem-dihalide (both halogens on the same carbon) hydrolyses to a carbonyl compound. 2,2-dichlorobutane gives butanone, while 1,1-dichlorobutane would give an aldehyde.","t":11},{"id":"C92","q":"One of the following is NOT CORRECT about synthons in organic synthesis:","o":["they are associated with polarity","they are fragments of molecules","they could be cations or anions","they are of the same polarity"],"a":3,"e":"Synthons are idealised fragments (cations or anions) and they carry OPPOSITE polarities that combine to make the bond. The same polarity is incorrect.","t":11},{"id":"C93","q":"The hydrocarbon end of the soap molecule is ___ and therefore ___?","o":["polar, fat loving","non-polar, water loving","non-polar, fat loving","polar, lipophilic"],"a":2,"e":"Soap's hydrocarbon tail is non-polar (hydrophobic), so it is fat-loving (lipophilic) and dissolves grease. The carboxylate head is water-loving.","t":8},{"id":"C94","q":"The amine formed from the following Hofmann reaction CH3CONH2 + Br2 + NaOH → ? is:","o":["CH3NH2","CH3CH2NH2","CH3CH2CH2NH2","CH3CH2CH2CH2NH2"],"a":0,"e":"Hofmann degradation turns an amide into a primary amine with ONE LESS carbon, so CH3CONH2 gives CH3NH2.","t":7},{"id":"C95","q":"The following are derivatives of carboxylic acids except:","o":["alkanamides","acid chlorides","esters","alkanes"],"a":3,"e":"Derivatives of carboxylic acids are acid chlorides, anhydrides, esters and amides. Alkanes are not derivatives.","t":8},{"id":"C96","q":"The IUPAC name for the compound shown (cyclohexene with Cl on the double bond) is:","o":["3-chlorocyclohexene","1-chlorocyclohexene","4-chlorocyclohexene","2-chlorocyclohexene"],"a":1,"e":"In 1-chlorocyclohexene the Cl sits on a double-bond carbon. Number the ring so the double bond is at C1–C2, and Cl takes the lowest locant, which is 1.","t":11},{"id":"C97","q":"Highly reactive metals such as sodium and magnesium are obtained by:","o":["Roasting of their ores","Reduction of their oxides with carbon","Electrolytic reduction of their molten salts","Reduction using hydrogen"],"a":2,"e":"Very reactive metals (Na, Mg, Al) are too reactive to be reduced with carbon, so they are extracted by electrolysis of their molten salts.","t":3},{"id":"C98","q":"During electrolysis of molten sodium chloride, chlorine gas is released at the:","o":["Cathode","Anode","Both electrodes","Electrolyte"],"a":1,"e":"Anions are discharged at the anode: 2Cl− → Cl2 + 2e−. Sodium forms at the cathode.","t":3},{"id":"C99","q":"In electrolytic refining, impure metal is used as the:","o":["Anode","Cathode","Both electrodes","Electrolyte"],"a":0,"e":"In electrolytic refining the impure metal is the anode (it dissolves) and pure metal plates on the cathode.","t":3},{"id":"C100","q":"In electrolytic refining, the impurities that settle below the anode are called:","o":["Cathode deposit","Electrolyte residue","Anode mud","Slag"],"a":2,"e":"Insoluble impurities (e.g. Ag, Au, Pt) fall below the anode as anode mud, which can be recovered.","t":3},{"id":"C101","q":"In electrolytic refining of copper, the electrolyte used is:","o":["Aqueous copper sulfate","Aqueous sodium chloride","Molten copper oxide","Dilute hydrochloric acid"],"a":0,"e":"Copper is refined in aqueous copper(II) sulphate acidified with H2SO4. Cu2+ ions carry the current and Cu deposits on the cathode.","t":3},{"id":"C102","q":"Which gas reduces iron(III) oxide to iron in the blast furnace?","o":["Carbon dioxide","Oxygen","Carbon monoxide","Nitrogen"],"a":2,"e":"CO, made from coke, reduces iron(III) oxide: Fe2O3 + 3CO → 2Fe + 3CO2.","t":3},{"id":"C103","q":"The role of limestone in the blast furnace is to:","o":["Produce heat for the reaction","Remove acidic impurities as slag","Act as a reducing agent","Supply carbon monoxide"],"a":1,"e":"Limestone decomposes to CaO, which combines with acidic silica (SiO2) to give slag (CaSiO3) that floats on the iron.","t":3},{"id":"C104","q":"The substance that forms the molten slag in the blast furnace is:","o":["Calcium silicate","Calcium oxide","Silicon dioxide","Calcium carbonate"],"a":0,"e":"CaO + SiO2 → CaSiO3. Calcium silicate is the molten slag, and it floats on the iron.","t":3},{"id":"C105","q":"Aluminium cannot be extracted by reduction with carbon because:","o":["It is less reactive than carbon","It is more reactive than carbon","It does not form oxides","Carbon is an oxidizing agent"],"a":1,"e":"Aluminium is more reactive than carbon, so carbon cannot reduce Al2O3. It is extracted by electrolysis instead.","t":3},{"id":"C106","q":"The role of cryolite in the extraction of aluminium is to:","o":["Supply aluminium ions","Act as a reducing agent","Prevent anode wear","Lower the melting point of aluminium oxide"],"a":3,"e":"Cryolite (Na3AlF6) dissolves Al2O3 and lowers its melting point from about 2000 °C to about 950 °C, which saves energy.","t":3},{"id":"C107","q":"Which of the following sets of ions is isoelectronic?","o":["Na⁺, Mg²⁺, Al³⁺","O²⁻, F⁻, Ne","K⁺, Ar, Ca²⁺","All of the above"],"a":3,"e":"Na+, Mg2+, Al3+ and O2−, F−, Ne each have 10 electrons, and K+, Ar, Ca2+ each have 18, so all three sets are isoelectronic.","t":0},{"id":"C108","q":"Which of the following statements is TRUE about ionic radii?","o":["The ionic radius of Cl⁻ is smaller than that of Cl atom","The ionic radius of Na⁺ is larger than that of Na atom","The ionic radius of Mg²⁺ is smaller than that of Mg atom","The ionic radius of Cl⁻ is smaller than Na⁺"],"a":2,"e":"A cation is smaller than its atom (fewer electrons and a higher Zeff), and an anion is larger than its atom. So Mg2+ is smaller than Mg.","t":0},{"id":"C109","q":"Across a period in the periodic table, the effective nuclear charge (Zeff) tends to:","o":["Increase","Decrease","Remain constant","First increase then decrease"],"a":0,"e":"Across a period protons increase while shielding stays about the same, so Zeff increases.","t":0},{"id":"C110","q":"The screening (shielding) effect is greatest in which type of electrons?","o":["s-electrons","p-electrons","d-electrons","f-electrons"],"a":0,"e":"Shielding decreases in the order s > p > d > f, because s electrons penetrate closest to the nucleus.","t":0},{"id":"C111","q":"Arrange the following isoelectronic species in order of increasing size: O²⁻, F⁻, Ne, Na⁺, Mg²⁺","o":["O²⁻ < F⁻ < Ne < Na⁺ < Mg²⁺","Mg²⁺ < Na⁺ < Ne < F⁻ < O²⁻","Mg²⁺ < Ne < Na⁺ < F⁻ < O²⁻","Na⁺ < Mg²⁺ < Ne < F⁻ < O²⁻"],"a":1,"e":"In isoelectronic species, more protons pull the same number of electrons tighter. Size increases as nuclear charge falls: Mg2+ < Na+ < Ne < F− < O2−.","t":0},{"id":"C112","q":"Electrons are filled into degenerate orbitals singly before pairing up, this is in accordance with:","o":["Hund's rule","Aufbau principle","Pauli exclusion principle","None of the above"],"a":0,"e":"Hund's rule says degenerate orbitals fill singly with parallel spins before pairing. Aufbau gives the order of filling, and Pauli limits an orbital to two electrons.","t":1},{"id":"C113","q":"Which of the following quantum numbers differentiates the two electrons in 4s orbital of calcium atom?","o":["spin","azimuthal","magnetic","principal"],"a":0,"e":"Two electrons in the same 4s orbital share n, l and mₗ. Only their spin quantum number differs (+½ and −½).","t":1},{"id":"C114","q":"Which of the following orbital is the most stable?","o":["2s","2p","3s","3p"],"a":0,"e":"2s has the lowest energy (n = 2, l = 0) of these four, so it is the most stable.","t":1},{"id":"C115","q":"What is the correct configuration for chromium atom Cr?","o":["[Ar]4s²3d⁴","[Ar]4s²3d⁵","[Ar]4s²3d²","[Ar]4s¹3d⁵"],"a":3,"e":"Cr is an exception: [Ar]4s¹3d⁵. A half-filled d subshell is extra stable.","t":1},{"id":"C116","q":"The orientation of an orbital is governed by ______ quantum number.","o":["azimuthal","principal","magnetic","spin"],"a":2,"e":"The magnetic quantum number mₗ gives the orientation of an orbital in space (e.g. px, py, pz).","t":1},{"id":"C117","q":"Which shell has the lowest energy in an atom?","o":["K","L","M","N"],"a":0,"e":"Energy rises with n, so the K shell (n = 1) is nearest the nucleus and lowest in energy.","t":1},{"id":"C118","q":"Magnetic quantum number governs the ____ of orbital.","o":["Energy and size","Magnetic moment","Shape","Orientation in space"],"a":3,"e":"mₗ describes the orientation of the orbital in space. Energy and size come from n, and shape from l.","t":1},{"id":"C119","q":"The number of electrons in the outermost shell of an atom represents _____","o":["Block","Group","Period","Size"],"a":1,"e":"Outer-shell (valence) electrons equal the group number. The period number equals the number of shells.","t":1},{"id":"C120","q":"According to Moseley’s modern periodic law, the properties of elements are periodic functions of their ____","o":["Atomic radii","Atomic weights","Atomic size","Atomic number"],"a":3,"e":"Moseley showed the properties of elements are periodic functions of their atomic number (not atomic mass).","t":0},{"id":"C121","q":"Which of the following is an example of Döbereiner’s triad?","o":["Ne, Ar, Kr","C, N, O","Li, Na, K","B, Al, Ga"],"a":2,"e":"A Döbereiner triad has three similar elements where the middle atomic mass is about the mean of the others. Li, Na, K fits.","t":0},{"id":"C122","q":"Which of the following alkali metals reacts with nitrogen?","o":["Lithium","Sodium","Potassium","Rubidium"],"a":0,"e":"Lithium is the only alkali metal that reacts directly with nitrogen, forming Li3N.","t":0},{"id":"C123","q":"Which of the following statements is not correct? (I) Group IA elements are more reactive than Group IIA and Group IVA elements. (II) Beryllium oxide and hydroxide are amphoteric. (III) The reactivity of Group IIA metals decreases down the group. (IV) The ionisation energy of Group IVA elements is less than that of Group IIA.","o":["I and II","II and III","I and IV","III and IV"],"a":3,"e":"Statement III is wrong, since Group IIA reactivity INCREASES down the group. Statement IV is wrong, since Group IVA ionisation energy is higher than IIA. I and II are true, so D (III and IV) is correct.","t":0},{"id":"C124","q":"Electronic configuration of chromium atom:","o":["[Ar] 3d² 4s²","[Ar] 3d⁴ 4s¹","[Ar] 3d⁴ 4s²","[Ar] 3d⁵ 4s¹"],"a":3,"e":"Chromium is [Ar]3d⁵4s¹, an exception that gives a stable half-filled d subshell with six unpaired electrons.","t":1},{"id":"C125","q":"Best defines hybridization:","o":["The combination of two molecules to form a compound","The transfer of electrons from one atom to another","Splitting of atomic orbitals into sub-orbitals of different energies","Mixing of atomic orbitals of similar energies to form new orbitals of identical shape and energy"],"a":3,"e":"Hybridisation is the mixing of atomic orbitals of similar energy to give new, identical hybrid orbitals of equal energy and shape.","t":2},{"id":"C126","q":"How many hybrid orbitals are formed in sp² hybridization?","o":["1","2","3","4"],"a":2,"e":"sp2 mixes one s and two p orbitals to give 3 sp2 hybrid orbitals. One p orbital stays unhybridised.","t":2},{"id":"C127","q":"In BF₃, bond angle between B–F bonds:","o":["90°","109°28'","120°","180°"],"a":2,"e":"BF3 is sp2 hybridised and trigonal planar, so the F–B–F angle is 120°.","t":2},{"id":"C128","q":"Why is C–H bond shorter and stronger than C–C sigma bond?","o":["s orbital of H is closer to its nucleus than sp³ orbital of C","Carbon nuclei are closer in C–C bonds","C–H bonds have more p-character than C–C bonds","Hydrogen has higher atomic mass than carbon"],"a":0,"e":"The H 1s orbital is smaller and closer to its nucleus than a carbon sp3 orbital, so overlap is better and the C–H bond is shorter and stronger than C–C.","t":2},{"id":"C129","q":"Rank C–H bond strengths and C–C bond lengths: ethane, ethene, ethyne","o":["C–H: ethane > ethene > ethyne; C–C: ethane < ethene < ethyne","C–H: ethene < ethane < ethyne; C–C: equal","C–H: ethyne < ethene < ethane; C–C: ethyne > ethene > ethane","C–H: ethane < ethene < ethyne; C–C: ethane > ethene > ethyne"],"a":3,"e":"More s-character gives stronger C–H bonds: ethane < ethene < ethyne. C–C bonds shorten as the bond order rises: ethane > ethene > ethyne.","t":2},{"id":"C130","q":"Central atom with sp³d hybridization:","o":["BeF₂","SF₆","PCl₅","BF₃"],"a":2,"e":"sp3d hybridisation (five electron pairs) gives trigonal bipyramidal PCl5. SF6 is sp3d2, BF3 is sp2 and BeF2 is sp.","t":2},{"id":"C131","q":"Sideways overlapping of unhybridized orbitals forms:","o":["Ionic bond","Sigma (σ) bond","Metallic bond","Pi (π) bond"],"a":3,"e":"Sideways (lateral) overlap of unhybridised p orbitals forms a π bond. Head-on overlap forms σ.","t":2},{"id":"C132","q":"VSEPR repulsion ranking (greatest to least):","o":["Lone pair–Lone pair > Lone pair–Bond pair > Bond pair–Bond pair","Bond pair–Bond pair > Lone pair–Lone pair > Lone pair–Bond pair","Bond pair–Bond pair > Lone pair–Bond pair > Lone pair–Lone pair","Lone pair–Bond pair > Lone pair–Lone pair > Bond pair–Bond pair"],"a":0,"e":"Lone pairs spread out more, so the repulsion order is lp–lp > lp–bp > bp–bp. This is why lone pairs compress bond angles.","t":2},{"id":"C134","q":"Shape of PCl₅:","o":["Tetrahedral","Trigonal bipyramidal","Octahedral","Trigonal planar"],"a":1,"e":"PCl5 has five bonding pairs and no lone pairs, so VSEPR gives a trigonal bipyramidal shape.","t":1},{"id":"C135","q":"High-spin complex due to weak field ligand:","o":["[Fe(CN)₆]⁴⁻","[FeCl₆]⁴⁻","[Co(NH₃)₆]³⁺","[Ni(CN)₄]²⁻"],"a":1,"e":"Cl− is a weak-field ligand, so the splitting is small and electrons occupy upper orbitals before pairing, giving a high-spin [FeCl6]4−. CN− and NH3 are strong-field.","t":4},{"id":"C136","q":"Spin-only magnetic moment for 3 unpaired electrons:","o":["1.73 BM","2.83 BM","3.87 BM","5.92 BM"],"a":2,"e":"μ = √[n(n+2)]. With n = 3, μ = √15 = 3.87 BM.","t":4},{"id":"C137","q":"Correct statement about ligands:","o":["Ligands are Lewis acids","Ligands must always be negatively charged","Ligands cannot form coordinate bonds","Ligands are Lewis bases that donate electron pairs"],"a":3,"e":"Ligands are Lewis bases: they donate a lone pair to the metal ion, forming a coordinate bond. They can be neutral (NH3) or anionic.","t":4},{"id":"C138","q":"Coordination number of [Cr(OH)₆]³⁻:","o":["3","4","5","6"],"a":3,"e":"Cr(OH)6 has six OH− ligands bonded to the central Cr, so the coordination number is 6 and the shape is octahedral.","t":4},{"id":"C139","q":"Catalyst in Contact process for H₂SO₄:","o":["Fe","V₂O₅","MnO₂","Ni"],"a":1,"e":"V2O5 is the catalyst in the Contact process for the oxidation of SO2 to SO3. Fe is for the Haber process.","t":12},{"id":"C140","q":"IUPAC name of CH₃CH₂CH₂–NHCH₃:","o":["Methylpropylamine","N-Methylpropan-1-amine","Trimethylamine","Ethylmethylamine"],"a":1,"e":"The longest alkyl chain is propane on N, with a methyl on N: N-methylpropan-1-amine (a secondary amine).","t":7},{"id":"C141","q":"Type of amine R₂NH:","o":["Primary","Secondary","Tertiary","Quaternary"],"a":1,"e":"R2NH has two alkyl groups on N, so it is a secondary amine.","t":7},{"id":"C142","q":"Correct statement about physical properties of amines:","o":["Tertiary amines have higher boiling points","All amines are colourless liquids","Amines are non-polar with low bp","Lower aliphatic amines are gases with ammonia-like smell"],"a":3,"e":"Lower aliphatic amines (methylamine, ethylamine) are gases with a fishy, ammonia-like odour. Higher amines are liquids or solids.","t":7},{"id":"C143","q":"Quaternary ammonium salt:","o":["(CH₃)₄N⁺Cl⁻","C₆H₅NH₂","(CH₃)₂NH","(CH₃)₃N"],"a":0,"e":"A quaternary ammonium salt has four alkyl groups on N+, as in (CH3)4N+Cl−. C6H5NH2 is primary, (CH3)2NH is secondary, (CH3)3N is tertiary.","t":7},{"id":"C144","q":"Arrange in decreasing boiling point: (I) Propan-1-amine, (II) N-Methylpropan-1-amine, (III) Trimethylamine","o":["I > II > III","III > II > I","II > I > III","I > III > II"],"a":2,"e":"Boiling points follow hydrogen bonding and mass. II (secondary amine, higher mass, one N–H) is highest, I (primary amine) is next, and III (tertiary) has no N–H and is lowest.","t":7},{"id":"C145","q":"Hofmann degradation reaction:","o":["Reduction of nitrobenzene","Reaction of haloalkanes with excess ammonia","Conversion of amides into primary amines with one less C","Reaction of aldehydes with HCN"],"a":2,"e":"Hofmann degradation (Br2/NaOH) converts an amide into a primary amine with one carbon less.","t":7},{"id":"C146","q":"Simplest aromatic amine:","o":["Anisole","Toluidine","Benzylamine","Phenylamine"],"a":3,"e":"Phenylamine (aniline), C6H5NH2, is the simplest aromatic amine.","t":7},{"id":"C147","q":"TRUE about basicity of amines:","o":["Absent in tertiary due to lack of H","Due to nitrogen donating lone pair","Decreases with alkyl groups","Strongest in aromatic amines"],"a":1,"e":"Amine basicity comes from the nitrogen lone pair, which accepts H+. Tertiary amines are still basic.","t":7},{"id":"C148","q":"Conversion of nitriles (-CN) → primary amines (-CH₂NH₂):","o":["Hofmann degradation","Reductive amination","Reduction using LiAlH₄ or Na in alcohol","Nitration followed by reduction"],"a":2,"e":"Nitriles are reduced to primary amines by LiAlH4 or Na/ethanol, or by catalytic hydrogenation.","t":7},{"id":"C149","q":"Aldehydes/ketones → amines with NH₃/H₂ over Ni-Cr:","o":["Gabriel synthesis","Hofmann degradation","Reduction of nitriles","Reductive amination"],"a":3,"e":"Reductive amination converts a carbonyl to an amine using NH3 and H2 (Ni catalyst).","t":7},{"id":"C150","q":"Strongest base in aqueous solution:","o":["Ammonia","Tertiary amine","Secondary amine","Primary amine"],"a":2,"e":"In water, aliphatic amines follow 2° > 3° ≈ 1° > NH3, because alkyl groups push electrons on to N but tertiary amines are poorly solvated. Aromatic amines are weak.","t":7},{"id":"C152","q":"Primary aliphatic amine + nitrous acid at 0–5 °C yields:","o":["Quaternary ammonium salt","No reaction","Nitrosamine","Alcohol + N₂"],"a":3,"e":"Primary aliphatic amines give an unstable diazonium salt with HNO2, which loses N2 to give an alcohol (plus alkenes or halides).","t":7},{"id":"C153","q":"Factor reducing basicity of tertiary amine in water:","o":["Electron-donating groups","Steric hindrance preventing solvation","Lone pair on N","Reaction with acids"],"a":1,"e":"In a tertiary amine the alkyl groups block the conjugate ion from being hydrated (steric hindrance to solvation), so basicity in water falls.","t":7},{"id":"C154","q":"Adding –OCH₃ at para position of aniline:","o":["Increase basicity","Decrease basicity","Prevent salts","Make insoluble"],"a":0,"e":"–OCH3 is electron-donating, so it raises electron density on N and makes aniline more basic.","t":7},{"id":"C155","q":"Pentyl magnesium bromide + methanal → alcohol:","o":["1°","2°","3°","4°"],"a":0,"e":"RMgBr + HCHO then hydrolysis gives a primary alcohol, so pentyl magnesium bromide + methanal gives hexan-1-ol.","t":9},{"id":"C156","q":"Grignard + ketone → hydrolysis produces:","o":["Primary alcohol","Secondary alcohol","Tertiary alcohol","Carboxylic acid"],"a":2,"e":"A Grignard reagent attacks the ketone C=O, and hydrolysis gives a TERTIARY alcohol.","t":9},{"id":"C157","q":"Reduction of carboxylic acids with LiAlH₄ yields:","o":["Aldehydes","Ketones","Primary alcohols","Secondary alcohols"],"a":2,"e":"LiAlH4 reduces RCOOH completely to the primary alcohol RCH2OH.","t":8},{"id":"C158","q":"Alcohol class dehydrates most easily:","o":["Primary","Secondary","Tertiary","All same"],"a":2,"e":"Tertiary alcohols dehydrate most readily because they give the most stable carbocation: 3° > 2° > 1°.","t":10},{"id":"C159","q":"Propanone + methyl magnesium bromide → hydrolysis yields:","o":["Propan-1-ol","Propan-2-ol","2-Methylpropan-2-ol","Butan-2-ol"],"a":2,"e":"CH3MgBr + propanone, then hydrolysis, gives (CH3)3COH, which is 2-methylpropan-2-ol, a tertiary alcohol.","t":9},{"id":"C160","q":"Oxidation of 4-methyl-1-pentanol with acidified sodium chromate:","o":["4-methyl-pentanal","4-methyl-pentanoic acid","3,3-dimethyl pentanoic acid","3,3-dimethyl butanoic acid"],"a":1,"e":"A primary alcohol is oxidised fully to the acid by acidified dichromate: 4-methylpentan-1-ol gives 4-methylpentanoic acid.","t":10},{"id":"C161","q":"CH₂(NH₂)CH₂CH₂COOH is:","o":["δ-amino butanoic acid","α-amino butanoic acid","γ-amino butanoic acid","β-amino butanoic acid"],"a":2,"e":"Amino-group position is counted from the COOH carbon: α is C2, β is C3, γ is C4. NH2 on the fourth carbon (CH2) makes it γ-aminobutanoic acid (GABA).","t":7},{"id":"C163","q":"Systematic IUPAC name of (CH₃)N(C₃H₇)(CH₂CH₃) and its type:","o":["ethylmethylpropylamine, secondary","methylethylpropylamine, primary","ethylmethylpropylamine, tertiary","propylmethylethylamine, quaternary"],"a":2,"e":"The groups on N are methyl, ethyl and propyl, named alphabetically as ethylmethylpropylamine. Three groups on N make it tertiary.","t":11},{"id":"C166","q":"C₃H₇MgBr reacts with propanal to give:","o":["3-hexanone","3-hexanol","3-hexoxide","hexanoic acid"],"a":1,"e":"C3H7MgBr adds a propyl group to propanal's C=O. Hydrolysis gives CH3CH2CH(OH)CH2CH2CH3, which is hexan-3-ol (a secondary alcohol).","t":9},{"id":"C167","q":"Which carbonyl compound is most easily attacked by a nucleophile?","o":["Propanal","Propanone","Benzaldehyde","Benzophenone"],"a":0,"e":"Aliphatic aldehydes are the most reactive carbonyls. Propanal has one small alkyl group and a positive carbonyl carbon, while ketones and aromatic carbonyls are less reactive.","t":9},{"id":"C168","q":"Aldehyde or ketone + phenylhydrazine forms:","o":["Imine","Oxime","Semicarbazone","Phenylhydrazone"],"a":3,"e":"Phenylhydrazine condenses with aldehydes and ketones to give phenylhydrazones, which are crystalline derivatives used in identification.","t":9},{"id":"C169","q":"Benzoyl chloride + LiAlH(OtBu)₃ → hydrolysis yields:","o":["Benzyl alcohol","Benzaldehyde","Benzene","Benzoic acid"],"a":1,"e":"LiAlH(OtBu)3 is a mild, bulky hydride that stops at the aldehyde stage (the Rosenmund-type partial reduction). Benzoyl chloride gives benzaldehyde.","t":8},{"id":"C170","q":"Lassaigne’s test converts nitrogen to:","o":["Sodium halide","Sodium cyanide (NaCN)","Sodium thiocyanate","Sodium sulfide"],"a":1,"e":"Sodium fusion converts organic N into NaCN, which gives Prussian blue with Fe(II)/Fe(III).","t":6},{"id":"C171","q":"Small excess of sodium in Lassaigne’s test:","o":["To detect sulphur more accurately","To make reaction faster","To ensure complete combustion","To prevent NaCNS formation"],"a":3,"e":"A small excess of sodium prevents NaSCN from forming (which would give a false blood-red colour with Fe3+).","t":6},{"id":"C172","q":"Reagent added first in nitrogen test:","o":["Sodium cyanide","Dilute H₂SO₄","Iron(II) sulphate solution","Iron(III) sulphate solution"],"a":2,"e":"FeSO4 solution is added first to the filtrate, then it is boiled and acidified to give Prussian blue.","t":6},{"id":"C173","q":"Indicates presence of nitrogen (CN):","o":["White precipitate","Blue or green colour with/without precipitate","Effervescence","Red or orange colour"],"a":1,"e":"N is shown by Prussian blue or a blue-green colour, with or without precipitate.","t":6},{"id":"C174","q":"Presence of sulphur:","o":["Black precipitate of PbS","Effervescence of SO₂","Yellow precipitate of PbSO₄","White precipitate of Na₂SO₄"],"a":0,"e":"Sulphur shows as black PbS precipitate with lead acetate, or as violet with sodium nitroprusside.","t":6},{"id":"C175","q":"Fikayo’s false positive in halogen test:","o":["Failed to add dilute HNO₃ → formed AgCN/Ag₂S","Did not heat filtrate","Added excess NH₄OH","Did not use fresh AgNO₃"],"a":0,"e":"Omitting dilute HNO3 lets CN− and S2− form AgCN and Ag2S with AgNO3 (a false positive for halogens). HNO3 destroys them.","t":6},{"id":"C176","q":"Yellow precipitate insoluble in NH₄OH indicates:","o":["Chloride","Bromide","Iodine","Iodide"],"a":3,"e":"AgI is yellow and insoluble in NH4OH (AgCl is white and soluble, AgBr cream and slightly soluble).","t":6},{"id":"C177","q":"Chloride ion test:","o":["White precipitate soluble in NH₄OH","Black precipitate soluble in HNO₃","Yellow precipitate insoluble","Cream precipitate"],"a":0,"e":"Chloride gives white AgCl that dissolves in dilute NH4OH.","t":6},{"id":"C178","q":"Hybrid orbital with greatest electronegativity:","o":["p","sp","sp²","sp³"],"a":1,"e":"More s-character means higher electronegativity. sp (50% s) > sp2 (33%) > sp3 (25%).","t":2},{"id":"C179","q":"Increasing p-character of hybrid orbital affects bond angle:","o":["Decreases bond angle","Increases bond angle","No effect","Makes angle 90°"],"a":0,"e":"As p-character increases, bond angle decreases: sp (180°), sp2 (120°), sp3 (109.5°).","t":2},{"id":"C180","q":"Name of (CH₃)₂CHCOCH(CH₃)₂:","o":["Acetophenone","Diphenylmethanone","2,4-dimethyl-2-pentanone","2,4-dimethyl-3-pentanone"],"a":3,"e":"The longest chain is pentane with C=O at C3 and methyls on C2 and C4: 2,4-dimethylpentan-3-one (2,4-dimethyl-3-pentanone).","t":11},{"id":"C181","q":"Active germicide/disinfectant for biological specimens:","o":["Ethanal","Benzaldehyde","Methanal as formalin","Acetone"],"a":2,"e":"Formalin (40% methanal in water) kills microbes by cross-linking proteins and preserves biological specimens.","t":9},{"id":"C182","q":"Carbonyl compounds undergo nucleophilic addition because:","o":["C is sp², planar, polarized → nucleophile attack","C is sp³, non-polar","π-bond shared equally","Tetrahedral geometry"],"a":0,"e":"The carbonyl carbon is sp2 and planar, which leaves it open to attack, and the C=O is polarised (Cδ+). So nucleophiles attack the carbon.","t":9},{"id":"C183","q":"Dry distillation of calcium propanoate gives:","o":["Propanol","Propanal","Propanone","3-pentanone"],"a":3,"e":"Dry distillation of a calcium carboxylate gives a ketone: (CH3CH2COO)2Ca → CH3CH2COCH2CH3 (3-pentanone) + CaCO3.","t":9},{"id":"C184","q":"Mild reduction of benzoyl chloride with LiAlH(OtBu)₃ yields:","o":["Benzaldehyde","Benzyl alcohol","Phenol","Benzophenone"],"a":0,"e":"The mild reducing agent stops at the aldehyde, so benzoyl chloride gives benzaldehyde.","t":8},{"id":"C185","q":"Physical property of carbonyl compounds:","o":["Methanal is liquid","Boiling points higher than alcohol","Lower MW aldehydes/ketones miscible in water","Aromatic carbonyls are gases"],"a":2,"e":"Small aldehydes and ketones are miscible with water because they hydrogen-bond to it, though they cannot hydrogen-bond to each other. Solubility falls as chain length rises.","t":9},{"id":"C186","q":"Most susceptible to nucleophilic attack:","o":["Acetaldehyde","Acetone","Benzaldehyde","Formaldehyde"],"a":3,"e":"Methanal has two H atoms and no electron-donating alkyl group, so it has the most positive carbonyl carbon and the least steric hindrance.","t":11},{"id":"C187","q":"Ketone + Grignard → hydrolysis gives:","o":["Aldehyde","Primary alcohol","Secondary alcohol","Tertiary alcohol"],"a":3,"e":"A Grignard reagent adds to a ketone to give a tertiary alkoxide, and hydrolysis gives a tertiary alcohol.","t":9},{"id":"C188","q":"Aldehydes/ketones + hydroxylamine →","o":["Hydrazones","Imines","Oximes","Semicarbazones"],"a":2,"e":"Hydroxylamine (NH2OH) condenses with carbonyls to give oximes (C=N–OH).","t":7},{"

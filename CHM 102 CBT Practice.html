.opt span{font-weight:700;min-width:1.4em;color:var(--ac)}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:.75rem;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

<script id="d" type="application/json">{"topics":["Periodic table & periodicity","Atomic structure & quantum numbers","Chemical bonding & hybridization","Extraction & purification of metals","Transition metals & complexes","Nuclear chemistry","Organic analysis & formulae","Amines & amino acids","Carboxylic acids, derivatives & soaps","Aldehydes & ketones","Alcohols, ethers & Grignard","Hydrocarbons, mechanisms & isomerism","General & physical chemistry"],"q":[{"id":"E1","q":"Which of the following is not a method of purification","o":["Calcination","Leaching","Gravity Separation","Froth flotation"],"a":0,"e":"Calcination is not a method of ore concentration (purification). Instead, it is a metallurgical process in which an ore is heated strongly in the absence or limited supply of air to remove moisture, carbon dioxide, or other volatile impurities. Methods of concentrating ores include gravity separation, froth flotation, magnetic separation, and leaching.","t":3},{"id":"E2","q":"Which of the following is FALSE concerning the theory of Octave by John Newland","o":["He related the elements to the musical notes","He said that the Octave rule works for all elements including the ones with heavier mass numbers","In the increasing order of atomic mass, the properties of every eighth element are similar to the first","The theory was proposed before the discovery of atomic number"],"a":1,"e":"Newlands arranged elements in order of increasing atomic mass and observed that every eighth element had properties similar to the first, just like notes in a musical octave. However, this pattern did not hold for heavier elements, which is why his theory had significant limitations. His work nevertheless laid the foundation for the development of the modern periodic table.","t":11},{"id":"E3","q":"Which of the following is the correct order of acidity of the Organic compound","o":["Ethanoic acid > Ethanol > Ethanal > Ethanone > Ethanoate","Ethanol > Ethanal > Ethanoic > Ethanone > Ethanoate","Ethanal > Ethanoate > Ethanoic acid > Ethanone","Ethanone > Ethanal > Ethanoate > Ethanoic acid"],"a":0,"e":"Ethanoic acid is the strongest acid among the compounds listed because it forms a resonance-stabilized carboxylate ion after donating a proton. Ethanol is only weakly acidic due to its hydroxyl group. Aldehydes and ketones have no O–H bond and are much less acidic, while the ethanoate ion is already the conjugate base of ethanoic acid and therefore has essentially no acidic proton to donate.","t":8},{"id":"E4","q":"Which of the following is true of esters (alkanoates) salts","o":["They are produced by the alkaline hydrolysis of alkanoates","They are produced by the acid hydrolysis of alkanoates","They are formed by the reaction between esters and alcohols","They are formed by the oxidation of esters"],"a":0,"e":"Esters undergo alkaline hydrolysis (saponification) when heated with sodium hydroxide or potassium hydroxide. This reaction produces an alkanoate salt and an alcohol. Example: CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH Acid hydrolysis, on the other hand, produces a carboxylic acid rather than its salt.","t":8},{"id":"E5","q":"The reaction of propanal and propanone with hydrogen will produce _______ and _______ respectively","o":["Propene-2-ol and Propan-1-ol","Propene-1-ol and Propan-2-ol","Propan-2-ol and Propan-1-ol","Propan-1-ol and Propan-2-ol"],"a":3,"e":"Hydrogenation reduces the carbonyl group (C=O) to an alcohol. ● Propanal (an aldehyde) is reduced to propan-1-ol, a primary alcohol. ● Propanone (a ketone) is reduced to propan-2-ol, a secondary alcohol. This reduction can be carried out using hydrogen with a nickel catalyst or reducing agents such as sodium borohydride (NaBH₄) or lithium aluminium hydride (LiAlH₄).","t":9},{"id":"E6","q":"What is the IUPAC nomenclature of K₂[CuCl₄]","o":["Potassium tetrachlorocopper (II)","Tetrachlorocopper (II) potassium ion","Potassium tetrachlorocuprate (II)","Tetrachlorocopper (II) dipotassium ion"],"a":2,"e":"The complex ion [CuCl₄]²⁻ carries a negative charge, so the metal name changes from copper to cuprate. Since there are four chloride ligands, the prefix tetrachloro- is used. Copper has an oxidation state of +2, giving the correct IUPAC name potassium tetrachlorocuprate(II).","t":4},{"id":"E7","q":"Which of the following elements is not considered as an alkaline earth metal due to its amphoteric behaviour in its Oxide & hydroxides?","o":["Ba","Mg","Be","Sr"],"a":2,"e":"Although beryllium belongs to Group 2 (alkaline earth metals), it differs significantly from the other members because beryllium oxide (BeO) and beryllium hydroxide [Be(OH)₂] are amphoteric. This means they react with both acids and bases. The other Group 2 metals (Mg, Ca, Sr, Ba) generally form basic oxides and hydroxides. This unusual behavior is due to the small ionic size and high charge density of Be²⁺.","t":0},{"id":"E8","q":"Which of the following elements has the largest atomic orbital?","o":["F","Na","I","O"],"a":2,"e":"Atomic size generally increases down a group because additional electron shells are added, increasing the distance between the nucleus and the outermost electrons. Iodine (I) lies much lower in the periodic table than fluorine (F), oxygen (O), and sodium (Na), so it possesses the largest atomic orbital (largest atomic radius) among the options.","t":11},{"id":"E9","q":"The following element have the lowest ionization energy because it is easy to remove the single outer electron except","o":["Na","Fr","Mg","K"],"a":2,"e":"Alkali metals (Group 1) have one valence electron, which is easily removed, giving them very low ionization energies. Sodium (Na), potassium (K), and francium (Fr) all belong to Group 1. Magnesium (Mg), however, belongs to Group 2 and has two valence electrons. Removing its first electron requires more energy because its electron configuration is more stable, making it the exception.","t":0},{"id":"E10","q":"What is the correct order of the transition metal below Ti, V, ____, ____, Fe, Co, ____, ____, Zn","o":["Mn, Cr, Cu, Ni","Cr, Mn, Ni, Cu","V, Ti, Mn, Cr","Ti, Cu, V, Ni"],"a":1,"e":"The first-row transition elements are arranged in the following order: Sc → Ti → V → Cr → Mn → Fe → Co → Ni → Cu → Zn Therefore, the missing elements after Ti and V are Cr and Mn, while those after Co are Ni and Cu. This sequence follows increasing atomic number across the first transition series.","t":4},{"id":"E11","q":"Which of the following is true in the allotropy of element","o":["Same structure and same form","Same structures, with different properties","Different structures but different properties","Different structures and different properties"],"a":3,"e":"Allotropy is the existence of an element in two or more different structural forms in the same physical state. Because the arrangement of atoms differs, the allotropes also possess different physical and sometimes chemical properties. Examples: ● Carbon: diamond, graphite, graphene, fullerenes. ● Oxygen: O₂ and O₃ (ozone). Different structures lead to differences in hardness, conductivity, density, and reactivity.","t":11},{"id":"E12","q":"Highly reactive metals such as sodium and Mg cannot be obtained by reducing their metal oxides due to their","o":["Low electronegativity","High affinity for O₂","Low affinity for O₂","High electronegativity"],"a":1,"e":"Highly reactive metals such as sodium, magnesium, calcium, and aluminium form very stable oxides because they have a strong attraction for oxygen. Carbon cannot remove oxygen from these oxides during reduction because carbon has a lower affinity for oxygen than these metals. Consequently, these metals are extracted by electrolysis instead of chemical reduction with carbon.","t":3},{"id":"E13","q":"Which of the following metals cannot be extracted by electrolytic reduction","o":["K","Na","Zn","Mg"],"a":2,"e":"Potassium, sodium, and magnesium are highly electropositive metals and are extracted by electrolytic reduction of their molten salts. Zinc is less reactive and can be extracted by chemical reduction with carbon (coke) after roasting its ore. Therefore, zinc is the metal that does not require electrolytic reduction.","t":3},{"id":"E14","q":"Carbon cannot be used to reduce which of the following element during extraction","o":["Mg","Fe","Sn","Pb"],"a":0,"e":"Magnesium lies above carbon in the reactivity series, meaning its oxide (MgO) is extremely stable. Carbon cannot reduce magnesium oxide because magnesium has a greater affinity for oxygen than carbon. Instead, magnesium is extracted by the electrolysis of molten magnesium chloride. Iron, tin, and lead oxides, however, can be reduced using carbon or carbon monoxide.","t":3},{"id":"E15","q":"Hybrid orbitals have all the following properties except","o":["Same bond","Same size","Same shape","Same energy"],"a":0,"e":"Hybrid orbitals are formed by the mixing of atomic orbitals of similar energy. All hybrid orbitals produced are equivalent—they have the same energy, the same size, and the same shape. However, they do not represent the “same bond.” Instead, hybrid orbitals participate in forming different sigma (σ) bonds depending on the atoms they overlap with. Therefore, “same bond” is not a property of hybrid orbitals.","t":2},{"id":"E16","q":"Elements in the same group are related in the same","o":["physical and chemical properties","Atomic number","Valence electron","Chemical properties"],"a":3,"e":"Elements in the same group have the same number of valence electrons, giving them similar chemical properties. For example, Group 1 elements all have one valence electron and readily lose it to form +1 ions. While some physical properties (such as melting point and density) show trends within a group, they are not identical, so the best answer is chemical properties.","t":0},{"id":"E17","q":"Which of the following is false about Inductive effect","o":["There is a visible drift of electron","It occurs between elements of different electronegativities","It occurs between the Sigma bond electrons","There is unequal sharing of electrons between atoms in a covalent bond"],"a":0,"e":"The inductive effect is the permanent displacement of sigma (σ) electrons along a carbon chain due to differences in electronegativity between bonded atoms. This displacement is not visible and occurs only through sigma bonds. It results in unequal sharing of electrons in a covalent bond and influences properties such as acidity, basicity, and the stability of reaction intermediates.","t":11},{"id":"E18","q":"Which of the following is not a nuclear reaction","o":["Fusion","Fission","Transmutation","Decomposition"],"a":3,"e":"Nuclear reactions involve changes in the atomic nucleus. Examples include fusion (combining light nuclei), fission (splitting heavy nuclei), and transmutation (conversion of one element into another through nuclear changes). Decomposition is an ordinary chemical reaction in which a compound breaks into simpler substances without altering the nucleus of its atoms.","t":5},{"id":"E19","q":"Transition metals are so called because they serve as a bridge between the","o":["Lanthanides & actinides","First and second row elements","Metals and non metals","S- and D- block elements","D- and F-block elements"],"a":3,"e":"S- and D-block elements Explanation: Transition metals occupy the d-block of the periodic table and lie between the s-block elements (Groups 1 and 2) and the p-block elements (Groups 13– 18). Historically, they are described as forming a transition from the highly electropositive s-block metals to the p-block elements. This position explains their intermediate properties, such as variable oxidation states and complex ion formation. Note: Although option D says “S- and D- block elements,” the accepted intention of the question is that transition elements lie immediately after the s-block and begin the d-block.","t":4},{"id":"E20","q":"The burning of Ores in a limited/controlled or absence of the supply of oxygen or air is known as","o":["Oxidation","Calcination","Roasting","Carbonization"],"a":1,"e":"Calcination is the process of heating an ore in the absence or limited supply of air. It is mainly used for carbonate and hydrated ores, removing volatile substances such as water and carbon dioxide to produce the oxide. Example: CaCO3 ——> CaO + CO2 By contrast, roasting involves heating sulphide ores in excess air or oxygen, converting them into oxides while releasing sulphur dioxide.","t":3},{"id":"E21","q":"The group IA elements are stored in an airtight container, under liquid paraffin, inert liquid or an inert gas to prevent contact with the atmosphere because they rapidly tarnish in air due to their","o":["Non-reactive nature","Highly reactive nature","Passive nature","Lustrous nature","Noble nature"],"a":1,"e":"Group IA (alkali) metals such as lithium, sodium, and potassium react very rapidly with oxygen, moisture, and even water in the atmosphere. They quickly form oxides, hydroxides, or peroxides, causing them to lose their shiny appearance (tarnish). To prevent these reactions, they are stored under liquid paraffin, inert liquids, or inert gases.","t":0},{"id":"E22","q":"Cyclopropanol is a _______ alcohol","o":["primary","secondary","Tertiary","Quaternary"],"a":1,"e":"In cyclopropanol, the carbon bearing the hydroxyl (-OH) group is attached to two other carbon atoms within the ring. An alcohol is classified according to the number of carbon atoms attached to the carbon carrying the –OH group: ● Primary (1°): attached to one carbon. ● Secondary (2°): attached to two carbons. ● Tertiary (3°): attached to three carbons. Therefore, cyclopropanol is a secondary alcohol.","t":10},{"id":"E23","q":"Which of the following compounds can exhibit geometric isomerism","o":["2-Hexene","Hex-2-ene","2-methyl-2-pentene","2-methyl-1-pentene"],"a":1,"e":"Geometric (cis-trans/E-Z) isomerism occurs when each carbon of a C=C double bond is attached to two different groups. ● Hex-2-ene satisfies this requirement and exists as cis-hex- 2-ene and trans-hex-2-ene. ● 2-Methyl-2-pentene has two identical methyl groups attached to one carbon of the double bond, so it cannot show geometric isomerism. ● 2-Methyl-1-pentene has a terminal double bond and also cannot exhibit geometric isomerism.","t":11},{"id":"E24","q":"Primary and secondary amines react with acyl chlorides and anhydrides to produce","o":["C-alkyl","Carbonyl","S-alkyl","N-alkyl"],"a":3,"e":"Primary and secondary amines react with acyl chlorides or acid anhydrides in an acylation reaction to form N-substituted amides. During the reaction, the acyl group becomes attached to the nitrogen atom of the amine. Although the product is chemically an amide, among the given options the intended answer is N-alkyl, indicating substitution occurs at the nitrogen atom. Exam tip: In standard organic chemistry, the more accurate description of the product is an amide (N-acyl derivative).","t":7},{"id":"E25","q":"The middle carbon on 2,2- dimethylpropane is a _____ carbon","o":["primary","Secondary","Tertiary","Quaternary"],"a":3,"e":"In 2,2-dimethylpropane (neopentane), the central carbon atom is bonded to four other carbon atoms. Carbon atoms are classified as: ● Primary (1°): attached to one carbon. ● Secondary (2°): attached to two carbons. ● Tertiary (3°): attached to three carbons. ● Quaternary (4°): attached to four carbons. Therefore, the central carbon is a quaternary carbon.","t":11},{"id":"E26","q":"The reaction of ketone with ammonia will produce","o":["Oxime","Carbamazone","an Imine","a hydrazone"],"a":2,"e":"Ketones react with ammonia (NH₃) through a condensation reaction to form imines (Schiff bases). During the reaction, the oxygen atom of the carbonyl group is removed as water, and a carbon–nitrogen double bond (C=N) is formed. General reaction: Ketone + NH₃ → Imine + H₂O Oximes and hydrazones are formed only when ketones react with hydroxylamine (NH₂OH) and hydrazine (NH₂NH₂), respectively.","t":9},{"id":"E27","q":"The following is a trend in the ease of dehydration of alcohols to produce alkenes","o":["2⁰ > 1⁰ > 3⁰","3⁰ > 2⁰ > 1⁰","2⁰ > 3⁰ > 1⁰","1⁰ > 2⁰ > 3⁰"],"a":1,"e":"3° > 2° > 1° Explanation: The ease of dehydration of alcohols depends on the stability of the carbocation formed during the reaction. ● Tertiary alcohols (3°) form the most stable carbocations and dehydrate most readily. ● Secondary alcohols (2°) are less reactive. ● Primary alcohols (1°) are the least reactive because primary carbocations are highly unstable. Thus, the order is: 3° > 2° > 1°","t":10},{"id":"E28","q":"The reaction of butanol with iodo propane will give ______ ether","o":["Dibutyl","Propylbutyl","Butylpropyl","Dipropyl"],"a":2,"e":"When butanol reacts with iodopropane (Williamson ether synthesis), an unsymmetrical ether is formed. The oxygen atom links the butyl and propyl groups, giving butyl propyl ether. General reaction: RO⁻ + R′I → R–O–R′ + I⁻ Since the alkyl groups are different, the product is a mixed (unsymmetrical) ether.","t":10},{"id":"E29","q":"Which of the following statement is incorrect","o":["Nucleophiles are always electron rich","Homolytic Fission takes place between atoms of different electronegativities","Heterolytic fission takes place between atoms of different electronegativities","Reaction intermediates are often free radicals"],"a":1,"e":"Homolytic fission occurs when a covalent bond breaks equally, with each atom taking one electron to form free radicals. This type of bond cleavage usually occurs between atoms with similar or identical electronegativities, such as Cl₂ or Br₂. When atoms have different electronegativities, the bond usually breaks heterolytically, producing ions instead of radicals. Therefore, this statement is incorrect.","t":11},{"id":"E30","q":"(CH₃–O–CH₂–CH₂–CH₃ + HI (conc)) in excess acid will yield","o":["C₃H₇I and IC₃H₇","CH₃I and IC₃H₇","C₂H₅I and IC₃H₇","C₂H₅I and IC₂H₅"],"a":1,"e":"Ethers are cleaved by excess concentrated HI. For CH₃–O–CH₂CH₂CH₃: ● The first cleavage occurs at the methyl group because methyl halides are formed readily via an SN2 mechanism, producing CH₃I and propanol. ● Since HI is present in excess, the propanol formed reacts further with HI to produce 1-iodopropane (C₃H₇I). Therefore, the final products are methyl iodide (CH₃I) and propyl iodide (C₃H₇I).","t":11},{"id":"E31","q":"The dissolution of aluminium Oxide in Molten Cryolite produces a Mixture that has a","o":["Stable melting point","Unstable melting point","Higher melting point","Lower melting point"],"a":3,"e":"Pure aluminium oxide (Al₂O₃) has a very high melting point of about 2050°C, making electrolysis difficult and expensive. Adding molten cryolite (Na₃AlF₆): ● Lowers the melting point to about 950°C. ● Increases the electrical conductivity of the electrolyte. ● Reduces the energy required for aluminium extraction. This is why cryolite is used in the Hall–Héroult process.","t":3},{"id":"E32","q":"Ethanoic propanoic anhydride reacts with ammonia to form","o":["Propanol and ethanoic acid","propanamide and ethanoic acid","Propylamine and ethanoic acid","Propanone and ethanoic acid"],"a":1,"e":"Mixed acid anhydrides react with ammonia to produce an amide and a carboxylic acid. In ethanoic propanoic anhydride, the propanoyl group is converted into propanamide, while the other portion becomes ethanoic acid. Acid anhydrides generally undergo nucleophilic substitution reactions with ammonia to form amides.","t":8},{"id":"E33","q":"The acidity of carboxylic acids can be explained in terms of","o":["Basicity of the alkyl group","Strength of the carbon– hydrogen bond","Stability of the carboxylate ion in H₂O","Instability of the acid in aqueous solution"],"a":2,"e":"Carboxylic acids are acidic because, after losing a proton (H⁺), they form a carboxylate ion (RCOO⁻), whose negative charge is delocalized over two oxygen atoms by resonance. This resonance stabilization makes the conjugate base very stable, favouring proton loss and increasing acidity. The greater the stability of the conjugate base, the stronger the acid.","t":8},{"id":"E34","q":"In the extraction of Iron(Fe), carbon Mono oxide reduces Iron(III) oxide to Produce","o":["Iron (-1)","Iron(I) oxide","Fe","Fe(II) Oxide"],"a":2,"e":"During iron extraction in the blast furnace, carbon monoxide acts as the main reducing agent. The overall reaction is: Fe₂O₃ + 3CO → 2Fe + 3CO₂ Although iron(II) oxide (FeO) may appear as an intermediate, the ultimate product of reduction is metallic iron (Fe).","t":3},{"id":"E35","q":"The graphite lining in extraction of Aluminium acts as","o":["Positive electrode","Negative electrode","Protector of Al","Electrolytic cell"],"a":0,"e":"In the Hall–Héroult process: ● The graphite lining of the steel tank serves as the cathode (negative electrode). ● The graphite blocks suspended from above serve as the anodes (positive electrodes). This question likely intended to refer to the graphite electrodes, but as written (“graphite lining”), the scientifically correct answer is negative electrode (cathode).","t":3},{"id":"E37","q":"The reaction between but-2-ene and HCl is an example of","o":["Substitution","Addition","Elimination","Combustion"],"a":1,"e":"But-2-ene is an alkene, and alkenes undergo electrophilic addition reactions because of the electron-rich π bond. When HCl is added, the double bond breaks, and hydrogen and chlorine add across the carbon-carbon double bond to form 2-chlorobutane. Since atoms are added across the double bond without removing any atom, this is an addition reaction.","t":6},{"id":"E38","q":"Boron has higher nuclear charge and lower IE than beryllium because","o":["The electrons in the S-orbital is easily removed than the p-orbital","The electrons in the p-orbital is easily removed than the electron in the S-orbital","The S and P-orbital have equal energy","Ionisation energy increase across the period"],"a":1,"e":"The electrons in the p-orbital are more easily removed than the electrons in the s-orbital Explanation: Although boron has a higher nuclear charge than beryllium, its first ionization energy is lower. This is because: ● Be: 1s² 2s² ● B: 1s² 2s² 2p¹ The electron removed from boron comes from the 2p orbital, which is higher in energy, less penetrating, and more shielded than the 2s orbital. Therefore, it is easier to remove despite the higher nuclear charge. This is a well-known exception to the general trend of increasing ionization energy across a period.","t":5},{"id":"E39","q":"When One s-hybrid Orbital Mixes with three p and One d-orbital they form","o":["2 hybrid Orbitals","3 hybrid Orbitals","4 Hybrid Orbitals","5 hybrid Orbitals"],"a":3,"e":"Hybridization involves the mixing of atomic orbitals of similar energy. When one s orbital, three p orbitals, and one d orbital combine: 1 + 3 + 1 = 5 orbitals These form five equivalent sp³d (or dsp³) hybrid orbitals, which are arranged in a trigonal bipyramidal geometry, as seen in molecules like PCl₅.","t":1},{"id":"E40","q":"The IUPAC name for the compound CH₃(C₂H₅)N– CH₂CH₂CH₃ is","o":["1-ethyl,2-methylpropanamine","1-ethyl,2-methyl-N- propanamine","N-ethyl-N-methylpropanamine","Ethyl methylpropanamine"],"a":2,"e":"The nitrogen atom is bonded to three alkyl groups: ● One propyl group (chosen as the parent chain). ● One ethyl group. ● One methyl group. According to IUPAC rules, alkyl groups attached directly to nitrogen are indicated using the prefix N-. Therefore, the correct name is: N-ethyl-N-methylpropanamine.","t":11},{"id":"E41","q":"Homolytic Fission leads to the production of","o":["Free radicals","Carbocations","atoms","Carboanions"],"a":0,"e":"Homolytic fission is the equal breaking of a covalent bond, where each atom takes one electron from the shared pair. Example: Cl₂ → Cl• + Cl• The products are free radicals, which contain an unpaired electron and are highly reactive. Homolytic fission commonly occurs in the presence of heat, light (UV radiation), or free- radical initiators.","t":11},{"id":"E42","q":"Which of the following is true of Buckminster fullerene","o":["They are Cylindrical in Shape","They are made of 240 C","They have a bally like Structure","They are formed from polymers"],"a":2,"e":"They have a ball-like structure Explanation: Buckminsterfullerene (C₆₀) consists of 60 carbon atoms arranged in a hollow spherical structure resembling a football (soccer ball). The structure contains 12 pentagons and 20 hexagons. It is different from carbon nanotubes, which are cylindrical in shape.","t":11},{"id":"E43","q":"Which of the following is true of carbon when it is in its excited state","o":["Its 2p orbital is excited to form 2pₓ and 2pᵧ","Its 2p orbital is excited to form 2pₓ, 2pᵧ and 2pz","One electron from the 2s orbital is promoted to the 2p orbital","All the electrons in the 2p orbitals are paired"],"a":2,"e":"The ground-state electronic configuration of carbon is: 1s² 2s² 2p² Before bonding, one electron from the 2s orbital is promoted to the vacant 2p orbital, giving: 1s² 2s¹ 2p³ This excited state provides four unpaired electrons, allowing carbon to form four covalent bonds after hybridization.","t":11},{"id":"E44","q":"Alkynes Undergo _______ reaction","o":["Electrophilic reaction","Nucleophilic reactions","Nucleophilic-electrophilic reaction","None of the Options"],"a":0,"e":"Alkynes contain carbon-carbon triple bonds with two π bonds, making them electron-rich and susceptible to attack by electrophiles. Therefore, alkynes typically undergo electrophilic addition reactions, such as the addition of hydrogen (H₂), halogens (Br₂), hydrogen halides (HCl, HBr), and water (H₂O).","t":11},{"id":"E45","q":"The Spin-Only magnetic Moment (in BM) of [Cu(NH₃)₄]²⁺ is","o":["2.83","1.73","3.87","4.90"],"a":1,"e":"In [Cu(NH₃)₄]²⁺, copper is in the +2 oxidation state, giving the electron configuration 3d⁹. A d⁹ configuration contains one unpaired electron. The spin-only magnetic moment is calculated using: mu = sqrt{n(n+2)} where n = 1. mu = sqrt{1(1+2)} = 1.73{ BM} Therefore, the magnetic moment is 1.73 BM.","t":4},{"id":"E46","q":"_____ is the Mixing of atomic Orbitals of same energy level to produce a new hybrid Orbital of the same energy level","o":["Hybridization","dissolving","Atomization","Orbitalization"],"a":0,"e":"Hybridization is the process by which atomic orbitals of nearly the same energy on the same atom mix to form new equivalent hybrid orbitals. These hybrid orbitals have the same energy, shape, and size and are oriented in space to minimize electron repulsion, leading to specific molecular geometries. Examples include: ● sp → Linear (180°) ● sp² → Trigonal planar (120°) ● sp³ → Tetrahedral (109.5°)","t":1},{"id":"E47","q":"Which of the Following Statements is not true of Ligands","o":["They are paramagnetic","They are Lewis Acids","They are neutral or negatively charged","They react with metals to form complex ions"],"a":1,"e":"Ligands are Lewis bases, not Lewis acids. They donate a lone pair of electrons to a central metal ion to form a coordinate (dative) bond. For example: Cu2+ + 4NH3 —-> [Cu(NH3)4]^2+ Here, NH₃ donates its lone pair to Cu²⁺. ● Ligands may be neutral (NH₃, H₂O, CO) or negatively charged (Cl⁻, CN⁻, OH⁻). ● They form complex ions with metal ions. ● They are electron-pair donors (Lewis bases), while the metal ion acts as the Lewis acid.","t":4},{"id":"E48","q":"The formation of a black precipitate on addition of dil HNO₃ and few drops of phenyl ethanoate to lassaigne filtrate indicates the presence of","o":["Cl","S","I","F"],"a":2,"e":"In the Lassaigne’s test for halogens, the organic compound is first fused with sodium to convert covalently bonded halogens into ionic sodium halides. After acidifying the filtrate with dilute nitric acid, silver nitrate is added. The observations are: ● AgCl → White precipitate ● AgBr → Cream precipitate ● AgI → Yellow precipitate The question mentions a black precipitate, which is not the standard observation for halides. Based on the options and common examination intent, the expected answer is iodine (I⁻), although the correct laboratory observation is a yellow precipitate of AgI. Exam Note: This question appears to contain an error. In standard qualitative analysis, iodide gives a yellow, not black, precipitate.","t":6},{"id":"E49","q":"What is the Oxidation of Cr in Na₂[CrCl₄]","o":["-2","+2","+1","-1"],"a":1,"e":"For the complex ion Na₂[CrCl₄]: ● Sodium contributes +2 in total. ● Therefore, the complex ion [CrCl₄]²⁻ has a charge of −2. ● Each chloride ligand has an oxidation state of −1. Let the oxidation state of chromium be x: x + 4(-1) = -2 x - 4 = -2 x = +2 Thus, chromium is in the +2 oxidation state.","t":4},{"id":"E50","q":"Which of the following statements is wrong","o":["The bond angle in an sp² hybridized orbital is 120°","sp² is more electronegative than sp","Carbon uses sp³ when it combines with four other atoms","Carbon uses the sp hybridization in the production of ethyne"],"a":1,"e":"The electronegativity of hybrid orbitals increases with the percentage of s-character: ● sp = 50% s-character (most electronegative) ● sp² = 33% s-character ● sp³ = 25% s-character (least electronegative) Therefore, the correct order is: sp > sp² > sp³ This means the statement “sp² is more electronegative than sp” is incorrect. The remaining statements are correct: ● sp² orbitals have bond angles of 120°. ● Carbon uses sp³ hybridization when bonded to four atoms. ● Carbon in ethyne (C₂H₂) is sp- hybridized.","t":2},{"id":"E51","q":"The Most reactive compound among the following is","o":["Hexene","2-Methyl propane","Hexane","Hexyne"],"a":0,"e":"Among the compounds listed: ● Hexene is an alkene containing a reactive carbon-carbon double bond (C=C). ● Hexane and 2-methylpropane are saturated alkanes and are comparatively less reactive. ● Hexyne is also unsaturated, but under most introductory organic chemistry conditions, alkenes generally undergo electrophilic addition more readily than alkynes because the π electrons in alkenes are more accessible. Therefore, hexene is considered the most reactive among the options. Exam Note: In some advanced contexts, alkynes can be highly reactive, but for standard undergraduate and entrance examinations, alkenes are typically regarded as more reactive toward electrophilic addition.","t":11},{"id":"E52","q":"Which of the following is true of Lassaigne test","o":["The Organic Compound is fused with sodium to Convert the Compound to a Mixture of ionic Compound","It is used to determine the presence of the hydroxyl group","N,S and halogens are tested as their inorganic salt","it is used to detect the presence of halides e.g Cl, Br, I"],"a":0,"e":"s Explanation: The Lassaigne’s test is used to detect elements such as nitrogen, sulfur, and halogens present in organic compounds. Since these elements are covalently bonded, they are first converted into water-soluble ionic sodium salts by fusing the compound with metallic sodium. For example: ● Nitrogen → NaCN ● Sulfur → Na₂S ● Halogens → NaCl, NaBr, NaI These ionic salts are then tested using appropriate qualitative reactions.","t":6},{"id":"E53","q":"What is the product of the reaction of propanol and propyl magnesium bromide and on hydrolysis, it produces","o":["primary Hydrocarbon","Secondary Hydrocarbon","Tertiary hydrocarbon","Quaternary hydrocarbon"],"a":0,"e":"Propylmagnesium bromide (a Grignard reagent) is a very strong base. When it reacts with propanol, it does not form a new carbon-carbon bond. Instead, it abstracts the acidic hydrogen from the alcohol: R-MgBr + R'OH ———> RH + RO- MgBr The Grignard reagent is protonated to form propane, which is a primary hydrocarbon (alkane). Note: Grignard reagents are destroyed by alcohols, water, and other protic compounds. They must therefore be handled under strictly anhydrous conditions.","t":10},{"id":"E54","q":"1-methyl cyclohexanol is a _______ alcohol","o":["primary alcohol","secondary alcohol","Tertiary alcohol","Quaternary alcohol"],"a":2,"e":"In 1-methylcyclohexanol, the carbon bearing the hydroxyl (–OH) group is attached to: ● Two adjacent carbon atoms of the cyclohexane ring. ● One methyl (–CH₃) group. Since this carbon is bonded to three other carbon atoms, it is a tertiary (3°) alcohol. This classification influences its reactions—for example, tertiary alcohols dehydrate more readily than primary or secondary alcohols.","t":10},{"id":"E55","q":"Chemical reaction is not the same as nuclear reaction. The difference between nuclear and chemical reactions is that in a Nuclear reaction","o":["Number of the atoms remains constant","No of nucleons remains constant","No of element remains constant","Number of particles remains constant"],"a":1,"e":"The major difference between chemical and nuclear reactions is that nuclear reactions involve changes in the atomic nucleus, whereas chemical reactions involve only the rearrangement of electrons. In a nuclear reaction, the total number of nucleons (protons + neutrons) is conserved, although one element may be transformed into another. In contrast, chemical reactions do not alter the nuclei of atoms, so the identity of the elements remains unchanged.","t":5},{"id":"E56","q":"Which of the following is used to neutralize the acidic impurities in the extraction of iron from its ore","o":["Bauxite","Cryolite","Limestone","Hematite"],"a":2,"e":"In the blast furnace, limestone (CaCO₃) is added as a flux to remove acidic impurities, mainly silica (SiO₂). The reactions are: CaCO3 ————> CaO + CO2 CaO + SiO2 ————> CaSiO3 The calcium silicate (CaSiO₃) formed is called slag, which floats on the molten iron and is removed. Thus, limestone helps purify the iron by removing acidic gangue.","t":3},{"id":"E57","q":"The intensity of radiation from a point source is 80 units at a distance of 2m. What will be the intensity of the radiation at a distance of 11.2m from the source","o":["5.10 units","2.55 units","12.8 units","8.83 units"],"a":1,"e":"The intensity of radiation follows the inverse square law: I is proportional to 1/d^2 or I1d1^2 = I2d2^2 Given: ● I1 = 80 units ● d1 = 2 m ● d2 = 11.2 m I2 = 80 * 2^2/11.2^2 = 320/125.44 = approx 2.55units As the distance increases, the radiation spreads over a larger area, causing its intensity to decrease rapidly.","t":5},{"id":"E59","q":"The following has the lowest ionization energy except","o":["Na","Fr","Mg","Rb"],"a":2,"e":"Ionization energy generally decreases down a group and is lowest for Group 1 (alkali) metals, which have only one valence electron. Among the options: ● Na, Rb, and Fr are alkali metals with relatively low ionization energies. ● Magnesium (Mg) belongs to Group 2 and has a filled 3s² subshell, making its first electron more difficult to remove. Therefore, Mg is the exception.","t":0},{"id":"E60","q":"The reaction of propene with HBr will yield","o":["1-bromopropane","2-bromopropane","1-bromopropene","Bromopropyne"],"a":1,"e":"The addition of HBr to propene follows Markovnikov’s rule (in the absence of peroxides). Hydrogen adds to the carbon already carrying more hydrogen atoms, while bromine attaches to the more substituted carbon. \\mathrm{CH_3CH=CH_2 + HBr \\rightarrow CH_3CHBrCH_3} The product is 2-bromopropane. Exam Tip: If peroxides are present, HBr undergoes anti-Markovnikov addition, producing 1-bromopropane instead.","t":11},{"id":"E61","q":"Which of the following statements about Dalton’s atomic theory is incorrect","o":["Atoms of the same element are identical.","Atoms cannot be created or destroyed.","Atoms can be converted into atoms of another element in chemical reactions.","Compounds form when atoms of different elements combine in fixed ratios."],"a":2,"e":"Dalton proposed that atoms cannot be created, destroyed, or converted into atoms of another element during ordinary chemical reactions. Modern nuclear chemistry has shown that atoms can be transformed into other elements, but only in nuclear reactions, not chemical reactions. Therefore, this statement contradicts Dalton’s atomic theory and is the incorrect one.","t":11},{"id":"E62","q":"The discovery of the neutron is credited to","o":["J.J. Thompson","Ernest Rutherford","James Chadwick","Henry Moseley"],"a":2,"e":"The neutron was discovered in 1932 by James Chadwick. His discovery explained: ● Why atomic masses are greater than the number of protons. ● The existence of isotopes. ● The structure and stability of atomic nuclei. Other notable discoveries include: ● J.J. Thomson – electron. ● Ernest Rutherford – atomic nucleus. ● Henry Moseley – atomic number.","t":5},{"id":"E63","q":"Which orbital can hold a maximum of 14 electrons","o":["s","p","d","f"],"a":3,"e":"The maximum number of electrons an orbital subshell can hold is determined by the number of orbitals it contains: ● s: 1 orbital → 2 electrons ● p: 3 orbitals → 6 electrons ● d: 5 orbitals → 10 electrons ● f: 7 orbitals → 14 electrons Therefore, the f-subshell can accommodate the greatest number of electrons.","t":11},{"id":"E64","q":"According to the Aufbau principle, electrons fill orbitals in order of","o":["Decreasing energy","Increasing energy","Increasing nuclear charge","Decreasing nuclear charge"],"a":1,"e":"According to the Aufbau principle, electrons occupy the lowest-energy orbitals first before filling higher- energy orbitals. The general filling order is: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s … This arrangement leads to the most stable (lowest-energy) electronic configuration for an atom.","t":1},{"id":"E65","q":"Which rule states that no two electrons in an atom can have the same four quantum numbers","o":["Hund’s rule","Pauli exclusion principle","Aufbau principle","Heisenberg principle"],"a":1,"e":"The Pauli Exclusion Principle states that no two electrons in the same atom can have the same set of four quantum numbers. This means that: ● Each orbital can hold a maximum of two electrons. ● If two electrons occupy the same orbital, they must have opposite spins. This principle is fundamental in determining electron configurations and the arrangement of electrons in atoms.","t":1},{"id":"E66","q":"The element with the electron configuration 1s²2s²2p⁶3s²3p⁶4s²3d¹⁰4p⁶ 5s² belongs to which group","o":["Alkali metals","Alkaline earth metals","Halogens","Noble gases"],"a":1,"e":"The electron configuration ends in 5s², which corresponds to strontium (Sr, atomic number 38). Elements with an outer electronic configuration of ns² belong to Group 2 (IIA), known as the alkaline earth metals. These elements typically lose two electrons to form 2+ ions.","t":1},{"id":"E67","q":"Which of the following elements is a transition metal","o":["Sodium","Iron","Silicon","Chlorine"],"a":1,"e":"Iron (Fe) is a transition metal because it has a partially filled d-subshell in its atoms or common ions. Transition metals are characterized by variable oxidation states, formation of coloured compounds, catalytic activity, and the ability to form complex ions.","t":4},{"id":"E68","q":"In the periodic table, atomic radius generally","o":["Increases across a period and decreases down a group","Decreases across a period and increases down a group","Increases both across a period and down a group","Decreases both across a period and down a group"],"a":1,"e":"Across a period, the number of protons increases while electrons are added to the same shell. The increased nuclear attraction pulls electrons closer to the nucleus, causing the atomic radius to decrease. Down a group, additional electron shells are added, making atoms larger despite the increased nuclear charge.","t":0},{"id":"E69","q":"Effective nuclear charge Zeff increases across a period because","o":["Shielding increases","Number of protons increases","Number of shells increases","Electron-electron repulsion decreases"],"a":1,"e":"Effective nuclear charge (Zₑff) increases across a period because the number of protons in the nucleus increases while shielding changes very little. As a result, the nucleus attracts the outer electrons more strongly, leading to smaller atomic radii and higher ionization energies.","t":0},{"id":"E70","q":"Which of the following ions is isoelectronic with neon","o":["Na⁺","Mg²⁺","O²⁻","All of the above"],"a":3,"e":"Neon has 10 electrons. ● Na⁺: 11 − 1 = 10 electrons ● Mg²⁺: 12 − 2 = 10 electrons ● O²⁻: 8 + 2 = 10 electrons Since all three species possess the same number of electrons as neon, they are isoelectronic with neon and have similar electron configurations (1s² 2s² 2p⁶).","t":0},{"id":"E71","q":"Ionization energy is the energy required to","o":["Add an electron to a gaseous atom","Remove the most loosely bound electron from a gaseous atom","Remove a proton from the nucleus","Break a covalent bond"],"a":1,"e":"Ionization energy is the minimum amount of energy required to remove the outermost (most loosely held) electron from an isolated gaseous atom, forming a positively charged ion (cation). Because energy is absorbed during this process, ionization is always endothermic. Ionization energy generally increases across a period and decreases down a group.","t":0},{"id":"E72","q":"Electron affinity is generally most negative for","o":["Alkali metals","Halogens","Noble gases","Alkaline earth metals"],"a":1,"e":"Electron affinity is the energy change when a gaseous atom gains an electron. Halogens have the most negative electron affinity because they need only one electron to achieve a stable noble gas configuration. When they gain an electron, a large amount of energy is released, making the process highly exothermic. Chlorine has one of the most negative electron affinity values.","t":0},{"id":"E73","q":"Which of the following processes is exothermic","o":["Ionization of sodium","Electron affinity of chlorine","Dissociation of O₂","Sublimation of iodine"],"a":1,"e":"An exothermic process releases energy. When a chlorine atom gains an electron to form Cl⁻, energy is released because the resulting ion is more stable than the neutral atom. In contrast, ionization, bond dissociation, and sublimation all require energy input, making them endothermic processes.","t":0},{"id":"E74","q":"The shape of an sp³-hybridized carbon atom is","o":["Linear","Trigonal planar","Tetrahedral","Octahedral"],"a":2,"e":"An sp³-hybridized carbon atom has four equivalent hybrid orbitals directed toward the corners of a tetrahedron. This arrangement minimizes electron pair repulsion according to VSEPR theory, producing bond angles of approximately 109.5°. Methane (CH₄) is the classic example of an sp³- hybridized molecule.","t":2},{"id":"E75","q":"In VSEPR theory, the order of repulsive forces is","o":["Lone pair–lone pair > Lone pair– bond pair > Bond pair–bond pair","Bond pair–bond pair > Lone pair– bond pair > Lone pair–lone pair","Lone pair–bond pair > Lone pair– lone pair > Bond pair–bond pair","Bond pair–bond pair > Lone pair– lone pair > Lone pair–bond pair"],"a":0,"e":"Lone pair–lone pair > Lone pair–bond pair > Bond pair–bond pair Explanation: According to VSEPR theory, lone pairs occupy more space than bonding pairs because they are attracted by only one nucleus. As a result, they repel other electron pairs more strongly. Therefore, the order of repulsion is: ● Lone pair–Lone pair (strongest) ● Lone pair–Bond pair ● Bond pair–Bond pair (weakest) This explains why molecules containing lone pairs often have bond angles smaller than the ideal values.","t":2},{"id":"E76","q":"Which of the following molecules has a linear shape","o":["H₂O","BF₃","CO₂","NH₃"],"a":2,"e":"Carbon dioxide has two regions of electron density around the central carbon atom and no lone pairs. According to VSEPR theory, these electron domains arrange themselves 180° apart, giving the molecule a linear shape. Water (H₂O) is bent, ammonia (NH₃) is trigonal pyramidal, and boron trifluoride (BF₃) is trigonal planar.","t":2},{"id":"E77","q":"Group IA elements are called","o":["Alkaline earth metals","Halogens","Alkali metals","Noble gases"],"a":2,"e":"Group IA (Group 1) elements are called alkali metals because they react with water to produce soluble alkaline hydroxides. They have one valence electron, are highly reactive, possess low ionization energies, and readily form +1 ions. Examples include lithium, sodium, potassium, rubidium, cesium, and francium.","t":0},{"id":"E78","q":"The extraction of aluminium from bauxite involves","o":["Reduction with carbon","Electrolysis of molten aluminium oxide in cryolite","Roasting followed by reduction","Leaching with sodium hydroxide"],"a":1,"e":"Aluminium is extracted from purified bauxite by the Hall– Héroult process. Alumina (Al₂O₃) is dissolved in molten cryolite (Na₃AlF₆), which lowers its melting point and improves electrical conductivity. Electrolysis then reduces Al³⁺ ions to molten aluminium at the cathode while oxygen is liberated at the anode.","t":3},{"id":"E79","q":"Transition metals are characterized by","o":["Filling of s orbitals","Filling of p orbitals","Filling of d orbitals","Filling of f orbitals"],"a":2,"e":"Transition metals are characterized by the progressive filling of the d-subshell. Their atoms or common ions possess partially filled d orbitals, giving rise to properties such as variable oxidation states, coloured compounds, catalytic activity, magnetic behaviour, and complex ion formation.","t":4},{"id":"E80","q":"Which of the following is not a property of transition metals","o":["Variable oxidation states","Formation of coloured compounds","High electronegativity","Catalytic activity"],"a":2,"e":"Transition metals generally have moderate, not exceptionally high, electronegativities. Their distinguishing properties include variable oxidation states, formation of coloured ions, catalytic activity, high melting points, and the ability to form complex compounds. High electronegativity is more typical of non-metals such as fluorine, oxygen, and chlorine.","t":4},{"id":"E81","q":"The splitting of d orbitals in an octahedral field results in","o":["Two energy levels: t₂g and eₙ","Three energy levels: t₂g, eₙ, and pₙ","Four energy levels: dₓᵧ, dₓz, dyz, dₓ²ᵧ²,d𝑧²","No splitting occurs"],"a":0,"e":"(eg) Explanation: In an octahedral crystal field, the five d orbitals split into two groups because of the approach of six ligands: ● Lower-energy t₂g orbitals: dxy, dxz, dyz ● Higher-energy eg orbitals: dx²−y² and dz² This splitting, known as crystal field splitting (Δ₀), explains the magnetic properties and colours of many transition metal complexes.","t":1},{"id":"E82","q":"Which of the following ligands is a strong field ligand","o":["Cl⁻","H₂O","NH₃","CN⁻"],"a":3,"e":"Cyanide ion (CN⁻) is a strong-field ligand according to the spectrochemical series. It causes a large crystal field splitting (Δ), often leading to low-spin complexes where electrons pair up before occupying higher-energy orbitals. In comparison: ● Cl⁻ is a weak-field ligand. ● H₂O is a moderate-field ligand. ● NH₃ is stronger than H₂O but weaker than CN⁻.","t":4},{"id":"E83","q":"The spin-only magnetic moment (μₛ) for a complex with 4 unpaired electrons is","o":["2.83 BM","3.87 BM","4.90 BM","5.92 BM"],"a":2,"e":"The spin-only magnetic moment is calculated using: mu = sqrt{n(n+2)}{ BM} where n is the number of unpaired electrons. For 4 unpaired electrons: mu = sqrt{4(4+2)} = sqrt{24} approx 4.90 { BM}","t":4},{"id":"E84","q":"Nuclear fusion involves","o":["Splitting of heavy nuclei","Combination of light nuclei","Emission of alpha particles","Capture of electrons"],"a":1,"e":"Nuclear fusion is the process in which two or more light nuclei combine to form a heavier nucleus, releasing enormous amounts of energy due to mass being converted into energy (Einstein’s equation, E = mc²). Fusion powers the Sun and other stars. Unlike fission, fusion produces less long- lived radioactive waste.","t":5},{"id":"E85","q":"Which type of radiation has the highest penetrating power","o":["Alpha particles","Beta particles","Gamma rays","Neutrons"],"a":2,"e":"Gamma (γ) rays have the greatest penetrating power because they are high-energy electromagnetic waves with no mass and no charge. Their penetrating abilities are: ● Alpha particles: stopped by paper or skin. ● Beta particles: stopped by a thin sheet of aluminium. ● Gamma rays: require thick lead or concrete shielding.","t":5},{"id":"E86","q":"The half-life of a radioactive isotope is 10 years. What fraction remains after 30 years","o":["1/2","1/4","1/8","1/16"],"a":2,"e":"The half-life is 10 years. After 30 years, three half-lives have elapsed: ● After 10 years → 1/2 remains. ● After 20 years → 1/4 remains. ● After 30 years → 1/8 remains. This follows the radioactive decay equation: Remaining fraction = (1/2)ⁿ, where n is the number of half-lives.","t":5},{"id":"E87","q":"Alkanes have the general formula","o":["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙH₂ₙ₋₆"],"a":1,"e":"Alkanes are saturated hydrocarbons, meaning they contain only single carbon-carbon bonds. Their general molecular formula is: CₙH₂ₙ₊₂ Examples: ● Methane: CH₄ ● Ethane: C₂H₆ ● Propane: C₃H₈ Unsaturated hydrocarbons such as alkenes and alkynes have different general formulae.","t":11},{"id":"E88","q":"The IUPAC name for CH₃–CH₂– CH(CH₃)–CH₂–CH₃ is","o":["2-Methylpentane","3-Methylpentane","Isohexane","n-Hexane"],"a":1,"e":"The longest continuous carbon chain contains five carbon atoms (pentane). A methyl (CH₃) group is attached to the third carbon atom, giving the IUPAC name 3- methylpentane. The chain should always be numbered to give substituents the lowest possible number.","t":11},{"id":"E89","q":"Markovnikov’s rule applies to the addition of","o":["H₂ to alkenes","HBr to alkenes","Br₂ to alkenes","H₂O to alkynes"],"a":1,"e":"Markovnikov’s rule states that when an unsymmetrical reagent such as HX (e.g., HBr, HCl) adds to an unsymmetrical alkene, the hydrogen atom attaches to the carbon already bearing more hydrogen atoms, while the halide attaches to the more substituted carbon. This produces the more stable carbocation intermediate and therefore the major product.","t":11},{"id":"E90","q":"Which of the following reagents is used to test for unsaturation in organic compounds","o":["Tollen’s reagent","Fehling’s solution","Bromine water","Benedict’s reagent"],"a":2,"e":"Bromine water is used to test for unsaturation (carbon- carbon double or triple bonds). An alkene or alkyne rapidly decolourises the orange/brown bromine solution because bromine adds across the multiple bond. Saturated hydrocarbons (alkanes) do not react under these conditions, so the colour remains unchanged.","t":9},{"id":"E91","q":"Ozonolysis of an alkene produces","o":["Alcohols","Aldehydes and/or ketones","Carboxylic acids","Epoxides"],"a":1,"e":"Ozonolysis is the cleavage of a carbon–carbon double bond (C=C) using ozone (O₃). After reductive work-up (e.g., Zn/H₂O), each carbon of the double bond becomes part of a carbonyl group, producing aldehydes, ketones, or both, depending on the structure of the original alkene. Ozonolysis is widely used to determine the position of double bonds in alkenes.","t":11},{"id":"E92","q":"The hybridization of carbon in ethyne (C₂H₂) is","o":["sp","sp²","sp³","sp³d"],"a":0,"e":"In ethyne (C₂H₂), each carbon atom forms: ● One σ bond with the other carbon, ● One σ bond with hydrogen, ● Two π bonds between the carbon atoms. To achieve this bonding, each carbon undergoes sp hybridization, giving a linear geometry with a bond angle of 180°.","t":2},{"id":"E93","q":"Which of the following is a primary alcohol","o":["CH₃–CH₂–OH","(CH₃)₂CH–OH","(CH₃)₃C–OH","C₆H₅–OH"],"a":0,"e":"A primary alcohol has the hydroxyl (-OH) group attached to a carbon atom bonded to only one other carbon atom. ● CH₃CH₂OH (ethanol) is a primary alcohol. ● (CH₃)₂CHOH is secondary. ● (CH₃)₃COH is tertiary. ● C₆H₅OH (phenol) is not classified as an alcohol because the –OH is directly attached to an aromatic ring.","t":10},{"id":"E94","q":"Oxidation of a primary alcohol with acidified K₂Cr₂O₇ produces","o":["Aldehyde","Ketone","Carboxylic acid","Ester"],"a":2,"e":"When a primary alcohol is oxidized with acidified potassium dichromate (K₂Cr₂O₇/H⁺) under reflux, it is first converted into an aldehyde and then further oxidized to a carboxylic acid. For example: CH₃CH₂OH → CH₃CHO → CH₃COOH Complete oxidation under reflux gives the carboxylic acid as the final product.","t":10},{"id":"E95","q":"Grignard reagents are represented by the general formula","o":["R–Mg–X","R–Li","R–Na","R–Zn–X"],"a":0,"e":"Grignard reagents have the general formula R–Mg–X, where: ● R = alkyl or aryl group, ● X = halogen (Cl, Br, or I). They are highly reactive organometallic compounds and act as strong nucleophiles, making them useful for forming new carbon– carbon bonds in organic synthesis.","t":10},{"id":"E96","q":"Ethers are commonly prepared by","o":["Dehydration of alcohols","Oxidation of alkanes","Reduction of aldehydes","Hydrolysis of esters"],"a":0,"e":"Ethers are commonly prepared by the intermolecular dehydration of alcohols using concentrated sulfuric acid at about 140°C. Example: 2CH₃CH₂OH → CH₃CH₂–O–CH₂CH₃ + H₂O This reaction is suitable mainly for preparing symmetrical ethers. Unsymmetrical ethers are often prepared using the Williamson ether synthesis.","t":10},{"id":"E97","q":"Which of the following is not a carbonyl compound","o":["Aldehyde","Ketone","Carboxylic acid","Amine"],"a":3,"e":"A carbonyl compound contains the carbonyl functional group (C=O). Aldehydes, ketones, and carboxylic acids all contain this group. Amines contain the amino group (-NH₂, -NHR, or -NR₂) and therefore are not carbonyl compounds.","t":9},{"id":"E98","q":"Tollen’s reagent is used to distinguish","o":["Aldehydes from ketones","Alcohols from ethers","Alkanes from alkenes","Acids from esters"],"a":0,"e":"Tollens’ reagent (ammoniacal silver nitrate) distinguishes aldehydes from ketones. ● Aldehydes reduce Ag⁺ to metallic silver, producing the characteristic silver mirror. ● Ketones generally do not react because they are much more resistant to oxidation under these mild conditions. This is one of the most important qualitative tests for aldehydes.","t":8},{"id":"E99","q":"The IUPAC name for CH₃–CO– CH₂–CH₃ is","o":["Butanone","2-Butanone","Methyl ethyl ketone","All of the above"],"a":3,"e":"The compound CH₃COCH₂CH₃ has: ● IUPAC name: 2-Butanone ● Acceptable shortened IUPAC name: Butanone (since the carbonyl can only occupy carbon 2 in butanone) ● Common name: Methyl ethyl ketone (MEK) Therefore, all the names listed correctly refer to the same compound.","t":11},{"id":"E100","q":"Which of the following carboxylic acids is the strongest","o":["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],"a":0,"e":"Among the simple alkanoic acids, methanoic acid (HCOOH) is the strongest. Alkyl groups donate electrons through the +I (electron-donating inductive) effect, which decreases acidity by destabilizing the carboxylate ion. Since methanoic acid has no alkyl group, its conjugate base is the most stable, making it the strongest acid in the series: Methanoic acid > Ethanoic acid > Propanoic acid > Butanoic acid.","t":8},{"id":"E101","q":"Esterification is a reaction between","o":["Alcohol and aldehyde","Alcohol and carboxylic acid","Alkene and water","Alkane and halogen"],"a":1,"e":"Esterification is the reaction between an alcohol and a carboxylic acid to produce an ester and water. The reaction is usually catalyzed by concentrated sulfuric acid (H₂SO₄), which acts as both a catalyst and a dehydrating agent. General equation: Carboxylic acid + Alcohol ⇌ Ester + Water Example: CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O","t":8},{"id":"E102","q":"Amines are derivatives of","o":["Ammonia","Methane","Benzene","Ethanol"],"a":0,"e":"Amines are organic derivatives of ammonia (NH₃) in which one or more hydrogen atoms are replaced by alkyl or aryl groups. ● Primary amine: RNH₂ ● Secondary amine: R₂NH ● Tertiary amine: R₃N Because nitrogen retains its lone pair of electrons, amines are generally basic and can act as nucleophiles.","t":7},{"id":"E103","q":"Which of the following is a nucleophile","o":["H⁺","Cl⁻","BF₃","AlCl₃"],"a":1,"e":"A nucleophile is an electron-rich species that donates a pair of electrons to an electron- deficient center during a chemical reaction. Chloride ion (Cl⁻) carries a negative charge and possesses lone pairs, making it an effective nucleophile. In contrast: ● H⁺ is an electrophile. ● BF₃ is a Lewis acid (electron-pair acceptor). ● AlCl₃ is also a Lewis acid.","t":11},{"id":"E104","q":"In an SN2 reaction, the rate depends on","o":["Concentration of substrate only","Concentration of nucleophile only","Both substrate and nucleophile","Temperature only"],"a":2,"e":"An SN2 (bimolecular nucleophilic substitution) reaction occurs in a single step where the nucleophile attacks the substrate as the leaving group departs simultaneously. The rate law is: Rate = k[substrate][nucleophile] Thus, increasing the concentration of either the substrate or the nucleophile increases the reaction rate. This is why SN2 reactions are called second-order reactions.","t":11},{"id":"E105","q":"Which of the following is an electrophile","o":["OH⁻","NH₃","NO₂⁺","CN⁻"],"a":2,"e":"An electrophile is an electron-deficient species that accepts an electron pair during a reaction. The nitronium ion (NO₂⁺) carries a positive charge and readily accepts electrons, making it a strong electrophile. It is the active electrophile in the nitration of benzene during electrophilic aromatic substitution.","t":11},{"id":"E106","q":"The compound C₆H₆ is","o":["Cyclohexane","Benzene","Hexane","Hexene"],"a":1,"e":"C₆H₆ is benzene, the simplest aromatic hydrocarbon. It consists of a six-membered carbon ring with delocalized π electrons spread evenly over the ring. This delocalization gives benzene exceptional stability, known as aromaticity, causing it to undergo substitution reactions rather than addition reactions.","t":11},{"id":"E107","q":"Which of the following is an allotrope of carbon","o":["Graphite","Diamond","Graphene","All of the above"],"a":3,"e":"Carbon exists in several allotropic forms, including: ● Diamond – each carbon is tetrahedrally bonded, making it extremely hard. ● Graphite – layers of carbon atoms arranged in hexagonal sheets, making it a good conductor of electricity. ● Graphene – a single layer of graphite with exceptional electrical, thermal, and mechanical properties. Since all are different structural forms of carbon, they are all allotropes.","t":11},{"id":"E108","q":"Fullerenes are composed of","o":["Carbon and hydrogen","Carbon only","Carbon and oxygen","Carbon and nitrogen"],"a":1,"e":"Fullerenes are allotropes composed entirely of carbon atoms arranged in hollow cages, spheres, or tubes. The most famous fullerene is Buckminsterfullerene (C₆₀), which resembles a soccer ball made of pentagons and hexagons. Despite their different shapes, fullerenes contain only carbon atoms.","t":11},{"id":"E109","q":"Which of the following is not a type of fullerene","o":["C₆₀","Carbon nanotube","Diamond","Graphene"],"a":2,"e":"Fullerenes are cage-like or tubular allotropes of carbon, including: ● C₆₀ ● C₇₀ ● Carbon nanotubes Diamond is an allotrope of carbon but not a fullerene because its carbon atoms form a three-dimensional tetrahedral network rather than a hollow cage or tube.","t":11},{"id":"E110","q":"Carbon nanotubes are used in","o":["Composite materials","Electronics","Drug delivery","All of the above"],"a":3,"e":"Carbon nanotubes (CNTs) possess extraordinary strength, low density, and excellent electrical and thermal conductivity. These properties make them useful in many fields, including: ● Composite materials to increase strength while reducing weight. ● Electronics, such as transistors and conductive nanowires. ● Drug delivery, where they can transport therapeutic agents to specific target cells. Their versatility makes carbon nanotubes one of the most important nanomaterials in modern science.","t":11},{"id":"E111","q":"The phenomenon where an element exists in different structural forms is called","o":["Isomerism","Allotropy","Isotopy","Polymerism"],"a":1,"e":"Allotropy is the phenomenon in which an element exists in two or more different structural forms in the same physical state. Although the allotropes consist of the same element, they differ in the arrangement of their atoms, resulting in different physical and sometimes chemical properties. Examples include diamond, graphite, graphene, and fullerenes as allotropes of carbon.","t":11},{"id":"E112","q":"Which of the following is not a greenhouse gas","o":["CO₂","CH₄","N₂","H₂O vapor"],"a":2,"e":"Nitrogen gas (N₂) is not a greenhouse gas because it does not absorb infrared radiation emitted by the Earth’s surface. Greenhouse gases, such as CO₂, CH₄, and water vapour (H₂O), trap heat in the atmosphere and contribute to the greenhouse effect. Since N₂ is a symmetrical diatomic molecule with no changing dipole moment during vibration, it does not significantly contribute to global warming.","t":11},{"id":"E113","q":"The molecular formula of buckminsterfullerene is","o":["C₆₀","C₇₀","C₈₀","C₉₀"],"a":0,"e":"Buckminsterfullerene has the molecular formula C₆₀. It consists of 60 carbon atoms arranged in a spherical cage made up of 12 pentagons and 20 hexagons, resembling a football (soccer ball). It was named after the architect Buckminster Fuller, whose geodesic dome structures resemble its shape.","t":6},{"id":"E114","q":"Which of the following is a pericyclic reaction","o":["Diels–Alder reaction","SN2 reaction","E1 reaction","Grignard reaction"],"a":0,"e":"The Diels–Alder reaction is a classic pericyclic reaction involving the concerted cycloaddition of a conjugated diene and a dienophile to form a six- membered ring. It occurs in a single step without ionic or free-radical intermediates and is widely used in organic synthesis to construct cyclic compounds efficiently.","t":10},{"id":"E115","q":"The process of converting an alkene to an alkane is called","o":["Hydrogenation","Halogenation","Hydration","Dehydration"],"a":0,"e":"Hydrogenation is the addition of hydrogen (H₂) across a carbon–carbon double or triple bond, converting an unsaturated compound into a saturated one. The reaction usually requires a metal catalyst such as nickel (Ni), platinum (Pt), or palladium (Pd). Example: CH₂=CH₂ + H₂ → CH₃–CH₃ This process is widely used in the food industry to harden vegetable oils.","t":11},{"id":"E116","q":"Which of the following is a Lewis acid","o":["NH₃","H₂O","BF₃","CH₄"],"a":2,"e":"Boron trifluoride (BF₃) is a Lewis acid because the boron atom has an incomplete octet and can accept a pair of electrons from a Lewis base. In contrast: ● NH₃ and H₂O are Lewis bases because they donate lone pairs. ● CH₄ has no lone pair available for donation and does not act as a Lewis acid.","t":2},{"id":"E117","q":"The IUPAC name for HCOOH is","o":["Methanoic acid","Ethanoic acid","Propanoic acid","Butanoic acid"],"a":0,"e":"HCOOH is the IUPAC name for methanoic acid, the simplest member of the carboxylic acid family. It is also commonly known as formic acid because it was first isolated from ants (Formica species). It contains one carbon atom and the functional group –COOH.","t":11},{"id":"E118","q":"Which of the following is not a reducing sugar","o":["Glucose","Fructose","Sucrose","Maltose"],"a":2,"e":"Sucrose is a non- reducing sugar because both of its anomeric carbon atoms are involved in the glycosidic bond. As a result, it cannot open to form the free aldehyde or ketone group needed to reduce Tollens’ or Fehling’s reagent. In contrast, glucose, fructose, and maltose are reducing sugars.","t":11},{"id":"E119","q":"The process of converting glucose to ethanol is called","o":["Fermentation","Distillation","Esterification","Saponification"],"a":0,"e":"Fermentation is the biochemical process in which microorganisms such as yeast convert glucose into ethanol and carbon dioxide under anaerobic conditions. The overall reaction is: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ This process is widely used in brewing, baking, and the industrial production of ethanol.","t":10},{"id":"E120","q":"Soaps are made by","o":["Esterification","Saponification","Hydrogenation","Polymerization"],"a":1,"e":"Saponification is the alkaline hydrolysis of fats or oils (triglycerides) using a strong base such as NaOH or KOH to produce soap and glycerol. General reaction: Fat/Oil + NaOH → Soap + Glycerol This reaction forms the basis of commercial soap manufacture and is an important application of ester hydrolysis.","t":8},{"id":"E121","q":"Which of the following is a synthetic polymer","o":["Starch","Cellulose","Polyethene","Protein"],"a":2,"e":"Polyethene (polyethylene) is a synthetic polymer produced by the addition polymerization of ethene (ethylene) molecules. It is widely used in the manufacture of plastic bags, bottles, containers, pipes, and packaging materials because it is lightweight, durable, chemically resistant, and inexpensive. In contrast, starch, cellulose, and proteins are natural polymers produced by living organisms.","t":11},{"id":"E122","q":"The monomer of polyethene is","o":["Ethene","Ethyne","Ethane","Ethanol"],"a":0,"e":"The monomer of polyethene is ethene (CH₂=CH₂). During addition polymerization, the carbon-carbon double bond in ethene opens, allowing thousands of ethene molecules to join together to form a long-chain polymer. n(CH2=CH2) ——-> (-CH2-CH2-)n No small molecule is eliminated during this process, making it an addition polymerization reaction.","t":10},{"id":"E123","q":"Which of the following is a condensation polymer","o":["Polyethene","Nylon","Polyvinyl chloride","Polystyrene"],"a":1,"e":"Nylon is a condensation polymer formed by the reaction of a diamine and a dicarboxylic acid (or their derivatives), with the elimination of small molecules such as water or hydrogen chloride. Polyethene, PVC, and polystyrene are addition polymers because they are formed from unsaturated monomers without the loss of any small molecule.","t":11},{"id":"E124","q":"The chemical formula of ozone is","o":["O₂","O₃","O₄","H₂O₂"],"a":1,"e":"Ozone is a triatomic allotrope of oxygen with the molecular formula O₃. It forms naturally in the stratosphere, where it absorbs harmful ultraviolet (UV) radiation from the Sun, protecting living organisms on Earth. At ground level, however, ozone is an air pollutant that can irritate the respiratory system.","t":11},{"id":"E125","q":"Which of the following is a renewable energy source","o":["Coal","Natural gas","Solar energy","Nuclear energy"],"a":2,"e":"Solar energy is a renewable energy source because sunlight is continuously supplied by the Sun and is naturally replenished. Coal and natural gas are fossil fuels that require millions of years to form, making them non-renewable. Although nuclear energy is a low- carbon energy source, it relies on finite radioactive fuels such as uranium and is therefore not classified as renewable.","t":5},{"id":"E126","q":"The pH of a neutral solution is:","o":["0","7","14","1"],"a":1,"e":"A neutral solution has a pH of 7 at 25°C because the concentrations of hydrogen ions (H⁺) and hydroxide ions (OH⁻) are equal: [H^+] = [OH^-] = 1.0 * 10^-7mol L^-1 Solutions with pH less than 7 are acidic, while those with pH greater than 7 are alkaline (basic).","t":12},{"id":"E127","q":"Which of the following is a buffer solution","o":["HCl + NaCl","CH₃COOH + CH₃COONa","NaOH + NaCl","H₂SO₄ + Na₂SO₄"],"a":1,"e":"A buffer solution resists changes in pH when small amounts of acid or base are added. A mixture of ethanoic acid (CH₃COOH) and sodium ethanoate (CH₃COONa) forms an acidic buffer because it contains a weak acid and its conjugate base. The acid neutralizes added alkali, while the ethanoate ion neutralizes added acid, helping to maintain a nearly constant pH.","t":12},{"id":"E128","q":"The rate of a chemical reaction is not affected by","o":["Temperature","Concentration","Catalyst","Color of reactants"],"a":3,"e":"The rate of a chemical reaction depends on factors such as: ● Temperature ● Concentration of reactants ● Surface area ● Pressure (for gases) ● Catalysts The color of the reactants has no direct effect on reaction rate. It is simply a physical property and does not influence the frequency or effectiveness of particle collisions.","t":11},{"id":"E129","q":"Le Chatelier’s principle applies to","o":["Equilibrium systems","Acid–base reactions","Redox reactions","Nuclear reactions"],"a":0,"e":"Le Chatelier’s principle states that when a system at equilibrium is subjected to a change in concentration, temperature, or pressure, the system adjusts in a direction that opposes the imposed change to establish a new equilibrium. This principle is widely applied in industrial processes such as the Haber process and the Contact process to maximize product yield.","t":12},{"id":"E130","q":"The unit of rate constant for a first-order reaction is","o":["mol L⁻¹ s⁻¹","s⁻¹","L mol⁻¹ s⁻¹","L² mol⁻² s⁻¹"],"a":1,"e":"For a first-order reaction, the rate law is: Rate = k[A] Since the rate has units of mol L⁻¹ s⁻¹ and concentration has units of mol L⁻¹, the units of the rate constant (k) simplify to: s^-1 This distinguishes first-order reactions from second-order and zero-order reactions, which have different units for their rate constants.","t":11},{"id":"E131","q":"Which of the following is a strong electrolyte","o":["CH₃COOH","NH₃","NaCl","C₆H₁₂O₆"],"a":2,"e":"A strong electrolyte dissociates completely into ions when dissolved in water, allowing the solution to conduct electricity efficiently. Sodium chloride (NaCl) separates completely into Na⁺ and Cl⁻ ions. ● CH₃COOH (ethanoic acid) is a weak electrolyte because it ionizes only partially. ● NH₃ is a weak base and ionizes only slightly in water. ● C₆H₁₂O₆ (glucose) dissolves but does not ionize, making it a non- electrolyte.","t":3},{"id":"E132","q":"The oxidation state of sulfur in H₂SO₄ is","o":["+2","+4","+6","-2"],"a":2,"e":"In H₂SO₄: ● Hydrogen has an oxidation state of +1. ● Oxygen has an oxidation state of −2. Let the oxidation state of sulfur be x. 2(+1) + x + 4(-2) = 0 2+x-8=0 x = +6 Therefore, sulfur is in the +6 oxidation state, which is its highest common oxidation state.","t":6},{"id":"E133","q":"Which of the following is a redox reaction","o":["NaCl + AgNO₃ → AgCl + NaNO₃","Zn + 2HCl → ZnCl₂ + H₂","NaOH + HCl → NaCl + H₂O","NH₃ + HCl → NH₄Cl"],"a":1,"e":"A redox reaction involves simultaneous oxidation and reduction. ● Zinc is oxidized from oxidation state 0 to +2. ● Hydrogen ions (H⁺) are reduced from +1 to 0, forming hydrogen gas (H₂). The other reactions are not redox reactions: ● AgCl formation is a precipitation reaction. ● NaOH + HCl is a neutralization reaction. ● NH₃ + HCl is an acid-base reaction.","t":12},{"id":"E134","q":"The Nernst equation is used in","o":["Acid–base titrations","Electrochemistry","Chemical kinetics","Thermodynamics"],"a":1,"e":"The Nernst equation relates the electrode potential of an electrochemical cell to the concentrations (or activities) of the reacting species. It is widely used to: ● Calculate cell potentials under non-standard conditions. ● Determine ion concentrations. ● Predict the direction of redox reactions. ● Calculate equilibrium constants for electrochemical systems. It is therefore a fundamental equation in electrochemistry.","t":12},{"id":"E135","q":"Which of the following is a non- electrolyte","o":["HCl","NaOH","C₂H₅OH","KNO₃"],"a":2,"e":"Ethanol (C₂H₅OH) is a non-electrolyte because it dissolves in water as neutral molecules and does not produce ions. As a result, its aqueous solution conducts electricity very poorly. In contrast: ● HCl ionizes completely. ● NaOH dissociates completely. ● KNO₃ dissociates completely. All three are strong electrolytes.","t":3},{"id":"E136","q":"The process of coating iron with zinc to prevent rusting is called","o":["Galvanization","Electroplating","Anodizing","Cathodic protection"],"a":0,"e":"Galvanization is the process of coating iron or steel with a thin layer of zinc to prevent rusting. Zinc protects iron in two ways: 1. It acts as a physical barrier, preventing oxygen and moisture from reaching the iron. 2. Zinc is more reactive than iron, so it corrodes preferentially (sacrificial protection), protecting the iron even if the coating is scratched.","t":12},{"id":"E137","q":"Which of the following is a noble metal","o":["Iron","Copper","Gold","Aluminium"],"a":2,"e":"Gold (Au) is a noble metal because it is highly resistant to oxidation and corrosion. It does not react readily with air, water, or most acids, which is why it retains its shine over long periods. Noble metals are valued for their chemical stability and are widely used in jewelry, electronics, and dentistry.","t":12},{"id":"E138","q":"The chemical formula of rust is","o":["Fe₂O₃","Fe₃O₄","FeO","Fe(OH)₃"],"a":0,"e":"Rust is commonly represented as hydrated iron(III) oxide, written as: Fe2O3.xH2O Since the hydrated form is not among the options, Fe₂O₃ is the closest and most appropriate answer. Rust forms when iron reacts with oxygen and water over time, producing the familiar reddish-brown coating.","t":11},{"id":"E139","q":"Which of the following is a reducing agent","o":["KMnO₄","K₂Cr₂O₇","H₂O₂","NaBH₄"],"a":3,"e":"Sodium borohydride (NaBH₄) is a reducing agent because it donates hydride ions (H⁻), reducing compounds such as aldehydes and ketones to alcohols. By contrast: ● KMnO₄ and K₂Cr₂O₇ are strong oxidizing agents. ● H₂O₂ can act as either an oxidizing or reducing agent depending on the reaction, but it is more commonly encountered as an oxidizing agent.","t":11},{"id":"E140","q":"The Haber process is used to produce:","o":["Sulfuric acid","Ammonia","Nitric acid","Sodium hydroxide"],"a":1,"e":"The Haber process is the industrial method for manufacturing ammonia (NH₃) by reacting nitrogen and hydrogen: N2(g) + 3H2(g) ———-> 2NH3(g)} Conditions of the Haber process: ● Temperature: ≈450°C ● Pressure: ≈200 atmospheres ● Catalyst: Finely divided iron (Fe) with promoters such as K₂O and Al₂O₃. Ammonia produced by the Haber process is essential for the manufacture of fertilizers, nitric acid, explosives, and many industrial chemicals.","t":12},{"id":"T1","q":"Which compound will not react with either Tollens’ reagent or acidified potassium dichromate(VI)","o":["Ethanal","Propanone","Ethanol","Ethene"],"a":1,"e":"Tollens’ reagent is a mild oxidizing agent that oxidizes aldehydes to carboxylates, producing a silver mirror. Acidified potassium dichromate(VI) oxidizes primary alcohols and aldehydes but does not normally oxidize ketones. Since propanone is a ketone, it reacts with neither reagent, making it the correct choice.","t":9},{"id":"T2","q":"The carbon atom of the –COOH group in alkanoic acids is","o":["sp³ hybridized","sp² hybridized","sp hybridized","Resonance-free"],"a":1,"e":"The carbon atom in the carboxyl group (–COOH) forms three sigma bonds and one pi bond. It is therefore sp² hybridized and has a trigonal planar arrangement with bond angles close to 120°. Resonance between the two oxygen atoms further stabilizes this planar structure.","t":0},{"id":"T3","q":"Which pair contains compounds that are functional isomers","o":["Propanone and propanal","Ethene and ethyne","Methanol and ethanol","Ethanoic acid and methanal"],"a":0,"e":"Functional isomers have the same molecular formula but different functional groups. Propanal and propanone both have the molecular formula C₃H₆O. Propanal is an aldehyde while propanone is a ketone, making them functional isomers.","t":11},{"id":"T4","q":"Which compound forms an oxime but does not give a silver mirror test","o":["Ethanal","Propanal","Propanone","Methanal"],"a":2,"e":"Hydroxylamine reacts with aldehydes and ketones to form oximes. However, Tollens’ reagent gives a positive test only with aldehydes. Propanone therefore forms an oxime but does not produce the silver mirror test.","t":9},{"id":"T5","q":"Which statement correctly explains why alkenes are more reactive than alkanes","o":["Alkenes have shorter C–C bonds","Alkenes contain π bonds with exposed electron density","Alkenes are more acidic","Alkanes contain only σ bonds"],"a":1,"e":"The carbon-carbon double bond contains one sigma bond and one weaker pi bond. The electrons in the pi bond are more exposed and are easily attacked by electrophiles, making alkenes much more reactive than alkanes, which possess only strong sigma bonds.","t":11},{"id":"T6","q":"A compound with molecular formula C₃H₆O reacts with hydroxylamine but not with Fehling’s solution. The compound is","o":["Propanal","Propanone","Propanol","Propene"],"a":1,"e":"The compound reacts with hydroxylamine, showing the presence of a carbonyl group. It does not react with Fehling’s solution, indicating it is not an aldehyde. Therefore, it must be a ketone, which is propanone.","t":6},{"id":"T7","q":"Which functional group is present in compounds that undergo condensation polymerisation","o":["–OH only","–COOH only","–CONH–","–C=C–"],"a":2,"e":"Condensation polymers are produced when monomers containing two reactive functional groups join together while eliminating small molecules such as water or hydrogen chloride. The amide linkage (–CONH–), found in polymers like nylon, is characteristic of condensation polymerization.","t":0},{"id":"T8","q":"Which reaction involves addition, not substitution or elimination","o":["Conversion of ethanol to ethene","Bromination of ethene","Oxidation of ethanol","Hydrolysis of ethyl ethanoate"],"a":1,"e":"Bromine adds directly across the carbon-carbon double bond of ethene to produce 1,2- dibromoethane. Since atoms are added across the double bond without the loss of any atom or group, this is an addition reaction.","t":10},{"id":"T9","q":"Which compound contains both σ and π bonds but no functional group ox

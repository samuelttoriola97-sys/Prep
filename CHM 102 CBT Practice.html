id":"C189","q":"Test for both aldehydes and ketones:","o":["Reaction with Tollens’ reagent","Reaction with Fehling’s solution","Reaction with phenylhydrazine","Iodoform test"],"a":2,"e":"Phenylhydrazine reacts with both aldehydes and ketones. Tollens' and Fehling's only react with aldehydes, and iodoform needs a methyl ketone or ethanol.","t":9},{"id":"C190","q":"Compound: 54.5%C, 9.1%H, rest O → empirical formula:","o":["CH₂O","C₂H₄O","CHO₂","C₂H₂O"],"a":1,"e":"C 54.5/12 = 4.54, H 9.1, O 36.4/16 = 2.28. Dividing by 2.28 gives C2H4O.","t":6},{"id":"C191","q":"Combustion: 6.51 mg sample → products 8.36 mg H₂O, 20.47 mg CO₂, M.M. = 126 g/mol → molecular formula:","o":["CH₂","CH₄","C₉H₁₈","C₂H₄"],"a":2,"e":"C = 20.47×12/44 = 5.58 mg and H = 8.36×2/18 = 0.93 mg, so C:H is 1:2 and the empirical formula is CH2 (mass 14). 126/14 = 9, so the molecular formula is C9H18.","t":6},{"id":"C192","q":"Hydrocarbon: 1 mol has 6 g H, M.R. = 54 → molecular formula:","o":["C₄H₆","C₄H₈","C₃H₈","C₅H₁₀"],"a":0,"e":"6 g of H per mole means 6 H atoms. Carbon = (54 − 6)/12 = 4, so the formula is C4H6.","t":6},{"id":"C193","q":"Side overlapping of orbitals involves:","o":["Hydrogen bond","Ionic bond","Sigma bond","Pi bond"],"a":3,"e":"Side-on overlap of p orbitals gives a π bond.","t":1},{"id":"C195","q":"Principal quantum number (n) determines:","o":["Orientation","Shape","Average distance of electron from nucleus","Spin"],"a":2,"e":"The principal quantum number n gives the shell, its size and energy, and so the average distance of the electron from the nucleus.","t":1},{"id":"C196","q":"For electron in d-orbital, l =","o":["0","1","2","3"],"a":2,"e":"l = 0 is s, 1 is p, 2 is d and 3 is f, so a d electron has l = 2.","t":1},{"id":"C197","q":"Possible values of mₗ for p-subshell:","o":["1","5","3","7"],"a":2,"e":"For a p subshell (l = 1), mₗ = −1, 0, +1, which is 3 values.","t":1},{"id":"C198","q":"Number of orbitals in fourth shell:","o":["4","8","16","32"],"a":2,"e":"The number of orbitals in shell n is n². For n = 4 that is 16.","t":1},{"id":"C199","q":"Quantum numbers not allowed:","o":["n=3, l=2, mₗ=-2, ms=+1/2","n=2, l=1, mₗ=2, ms=-1/2","n=1, l=0, mₗ=0, ms=+1/2","n=4, l=3, mₗ=-3, ms=-1/2"],"a":1,"e":"When l = 1, mₗ can only be −1, 0 or +1. So mₗ = 2 is not allowed.","t":1},{"id":"C200","q":"Shape of p-orbitals:","o":["Double dumbbell-shaped","Spherical","Dumbbell-shaped","Irregular"],"a":2,"e":"p orbitals are dumbbell-shaped, with two lobes along an axis.","t":1},{"id":"C201","q":"If n = 3, possible values of l:","o":["1,2","1,2,3","0,1,2","0,1"],"a":2,"e":"l can take values from 0 to n − 1. For n = 3, l = 0, 1, 2.","t":1},{"id":"C202","q":"Maximum value of l if n = 4:","o":["3","4","2","1"],"a":0,"e":"The maximum l is n − 1, so for n = 4 it is 3 (an f subshell).","t":1},{"id":"C203","q":"For l = 1, subshell type:","o":["s","p","d","f"],"a":1,"e":"l = 1 is the p subshell.","t":1},{"id":"C204","q":"Maximum electrons in third energy level:","o":["2","8","18","32"],"a":2,"e":"The maximum number of electrons in shell n is 2n². For n = 3, 2 × 9 = 18.","t":1},{"id":"C205","q":"Elements in same group:","o":["Same atomic number","Same number of valence electrons","Same number of electron shells","Same chemical symbol"],"a":1,"e":"Elements in the same group have the same number of valence electrons, which gives similar chemical properties.","t":0},{"id":"C206","q":"Representative elements are in:","o":["s- and p-blocks","d-block only","f-block only","None"],"a":0,"e":"Representative (main-group) elements are in the s and p blocks.","t":0},{"id":"C207","q":"Moving down a group, metallic character:","o":["Increases","Decreases","Remains constant","None"],"a":0,"e":"Metallic character increases down a group because atoms get larger and lose electrons more easily.","t":0},{"id":"C208","q":"Oxidation states of aluminum:","o":["+1 only","+1 and +3","+3 only","None"],"a":2,"e":"Aluminium has the configuration [Ne]3s²3p¹ and loses all three outer electrons, so its only common oxidation state is +3.","t":0},{"id":"C209","q":"Sn and Pb + dilute acids produce:","o":["Hydrogen gas and a salt","CO₂ and a salt","Oxygen and a salt","Water and a salt"],"a":0,"e":"Sn and Pb react with dilute acids to give a salt and hydrogen gas. They are metals above hydrogen in reactivity.","t":0},{"id":"C210","q":"True metal:","o":["Carbon","Antimony","Bismuth","Arsenic"],"a":2,"e":"Bismuth is a true metal. Sb and As are metalloids, and carbon is a non-metal.","t":0},{"id":"C211","q":"Not a group 6A element:","o":["Selenium","Polonium","Tellurium","Antimony"],"a":3,"e":"Group 6A (16) has O, S, Se, Te and Po. Antimony is in group 5A (15).","t":0},{"id":"C212","q":"Elements in the same period have:","o":["Same number of electron shells","Same number of valence electrons","Same reactivity","Same metallic character"],"a":0,"e":"Elements in a period have the same number of electron shells, and the valence electron count changes along it.","t":0},{"id":"C213","q":"Modern periodic law: properties periodic in:","o":["Atomic radii","Atomic number","Atomic mass","None"],"a":1,"e":"The modern periodic law states that the properties of elements are periodic functions of their atomic number.","t":0},{"id":"C214","q":"Discrepancy in Mendeleev’s table corrected by:","o":["John Newlands","Lothar Meyer","Henry Moseley","Dmitri Mendeleev"],"a":2,"e":"Moseley's X-ray work showed that atomic number, not atomic mass, orders the elements, which resolved the anomalies in Mendeleev's table.","t":0},{"id":"C215","q":"Metallic radius defined as:","o":["Distance between two cations","Half the distance between nuclei of two atoms in a crystal","Distance between cation and anion","Average distance of an electron"],"a":1,"e":"Metallic radius is half the distance between the nuclei of two adjacent atoms in a metallic crystal.","t":0},{"id":"C216","q":"Experimental method to determine atomic nuclei distance:","o":["Mass spectrometry","X-ray crystallography","Flame photometry","UV spectroscopy"],"a":1,"e":"X-ray crystallography measures the distances between atomic nuclei in a crystal, which gives atomic and ionic radii.","t":0},{"id":"C217","q":"Atomic radius down a group:","o":["Increases","Decreases","Increase then decrease","Remains constant"],"a":0,"e":"Atomic radius increases down a group because extra electron shells are added and shielding grows.","t":0},{"id":"C218","q":"Covalent radius across a period left to right:","o":["Increases","Decreases","Remains constant","Fluctuates"],"a":1,"e":"Across a period the covalent radius decreases, because Zeff increases and pulls the electrons closer.","t":0},{"id":"C220","q":"Effective nuclear charge (Zeff) formula:","o":["Zeff = Z + shielding","Zeff = Z – shielding","Zeff = Z × shielding","Zeff = shielding – Z"],"a":1,"e":"Zeff = Z − S (S = shielding or screening constant). It is the nuclear charge felt by an outer electron.","t":0},{"id":"C221","q":"Shielding reduces:","o":["Number of protons","Repulsion","Nuclear charge felt by valence electrons","Attraction of inner electrons"],"a":2,"e":"Inner electrons shield outer electrons from the nucleus, which reduces the nuclear charge felt by the valence electrons.","t":0},{"id":"C222","q":"Zeff across period:","o":["Decreases","Increases","Remains constant","Fluctuates"],"a":1,"e":"Zeff increases across a period (more protons, same shell).","t":0},{"id":"C223","q":"Zeff felt by valence electrons:","o":["Equal to actual nuclear charge","Greater than actual","Less than actual due to shielding","Independent of shielding"],"a":2,"e":"Because of shielding, the nuclear charge actually felt by valence electrons is less than the actual nuclear charge.","t":0},{"id":"C224","q":"Characteristic of transition metals:","o":["Low melting points","Form coloured compounds, variable oxidation states","All non-metals","Do not act as catalysts"],"a":1,"e":"Transition metals form coloured compounds, show variable oxidation states, and act as catalysts. They have high melting points and are all metals.","t":4},{"id":"C225","q":"Hybridization in CH₄ carbon:","o":["sp","sp²","sp³","sp³d"],"a":2,"e":"Carbon in CH4 is sp3 hybridised (one s and three p orbitals) and forms four σ bonds.","t":2},{"id":"C226","q":"Bond angle in sp³ hybridized orbitals (CH₄):","o":["90°","109.5°","120°","180°"],"a":1,"e":"Four sp3 orbitals point to the corners of a tetrahedron, so the bond angle is 109.5°.","t":2},{"id":"C227","q":"Number of hybrid orbitals in sp³ carbon:","o":["2","3","4","5"],"a":2,"e":"Hybrid orbitals formed equal the number of atomic orbitals mixed. One s plus three p gives 4 sp3 orbitals.","t":1},{"id":"C228","q":"Orbitals combining in sp² carbon:","o":["One s + two p","One s + three p","Two s + one p","Two p + one d"],"a":0,"e":"sp2 hybridisation mixes one s and two p orbitals to give three sp2 orbitals.","t":2},{"id":"C229","q":"Shape of sp hybridized carbon:","o":["Tetrahedral","Trigonal planar","Linear","Bent"],"a":2,"e":"sp hybrid carbon (as in ethyne) has two sp orbitals at 180°, so the geometry is linear.","t":2},{"id":"C230","q":"Number of sp hybrid orbitals in sp carbon:","o":["1","2","3","4"],"a":1,"e":"sp mixes one s and one p orbital, giving 2 sp hybrid orbitals.","t":1},{"id":"C231","q":"Unhybridized p orbitals in sp² carbon:","o":["0","1","2","3"],"a":1,"e":"sp2 carbon uses one s and two p, leaving ONE unhybridised p orbital that forms the π bond.","t":1},{"id":"C232","q":"% s orbital in sp hybrid orbital:","o":["25%","33%","50%","75%"],"a":2,"e":"sp is one s plus one p, so 1/2 = 50% s-character.","t":2},{"id":"C233","q":"% s orbital in sp³ hybrid orbital:","o":["25%","33%","50%","75%"],"a":0,"e":"sp3 is one s plus three p, so 1/4 = 25% s-character.","t":2},{"id":"C234","q":"Hybridization giving 120° bond angle:","o":["sp","sp²","sp³","dsp²"],"a":1,"e":"sp2 carbon (trigonal planar, as in ethene) has bond angles of 120°.","t":2},{"id":"C235","q":"Heterolytic fission gives:","o":["Free radicals","Cation","Both cation and anion","Anion"],"a":2,"e":"Heterolytic fission splits the bond unevenly, giving a cation and an anion (the more electronegative atom takes both electrons).","t":11},{"id":"C236","q":"Hydrohalogenation of pentene:","o":["Rearrangement","Substitution","Polymerization","Addition"],"a":3,"e":"HX adds across the C=C of pentene, so it is an addition reaction.","t":11},{"id":"C237","q":"Homolytic fission gives only:","o":["Radicals","Cations","Anions","Both"],"a":0,"e":"Homolytic fission gives only free radicals, with one electron going to each fragment.","t":11},{"id":"C239","q":"Dehydration of propanol → propene:","o":["Substitution","Rearrangement","Addition","Elimination"],"a":3,"e":"Dehydration removes water to form a C=C bond, which is an elimination reaction.","t":10},{"id":"C240","q":"Compound not showing geometrical isomerism:","o":["2-methylpropene","2,3-dibromo-but-2-ene","But-2-ene","Pent-2-ene"],"a":0,"e":"2-methylpropene has two identical groups (two CH3) on one carbon of the double bond, so it has no geometrical isomers. But-2-ene, pent-2-ene and 2,3-dibromobut-2-ene all do.","t":11}],"notes":["<ul class=\"nt\"><li><b>Development:<\/b> Döbereiner (triads, e.g. Li, Na, K), Newlands (octaves), Mendeleev (atomic mass), Moseley (atomic number). <b>Modern periodic law:<\/b> properties are periodic functions of atomic number.<\/li><li><b>Blocks:<\/b> s and p = representative elements; d = transition metals; f = inner transition metals.<\/li><li><b>Zeff = Z − S<\/b> (S = shielding). Zeff rises across a period and stays about constant down a group. Shielding order: s > p > d > f.<\/li><li><b>Atomic radius:<\/b> falls across a period (Zeff rises), rises down a group (extra shells). Metallic radius = half the distance between nuclei of adjacent atoms in a metal crystal (found by X-ray crystallography).<\/li><li><b>Ionic radius:<\/b> a cation is smaller than its atom; an anion is larger. Isoelectronic ions: more protons means smaller: Mg²⁺ &lt; Na⁺ &lt; Ne &lt; F⁻ &lt; O²⁻ &lt; N³⁻.<\/li><li><b>Isoelectronic sets:<\/b> Na⁺/Mg²⁺/Al³⁺/O²⁻/F⁻/Ne (10 e⁻); K⁺/Ca²⁺/Ar (18 e⁻).<\/li><li><b>Ionisation energy<\/b> rises across a period and falls down a group; metallic character does the opposite.<\/li><li><b>Group IA:<\/b> stored under paraffin/oil (react with air and water); only Li reacts with N₂ (Li₃N).<\/li><li><b>Group IIA:<\/b> reactivity increases down the group; Be is atypical (amphoteric oxide and hydroxide).<\/li><li><b>Others:<\/b> Group 6A = O, S, Se, Te, Po (not Sb). Bi is a true metal; Sb and As are metalloids. Al shows only +3. Sn and Pb + dilute acid give a salt and H₂.<\/li><\/ul>","<ul class=\"nt\"><li><b>Chadwick (1932)<\/b> discovered the neutron; Thomson the electron; Rutherford the nucleus.<\/li><li><b>Quantum numbers:<\/b><\/li><ul><li>n = 1, 2, 3… (shell, size, energy, average distance from nucleus)<\/li><li>l = 0 to n − 1 (0 = s, 1 = p, 2 = d, 3 = f)<\/li><li>mₗ = −l to +l (orientation; 2l + 1 values: p has 3, d has 5)<\/li><li>mₛ = ±½ (spin)<\/li><\/ul><li><b>Counting:<\/b> orbitals in shell n = n²; electrons in shell n = 2n² (n = 3: 18 electrons; n = 4: 16 orbitals).<\/li><li><b>Rules:<\/b> Aufbau (lowest energy first), Pauli (no two electrons share all four quantum numbers), Hund (fill degenerate orbitals singly first).<\/li><li><b>Configurations:<\/b> Ni = [Ar]4s²3d⁸. Cr = [Ar]3d⁵4s¹ and Cu = [Ar]3d¹⁰4s¹ are exceptions (half- or full d subshell). Two electrons in one orbital differ only in spin.<\/li><li><b>Shapes:<\/b> s spherical, p dumbbell, d mostly double dumbbell. K shell (n = 1) is lowest in energy; 2s is more stable than 2p, 3s, 3p.<\/li><li><b>Not allowed:<\/b> l = 1 with mₗ = 2.<\/li><\/ul>","<ul class=\"nt\"><li><b>Hybridisation<\/b> = mixing of atomic orbitals of similar energy to give equivalent new orbitals.<\/li><li><b>Types:<\/b><\/li><ul><li>sp: 1 s + 1 p → 2 orbitals, 180°, linear, 50% s (ethyne, BeF₂)<\/li><li>sp²: 1 s + 2 p → 3 orbitals, 120°, trigonal planar, 33% s, one p left over (ethene, BF₃)<\/li><li>sp³: 1 s + 3 p → 4 orbitals, 109.5°, tetrahedral, 25% s (methane)<\/li><li>sp³d: trigonal bipyramidal (PCl₅); sp³d²: octahedral (SF₆)<\/li><\/ul><li><b>More s-character<\/b> means shorter, stronger bonds, higher electronegativity and a larger bond angle. So sp is more electronegative than sp² and sp³.<\/li><li><b>σ bond:<\/b> head-on overlap. <b>π bond:<\/b> sideways overlap of unhybridised p orbitals. Double = 1σ + 1π; triple = 1σ + 2π.<\/li><li><b>Lengths:<\/b> C–C > C=C > C≡C. C–H strength: ethane &lt; ethene &lt; ethyne. C–H is shorter and stronger than C–C because the H 1s orbital is smaller and closer to its nucleus than a carbon sp³ orbital.<\/li><li><b>VSEPR repulsion:<\/b> lone pair–lone pair > lone pair–bond pair > bond pair–bond pair.<\/li><\/ul>","<ul class=\"nt\"><li><b>Concentration:<\/b> froth flotation (sulphide ores), gravity (heavy ores), magnetic separation, leaching (e.g. bauxite).<\/li><li><b>Roasting<\/b> = heating in excess air (sulphides → oxides). <b>Calcination<\/b> = heating in limited or no air (carbonates and hydroxides decompose).<\/li><li><b>Reduction:<\/b> carbon or CO for moderately reactive metals; electrolysis of molten salts for Na, Mg, Al.<\/li><li><b>Blast furnace (iron):<\/b> coke gives CO, which reduces Fe₂O₃ to Fe. Limestone → CaO, which combines with SiO₂ to form CaSiO₃, the slag that floats on the iron.<\/li><li><b>Aluminium:<\/b> ore = bauxite. Al is more reactive than carbon, so it is electrolysed in molten cryolite (Na₃AlF₆), which lowers the melting point.<\/li><li><b>Electrolysis:<\/b> anode = oxidation (Cl₂ forms there); cathode = reduction (metal forms there).<\/li><li><b>Electrolytic refining:<\/b> impure metal = anode, pure metal = cathode, impurities fall as anode mud. Copper uses acidified CuSO₄(aq).<\/li><li><b>Ores:<\/b> bauxite (Al), haematite and magnetite (Fe), cassiterite (Sn), galena (PbS).<\/li><\/ul>","<ul class=\"nt\"><li><b>Properties:<\/b> partly filled d subshell, coloured compounds, variable oxidation states, catalysts, paramagnetism, complexes. They bridge the s and p blocks.<\/li><li><b>Not true transition ions:<\/b> Sc³⁺ (d⁰) and Zn²⁺ (d¹⁰).<\/li><li><b>Ligands<\/b> are Lewis bases (lone-pair donors) bonded by coordinate bonds; neutral (NH₃, H₂O, CO) or anionic. Coordination number = number of donor atoms ([Cr(OH)₆]³⁻ = 6, octahedral).<\/li><li><b>Spectrochemical series (weak → strong):<\/b> I⁻ &lt; Br⁻ &lt; Cl⁻ &lt; F⁻ &lt; H₂O &lt; NH₃ &lt; CN⁻ &lt; CO.<\/li><li><b>High spin<\/b> (weak-field ligands, small splitting): [FeCl₆]⁴⁻. <b>Low spin<\/b> (strong-field ligands): [Fe(CN)₆]⁴⁻; [Co(CO)₆]²⁺ has 1 unpaired electron.<\/li><li><b>Magnetic moment:<\/b> μ = √[n(n + 2)] BM. n = 1: 1.73; 2: 2.83; 3: 3.87; 4: 4.90; 5: 5.92.<\/li><li><b>Colour:<\/b> the colour seen is complementary to the colour absorbed (absorbs orange at 600 nm, so appears blue).<\/li><\/ul>","<ul class=\"nt\"><li><b>Nuclear reactions:<\/b> fission, fusion, transmutation, radioactive decay. Chemical reactions involve electrons only.<\/li><li><b>Mass defect:<\/b> Δm = (mass of separate nucleons and electrons) − (mass of atom). Binding energy E = Δm·c². For C-14, Δm ≈ 1.88 × 10⁻²⁸ kg.<\/li><li><b>Radiation:<\/b> α least penetrating, then β, then γ (most). Ionising power is the reverse.<\/li><li><b>Half-life:<\/b> N = N₀(½)^(t/t½).<\/li><li><b>Fusion<\/b> joins light nuclei (the Sun); <b>fission<\/b> splits heavy nuclei (reactors).<\/li><\/ul>","<ul class=\"nt\"><li><b>Lassaigne's test:<\/b> fuse with sodium → NaCN (N), Na₂S (S), NaX (halogens). A small excess of Na prevents NaSCN forming. It does not detect oxygen.<\/li><li><b>Nitrogen:<\/b> FeSO₄(aq), boil, acidify → Prussian blue (blue or green).<\/li><li><b>Sulphur:<\/b> lead acetate → black PbS.<\/li><li><b>Halogens:<\/b> acidify with dilute HNO₃ first (destroys CN⁻ and S²⁻, avoiding false positives), then AgNO₃. AgCl white, soluble in dilute NH₄OH; AgBr cream, slightly soluble; AgI yellow, insoluble.<\/li><li><b>Empirical formula:<\/b> % → ÷ atomic mass → ÷ smallest → whole numbers (52.18% C, 13.04% H, 34.78% O → C₂H₆O).<\/li><li><b>Molecular formula<\/b> = n × empirical formula, n = molar mass ÷ empirical mass (CH₂, M = 126 → C₉H₁₈).<\/li><li><b>Combustion:<\/b> C = mass CO₂ × 12/44; H = mass H₂O × 2/18.<\/li><\/ul>","<ul class=\"nt\"><li><b>Classes:<\/b> primary RNH₂, secondary R₂NH, tertiary R₃N, quaternary R₄N⁺X⁻ (by number of carbon groups on N).<\/li><li><b>Naming:<\/b> CH₃CH₂CH₂NHCH₃ = N-methylpropan-1-amine (secondary). Common names list groups alphabetically.<\/li><li><b>Basicity<\/b> comes from the N lone pair. In water: secondary > tertiary ≈ primary > NH₃. Aromatic amines are weaker; –OCH₃ on aniline raises basicity. Tertiary amines are limited by poor solvation.<\/li><li><b>Physical:<\/b> lower aliphatic amines are gases with a fishy or ammonia-like smell. Primary and secondary amines hydrogen-bond, so they boil higher than tertiary amines of similar mass.<\/li><li><b>Reactions:<\/b> Hofmann degradation (amide + Br₂/NaOH → primary amine with ONE LESS carbon). Nitrile + LiAlH₄ → RCH₂NH₂. Reductive amination: carbonyl + NH₃ + H₂/Ni. RNH₂ + HNO₂ (0–5 °C) → ROH + N₂.<\/li><li><b>α-Amino acids:<\/b> amphoteric (zwitterions) and optically active (α-carbon has four different groups, except glycine). Positions: α (C2), β (C3), γ (C4); γ-aminobutanoic acid = H₂N–CH₂CH₂CH₂COOH.<\/li><\/ul>","<ul class=\"nt\"><li><b>Acidity:<\/b> stronger than alcohols and phenols, weaker than mineral acids. –I groups increase acidity; alkyl groups decrease it; HCOOH is stronger than propanoic acid.<\/li><li><b>Preparation:<\/b> oxidation of 1° alcohols or aldehydes; hydrolysis of nitriles (RCN → RCONH₂ → RCOOH); Grignard + CO₂. A <b>secondary<\/b> alcohol gives a ketone.<\/li><li><b>From a salt:<\/b> RCOONa + HCl → RCOOH + NaCl.<\/li><li><b>Derivatives:<\/b> acid chlorides, anhydrides, esters, amides (not alkanes or amines). Anhydride + NH₃ → amide + acid.<\/li><li><b>Reduction:<\/b> LiAlH₄: RCOOH → RCH₂OH. Mild LiAlH(OtBu)₃: acid chloride → aldehyde (benzoyl chloride → benzaldehyde).<\/li><li><b>Dry distillation<\/b> of calcium propanoate → 3-pentanone. <b>Friedel–Crafts acylation<\/b> uses an acid chloride (C₆H₅COCl) with AlCl₃.<\/li><li><b>Soap<\/b> = RCOO⁻Na⁺/K⁺ (K gives soft or liquid soap). The hydrocarbon tail is non-polar and fat-loving; the carboxylate head is water-loving. Soap forms scum with Ca²⁺ and Mg²⁺; synthetic detergents form soluble salts and work in hard water.<\/li><\/ul>","<ul class=\"nt\"><li><b>C=O carbon<\/b> is sp², planar and δ+, so carbonyls undergo <b>nucleophilic addition<\/b>.<\/li><li><b>Reactivity:<\/b> HCHO > RCHO > ketones > aromatic aldehydes > aromatic ketones (propanal > propanone > benzaldehyde > acetophenone).<\/li><li><b>Condensation:<\/b> NH₂OH → oxime; NH₂NH₂ → hydrazone; phenylhydrazine → phenylhydrazone; semicarbazide → semicarbazone.<\/li><li><b>Tests:<\/b> Tollens' and Fehling's separate aldehydes from ketones; phenylhydrazine reacts with both; iodoform needs CH₃CO–.<\/li><li><b>Cannizzaro:<\/b> aldehydes with NO α-H (HCHO, benzaldehyde, 2,2-dimethylpropanal). Ethanal has α-H, so no.<\/li><li><b>Grignard:<\/b> HCHO → 1° alcohol; other aldehydes → 2°; ketones → 3°.<\/li><li><b>Hydration of alkynes:<\/b> propyne + HgSO₄/H₂SO₄ → propanone. A gem-dihalide hydrolyses to a carbonyl (2,2-dichlorobutane → butanone).<\/li><li><b>Physical:<\/b> methanal is a gas; small carbonyls mix with water; boiling points are below alcohols (no O–H) and above alkanes. Formalin (aqueous HCHO) preserves specimens.<\/li><\/ul>","<ul class=\"nt\"><li><b>Classes:<\/b> primary (CH₂OH), secondary (CHOH), tertiary (C–OH, no H on that carbon).<\/li><li><b>Oxidation (acidified K₂Cr₂O₇, orange → green):<\/b> 1° → aldehyde → acid; 2° → ketone; 3° → none (separates 2-butanol from 2-methylpropan-2-ol).<\/li><li><b>Dehydration<\/b> is easiest for 3° alcohols. Ethanol + conc. H₂SO₄: 140 °C → diethyl ether (substitution); 170 °C → ethene (elimination).<\/li><li><b>Ethers:<\/b> Williamson synthesis (RO⁻ + R′X). Excess HI cleaves both C–O bonds to give two alkyl iodides (CH₃OC₃H₇ → CH₃I + C₃H₇I).<\/li><li><b>Grignard reagents (RMgX)<\/b> add to C=O; hydrolysis gives the alcohol. C₃H₇MgBr + propanal → hexan-3-ol; CH₃MgBr + propanone → 2-methylpropan-2-ol.<\/li><li><b>Hydroboration–oxidation<\/b> of alkenes gives the anti-Markovnikov alcohol (OH on the carbon with more hydrogens).<\/li><\/ul>","<ul class=\"nt\"><li><b>Alkanes:<\/b> free-radical substitution with Cl₂/Br₂ and UV light (initiation, propagation, termination); gives a mixture.<\/li><li><b>Alkenes:<\/b> addition reactions. Markovnikov's rule is explained by carbocation stability (3° > 2° > 1°). Alkenes come mainly from cracking petroleum.<\/li><li><b>Alkynes:<\/b> terminal alkynes are acidic (NaNH₂ forms an acetylide that reacts with alkyl halides).<\/li><li><b>Bond fission:<\/b> homolytic → radicals; heterolytic → cation + anion.<\/li><li><b>Reagents:<\/b> an electrophile is electron-poor (attacks electron-rich sites); a nucleophile donates an electron pair (attacks δ+ sites). NO₂⁺ is an electrophile.<\/li><li><b>Reaction types:<\/b> alcohol dehydration = elimination; hydrazone formation = condensation; hydrohalogenation of pentene = addition.<\/li><li><b>Ozonolysis<\/b> splits C=C into two C=O. Join the carbonyl carbons to find the alkene (propanal + propanone → CH₃CH₂CH=C(CH₃)₂).<\/li><li><b>E/Z isomerism<\/b> needs two different groups on EACH double-bond carbon. 2-Methylpropene cannot show it; but-2-ene, pent-2-ene and 2-hexene can.<\/li><li><b>Tests for C=C:<\/b> Br₂/CCl₄ and Baeyer's reagent. Cyclohexane does not decolourise them.<\/li><li><b>Kinetics:<\/b> rate-determining step = slowest step; higher temperature raises rate.<\/li><li><b>IUPAC naming:<\/b> longest chain with the principal group, lowest locants, prefixes alphabetical; COOH carbon is C1 (4-chloro-5-hydroxyhexanoic acid). 3,3-Dimethylbut-1-ene = CH₃C(CH₃)₂CH=CH₂.<\/li><li><b>Other:<\/b> fullerenes are covalent carbon cages; nanotubes are cylindrical; anionic polymerisation is started by a nucleophile. Inductive effect = σ polarisation that fades along the chain; mesomeric = π (resonance) shift. Synthons are idealised fragments of opposite polarity.<\/li><\/ul>","<ul class=\"nt\"><li><b>Contact process<\/b> (H₂SO₄): V₂O₅ catalyst (SO₂ → SO₃). <b>Haber process<\/b> (NH₃): iron catalyst.<\/li><li><b>Le Chatelier:<\/b> a system at equilibrium shifts to oppose any change imposed on it.<\/li><li><b>Neutral pH<\/b> = 7 at 25 °C; a buffer is a weak acid with its conjugate base (or the reverse).<\/li><li><b>Galvanising<\/b> = coating iron with zinc. The Nernst equation relates cell potential to concentration.<\/li><li><b>Noble gases<\/b> (Group 18) are chemically inert.<\/li><\/ul>"]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),Q=D.q,T=D.topics,NT=D.notes,L='ABCDE';
const app=document.getElementById('app'),byId=Object.fromEntries(Q.map(q=>[q.id,q]));
let S={seen:{},asked:[],missed:[],hist:[]};
try{const r=localStorage.getItem('chm102v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('chm102v1',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rec=(id,ok)=>{const s=S.seen[id]||(S.seen[id]={n:0,c:0,l:0});s.n++;if(ok)s.c++;s.l=ok?1:0};
const pct=(a,b)=>b?Math.round(100*a/b):0;
let z=null,tick=null,sel=0;
function stop(){clearInterval(tick);tick=null}
function home(){stop();z=null;const tot=Q.length,att=Object.keys(S.seen).length,mas=Object.values(S.seen).filter(s=>s.l).length;
app.innerHTML=`<h1>🧪 CHM 102 CBT</h1><div class="mu">${tot} verified questions · ${T.length} topics</div>
<div class="card row"><div class="stat"><b>${att}</b><span class="mu">attempted</span></div><div class="stat"><b>${mas}</b><span class="mu">answered right (last try)</span></div><div class="stat"><b>${S.hist.length}</b><span class="mu">exams taken</span></div></div>
<div class="bar"><i style="width:${pct(mas,tot)}%"></i></div><div class="mu">Mastery ${pct(mas,tot)}%</div>
<div class="card big" onclick="revise()"><span class="ico">📖</span><div><b>Revision</b><span class="mu">Topic notes plus every question with a full explanation</span></div></div>
<div class="card big" onclick="pSetup()"><span class="ico">✏️</span><div><b>Practice</b><span class="mu">Instant feedback and explanation after each answer</span></div></div>
<div class="card big" onclick="eSetup()"><span class="ico">⏱️</span><div><b>Exam mode</b><span class="mu">Timed, topic-balanced, no repeats between attempts</span></div></div>
<button class="btn s sm" onclick="if(confirm('Erase all progress?')){S={seen:{},asked:[],missed:[],hist:[]};save();home()}">Reset progress</button>`}
function opts(q,mark){return q.o.map((o,k)=>`<div class="rev ${k==q.a?'ok-t':''}">${L[k]}. ${esc(o)}${k==q.a?' ✓':''}</div>`).join('')}
function revise(){const c=T.map((_,i)=>Q.filter(q=>q.t==i)),h=c.map((a,i)=>{const m=a.filter(q=>(S.seen[q.id]||{}).l).length;return`<div class="card big" onclick="rTopic(${i})"><div style="flex:1"><b>${T[i]}</b><span class="mu">${a.length} questions · ${m} mastered</span><div class="bar"><i style="width:${pct(m,a.length)}%"></i></div></div>›</div>`}).join('');
app.innerHTML=`<button class="btn s sm" onclick="home()">‹ Home</button><h1>📖 Revision</h1>${h}`}
function rTopic(i){const a=Q.filter(q=>q.t==i);
app.innerHTML=`<button class="btn s sm" onclick="revise()">‹ Topics</button><h1>${T[i]}</h1><div class="card"><h2>Revision notes</h2>${NT[i]}</div>
<button class="btn" onclick="pStart(${i},'mix',20)">Practise this topic</button><h2>All ${a.length} questions with explanations</h2><div class="card">${a.map((q,n)=>`<details><summary>${n+1}. ${esc(q.q)}</summary><div style="margin-top:6px">${opts(q)}<div class="ex"><b>Why:</b> ${esc(q.e)}</div></div></details>`).join('')}</div>`}
function pSetup(){app.innerHTML=`<button class="btn s sm" onclick="home()">‹ Home</button><h1>✏️ Practice</h1><div class="card"><label class="mu">Topic</label><select id="pt"><option value="-1">All topics</option>${T.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select>
<label class="mu">Question order</label><select id="pm"><option value="mix">Mixed</option><option value="new">Unseen first</option><option value="weak">Weak and missed first</option></select>
<label class="mu">Number of questions</label><select id="pn"><option>10</option><option selected>20</option><option>40</option><option value="999">All available</option></select></div>
<button class="btn" onclick="pStart(+pt.value,pm.value,+pn.value)">Start practice</button>`}
function pStart(t,m,n){let a=Q.filter(q=>t<0||q.t==t),w=q=>{const s=S.seen[q.id];return!s?1:s.l?(s.c/s.n<.7?2.5:3):0};
a=sh(a);if(m=='new')a.sort((x,y)=>(!S.seen[y.id])-(!S.seen[x.id]));if(m=='weak')a.sort((x,y)=>w(x)-w(y));mk(a.slice(0,n).map(q=>q.id),'p',0)}
function eQuota(len){const N=Q.length,c=T.map((_,i)=>Q.filter(q=>q.t==i).length),q=c.map(x=>Math.max(2,Math.round(len*x/N)));
let s=q.reduce((a,b)=>a+b,0);while(s!=len){const i=q.indexOf(Math.max(...q.map((v,k)=>c[k]>v||s>len?v:-1)));q[i]+=s<len?1:-1;s+=s<len?1:-1}return q}
function eBuild(len){const q=eQuota(len),A=new Set(S.asked),M=new Set(S.missed),out=[];
T.forEach((_,t)=>{const p=sh(Q.filter(x=>x.t==t)),ms=p.filter(x=>M.has(x.id)),fr=p.filter(x=>!A.has(x.id)),rs=p.filter(x=>A.has(x.id)&&!M.has(x.id));
const pick=[],add=(l,k)=>{for(const x of l){if(pick.length>=k)break;if(!pick.includes(x))pick.push(x)}};
if(S.hist.length)add(ms,Math.ceil(q[t]*.3));add(fr,q[t]);add(ms,q[t]);add(rs,q[t]);add(p,q[t]);out.push(...pick)});return sh(out).map(x=>x.id)}
function eSetup(){const n=S.hist.length,A=new Set(S.asked),h=S.hist.slice(-5).reverse().map(e=>`<div class="top"><span>${e.d}</span><b>${e.s}/${e.t} (${pct(e.s,e.t)}%)</b></div>`).join('')||'<div class="mu">No attempts yet.</div>';
app.innerHTML=`<button class="btn s sm" onclick="home()">‹ Home</button><h1>⏱️ Exam mode</h1><div class="card"><h2>Attempt ${n+1}</h2><div class="mu">${n==0?'Attempt 1 samples every topic in proportion to its size.':n==1?'Attempt 2 uses NEW questions from every topic (about 70%) plus your earlier mistakes (about 30%), so after two attempts every topic has been tested and your weak points re-tested.':'Further attempts keep topic balance, bring back questions you missed, and then unseen ones.'}</div>
<div class="bar"><i style="width:${pct(A.size,Q.length)}%"></i></div><div class="mu">${A.size} of ${Q.length} questions covered in exams so far · ${S.missed.length} missed to revisit</div>
<label class="mu">Exam length</label><select id="el"><option value="40">40 questions · 33 min</option><option value="60" selected>60 questions · 50 min</option><option value="100">100 questions · 83 min</option></select></div>
<button class="btn" onclick="mk(eBuild(+el.value),'e',+el.value*50)">Start exam</button><div class="card"><h2>Recent attempts</h2>${h}</div>`}
function mk(ids,mode,secs){z={mode,secs,t0:Date.now(),i:0,grid:0,it:ids.map(id=>{const q=byId[id];let p=q.o.map((_,k)=>k);if(!/above|both|\bI\b|&|all of/i.test(q.o.join(' ')))p=sh(p);return{id,p,s:null,f:0}})};stop();if(secs)tick=setInterval(tm,1000);show()}
function tm(){const l=z.secs-Math.floor((Date.now()-z.t0)/1000),e=document.getElementById('tm');if(l<=0){finish();return}if(e){e.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');e.style.color=l<300?'var(--no)':''}}
function show(){const it=z.it[z.i],q=byId[it.id],ex=z.mode=='e',ans=!ex&&it.s!==null,n=z.it.length;
if(ex&&z.grid){app.innerHTML=`<div class="top"><h2>Question navigator</h2><button class="btn s sm" onclick="z.grid=0;show()">Close</button></div><div class="grid">${z.it.map((x,k)=>`<button class="g ${x.s!==null?'a':''} ${x.f?'f':''} ${k==z.i?'c':''}" onclick="z.i=${k};z.grid=0;show()">${k+1}</button>`).join('')}</div><div class="mu" style="margin:10px 0">Blue = answered · yellow outline = flagged · ${z.it.filter(x=>x.s!==null).length}/${n} answered</div><button class="btn" onclick="submit()">Submit exam</button>`;return}
app.innerHTML=`<div class="top"><button class="btn s sm" onclick="${ex?'submit()':'quit()'}">${ex?'Submit':'✕ End'}</button>${ex?'<span class="tm" id="tm"></span>':''}<span class="mu">${z.i+1} / ${n}</span></div>
<div class="bar"><i style="width:${pct(z.i+1,n)}%"></i></div><div class="card"><div class="tag">${T[q.t]}</div><p style="margin:.4rem 0 0"><b>${esc(q.q)}</b></p></div>
${it.p.map((o,k)=>{let c=ex?(it.s===k?'sel':''):ans?(o==q.a?'ok':it.s===k?'no':''):'';return`<button class="opt ${c}" onclick="pick(${k})"><span>${L[k]}</span><div>${esc(q.o[o])}</div></button>`}).join('')}
${ans?`<div class="ex"><b>${q.o[it.p[it.s]]==q.o[q.a]?'<span class="ok-t">Correct ✓</span>':'<span class="no-t">Incorrect ✗ — correct answer: '+L[it.p.indexOf(q.a)]+'</span>'}</b><br>${esc(q.e)}</div>`:''}
<div class="row">${ex?`<button class="btn s" onclick="z.i=Math.max(0,z.i-1);show()">‹ Prev</button><button class="btn s" onclick="z.it[z.i].f^=1;show()">${it.f?'⚑ Unflag':'⚐ Flag'}</button><button class="btn s" onclick="z.grid=1;show()">Grid</button>`:''}
<button class="btn" ${!ex&&!ans?'disabled style="opacity:.4"':''} onclick="nxt()">${z.i==n-1?(ex?'Review ›':'Finish'):'Next ›'}</button></div>`;if(ex)tm();window.scrollTo(0,0)}
function pick(k){const it=z.it[z.i],q=byId[it.id];if(z.mode=='e'){it.s=it.s===k?null:k}else{if(it.s!==null)return;it.s=k;rec(it.id,it.p[k]==q.a);save()}show()}
function nxt(){if(z.i<z.it.length-1){z.i++;show()}else if(z.mode=='e'){z.grid=1;show()}else finish()}
function quit(){if(z.it.some(x=>x.s!==null)){finish()}else home()}
function submit(){const u=z.it.filter(x=>x.s===null).length;if(confirm(u?`${u} unanswered. Submit exam?`:'Submit exam?'))finish()}
function finish(){stop();const ex=z.mode=='e',used=z.it.filter(x=>x.s!==null||ex),by={};let s=0;
z.it.forEach(it=>{const q=byId[it.id],ok=it.s!==null&&it.p[it.s]==q.a;it.ok=ok;if(it.s===null&&!ex)return;if(ok)s++;(by[q.t]=by[q.t]||[0,0])[1]++;if(ok)by[q.t][0]++;
if(ex){rec(it.id,ok);if(!S.asked.includes(it.id))S.asked.push(it.id);S.missed=S.missed.filter(x=>x!=it.id);if(!ok)S.missed.push(it.id)}});
const tot=ex?z.it.length:z.it.filter(x=>x.s!==null).length,secs=Math.floor((Date.now()-z.t0)/1000);
if(ex)S.hist.push({d:new Date().toLocaleDateString(),s,t:tot});save();z.res={s,tot,by,secs};result()}
function result(){const r=z.res,p=pct(r.s,r.tot),g=p>=70?'Excellent 🎉':p>=50?'Fair, keep revising':'Needs more work — revise the weak topics below';
app.innerHTML=`<h1>Results</h1><div class="card stat"><b style="font-size:2.2rem">${r.s} / ${r.tot}</b><div>${p}% · ${g}</div><div class="mu">Time ${Math.floor(r.secs/60)}m ${r.secs%60}s</div></div>
<div class="card"><h2>By topic</h2>${Object.keys(r.by).map(t=>{const[a,b]=r.by[t];return`<div class="top"><span>${T[t]}</span><b>${a}/${b}</b></div><div class="bar"><i style="width:${pct(a,b)}%;background:${a/b<.5?'var(--no)':'var(--ok)'}"></i></div>`}).join('')}</div>
<button class="btn" onclick="review(1)">Review mistakes with explanations</button><button class="btn s" onclick="review(0)">Review all answers</button><button class="btn s" onclick="home()">Home</button>`}
function review(w){const a=z.it.filter(it=>(it.s!==null||z.mode=='e')&&(!w||!it.ok));
app.innerHTML=`<button class="btn s sm" onclick="result()">‹ Results</button><h1>${w?'Mistakes':'All answers'} (${a.length})</h1>${a.map(it=>{const q=byId[it.id];return`<div class="card"><div class="tag">${T[q.t]}</div><p><b>${esc(q.q)}</b></p>${q.o.map((o,k)=>`<div class="rev ${k==q.a?'ok-t':it.s!==null&&it.p[it.s]==k?'no-t':''}">${L[k]}. ${esc(o)}${k==q.a?' ✓ correct':it.s!==null&&it.p[it.s]==k?' ✗ your answer':''}</div>`).join('')}${it.s===null?'<div class="no-t rev">Not answered</div>':''}<div class="ex"><b>Why:</b> ${esc(q.e)}</div></div>`}).join('')||'<div class="card">Nothing to show — perfect!</div>'}<button class="btn" onclick="home()">Home</button>`}
home();
</script></body></html>
